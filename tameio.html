n stays.","Ταμείο επιχείρησης κοντά στα Ελληνικά Λογιστικά Πρότυπα: κάθε κατηγορία έχει τον κωδικό λογαριασμού που χρησιμοποιούν οι λογιστές, και κάθε κίνηση κρατά παραστατικό, πελάτη ή προμηθευτή, ΑΦΜ, ΦΠΑ και τρόπο πληρωμής. Στο τέλος του μήνα στέλνεις στον λογιστή το «📤 Αρχείο για τον λογιστή». Είναι κρυμμένο μέχρι να τσεκάρεις παρακάτω «Να φαίνεται στο Ταμείο».":"Business book close to the Greek Accounting Standards: every category has the account code accountants use, and every entry keeps document, customer or supplier, tax number, VAT and payment method. At the end of the month you send the accountant the “📤 File for the accountant”. It stays hidden until you tick “Show in Cash” below.",Τιμολόγιο:"Invoice","Τράπεζα (μεταφορά)":"Bank (transfer)","Τραπεζικό έγγραφο":"Bank document","Τρόπος πληρωμής":"Payment method","Τόκοι και έξοδα τραπεζών":"Interest and bank charges",Υποκατηγορία:"Subcategory","ΦΠΑ %":"VAT %","ΦΠΑ εξόδων":"Input VAT (expenses)","ΦΠΑ εσόδων":"Output VAT (income)","Χρήματα από μετόχους ή ιδιοκτήτη":"Money from shareholders or owner","Χωρίς ΦΠΑ":"No VAT","Χωρίς παραστατικό":"No document","π.χ. Α-125":"e.g. A-125","Για διαχειριστές πολυκατοικίας: έσοδα από τα διαμερίσματα και έξοδα όπως ανελκυστήρας, καθαριότητα, απολύμανση, ρεύμα και θέρμανση. Είναι κρυμμένο μέχρι να τσεκάρεις παρακάτω «Να φαίνεται στο Ταμείο». Τις κατηγορίες τις αλλάζεις όπως θέλεις από το «Κατηγορίες».":"For building administrators: income from the apartments and expenses such as elevator, cleaning, disinfection, electricity and heating. It stays hidden until you tick “Show in Cash” below. Change the categories as you like from “Categories”.",Διαμερίσματα:"Apartments",Νερό:"Water",Απολύμανση:"Disinfection",Επισκευές:"Repairs",Διαχείριση:"Administration",Καθαριότητα:"Cleaning",Κοινόχρηστα:"Building fees",Κήπος:"Garden",Θέρμανση:"Heating","Ασφάλεια κτιρίου":"Building insurance",Πυρασφάλεια:"Fire safety","Ρεύμα κοινοχρήστων":"Common areas electricity","Έκτακτη εισφορά":"Special
