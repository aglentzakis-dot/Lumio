async function deriveKey(pass,salt){const base=await crypto.subtle.importKey('raw',TE.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:210000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function aesEnc(key,u8){const iv=rand(12);const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,u8));return{iv:b64(iv),ct:b64(ct)};}
async function aesDec(key,o){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},key,unb64(o.ct)));}
const importRaw=raw=>crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);
async function wrapRaw(raw,pass){const salt=rand(16);const k=await deriveKey(pass,salt);return{salt:b64(salt),...await aesEnc(k,raw)};}
async function unwrapRaw(w,pass){const k=await deriveKey(pass,unb64(w.salt));return aesDec(k,w);}
async function encJSON(key,obj){return aesEnc(key,TE.encode(JSON.stringify(obj)));}
async function decJSON(key,o){return JSON.parse(TD.decode(await aesDec(key,o)));}

/* ---- συμπίεση για συνδέσμους ---- */
async function packLink(obj){const data=TE.encode(JSON.stringify(obj));let out=data,z='j';if(window.CompressionStream){try{const cs=new CompressionStream('deflate-raw');const s=new Blob([data]).stream().pipeThrough(cs);out=new Uint8Array(await new Response(s).arrayBuffer());z='z';}catch(e){}}return z+b64(out).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
async function unpackLink(str){const z=str[0];let s=str.slice(1).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';let u8=unb64(s);if(z==='z'){const ds=new DecompressionStream('deflate-raw');u8=new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer());}return JSON.parse(TD.decode(u8));}

/* ---- αποθήκευση IndexedDB ---- */
const IDB={db:null,
  open(){if(this.db)return Promise.resolve(this.db);return new Promise((res,rej)=>{const r=indexedDB.open('paidagogos-ai',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res(this.db);};r.onerror=()=>rej(r.error);});},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('kv',mode);const st=t.objectStore('kv');const r=fn(st);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);});},
  ls:false,
  async init(){try{if(!window.indexedDB)throw 0;await this.open();await this.tx('readwrite',s=>s.put(1,'_probe'));const v=await this.tx('readonly',s=>s.get('_probe'));if(v!==1)throw 0;}catch(e){this.ls=true;}},
  _k:k=>'lumio:'+k,
  get(k){if(this.ls){try{const v=localStorage.getItem(this._k(k));return Promise.resolve(v==null?undefined:JSON.parse(v));}catch(e){return Promise.resolve(undefined);}}return this.tx('readonly',s=>s.get(k));},
  set(k,v){if(this.ls){try{localStorage.setItem(this._k(k),JSON.stringify(v));}catch(e){toast('Ο χώρος αποθήκευσης της συσκευής γέμισε.','bad');}return Promise.resolve();}return this.tx('readwrite',s=>s.put(v,k));},
  del(k){if(this.ls){try{localStorage.removeItem(this._k(k));}catch(e){}return Promise.resolve();}return this.tx('readwrite',s=>s.delete(k));},
  keys(){if(this.ls){const o=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('lumio:'))o.push(k.slice(6));}}catch(e){}return Promise.resolve(o);}return this.tx('readonly',s=>s.getAllKeys());}
};

function genRecovery(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const r=rand(16);let c='';for(let i=0;i<16;i++){c+=A[r[i]%A.length];if(i%4===3&&i<15)c+='-';}return c;}

async function createAdmin({name,username,pass,org,email,remember=true}){const raw=rand(32);const code=genRecovery();S.meta={schema:2,org:org||'',created:new Date().toISOString(),users:[{id:uid(),name,email:(email||'').trim().toLowerCase(),username:username.trim().toLowerCase(),role:'admin',wrap:await wrapRaw(raw,pass),recWrap:await wrapRaw(raw,code),earnWrap:null,created:new Date().toISOString()}]};await saveMeta();S.raw=raw;S.dataKey=await importRaw(raw);S.data=defaultData();S.data.settings.termsOk=LEGAL_VER;S.user=S.meta.users[0];await saveNow();if(remember)await Session.save();return code;}
async function login(username,pass,remember=true){if(Date.now()<S.lockUntil)throw new Error('Πολλές αποτυχημένες προσπάθειες. Δοκίμασε ξανά σε λίγα δευτερόλεπτα.');const u=S.meta.users.find(x=>x.username===username.trim().toLowerCase());let raw;try{if(!u)throw 0;raw=await unwrapRaw(u.wrap,pass);}catch(e){S.fails++;if(S.fails>=5){S.lockUntil=Date.now()+30000;S.fails=0;}throw new Error('Λάθος όνομα χρήστη ή κωδικός.');}S.fails=0;await openVault(u,raw);if(remember)await Session.save();else await Session.clear();}

const Session={
  async devKey(){if(IDB.ls){let r=await IDB.get('devkeyraw');if(!r){r=b64(rand(32));await IDB.set('devkeyraw',r);}return importRaw(unb64(r));}let k=await IDB.get('devkey');if(!k){k=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);await IDB.set('devkey',k);}return k;},
  async save(){try{const k=await this.devKey();await IDB.set('session',{userId:S.user.id,at:new Date().toISOString(),...await aesEnc(k,S.raw)});}catch(e){console.warn('session',e);}},
  async restore(){try{const s=await IDB.get('session');if(!s)return false;const u=S.meta.users.find(x=>x.id===s.userId);if(!u){await this.clear();return false;}const k=IDB.ls?await this.devKey():await IDB.get('devkey');if(!k)return false;const raw=await aesDec(k,s);await openVault(u,raw);return true;}catch(e){await this.clear();return false;}},

/* ---- κοινός φάκελος αντιγράφων ασφαλείας ---- */
const Backup={
  hdb(){return new Promise((res,rej)=>{const r=indexedDB.open('shared-backups',1);r.onupgradeneeded=()=>r.result.createObjectStore('handles');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});},
  async getRoot(){try{const db=await this.hdb();return await new Promise(res=>{const t=db.transaction('handles','readonly').objectStore('handles').get('root');t.onsuccess=()=>res(t.result||null);t.onerror=()=>res(null);});}catch(e){return null;}},
  async setRoot(h){const db=await this.hdb();await new Promise(res=>{const t=db.transaction('handles','readwrite');t.objectStore('handles').put(h,'root');t.oncomplete=res;});},
  async forgetRoot(){const db=await this.hdb();await new Promise(res=>{const t=db.transaction('handles','readwrite');t.objectStore('handles').delete('root');t.oncomplete=res;});},
  supported(){return'showDirectoryPicker'in window;},
  async pick(){const h=await window.showDirectoryPicker({id:'backups',mode:'readwrite',startIn:'downloads'});await this.setRoot(h);return h;},
  async perm(h,ask){const o={mode:'readwrite'};if(await h.queryPermission(o)==='granted')return true;if(ask)return(await h.requestPermission(o))==='granted';return false;},
  async snapshot(){const keys=await IDB.keys();const out={app:'LUMIO',version:APP_VERSION,created:new Date().toISOString(),encrypted:true,kv:{}};for(const k of keys){if(['session','devkey','devkeyraw','_probe'].includes(k))continue;out.kv[k]=await IDB.get(k);}try{if(S.user&&S.dataKey){const o={};TM.lsKeys().forEach(k=>{if(k.includes(S.user.id))o[k]=localStorage.getItem(k);});if(Object.keys(o).length)out.kv['tm:'+S.user.id]=await encJSON(S.dataKey,o);}}catch(e){}return out;},
  fileName(){return BACKUP_SUB+'-'+todayISO()+'.json';},
  async write(ask=false){const snap=JSON.stringify(await this.snapshot());const root=await this.getRoot();if(root&&await this.perm(root,ask)){const dir=await root.getDirectoryHandle(BACKUP_SUB,{create:true});const fh=await dir.getFileHandle(this.fileName(),{create:true});const w=await fh.createWritable();await w.write(snap);await w.close();localStorage.setItem('pai-lastbackup',new Date().toISOString());return'folder';}if(ask){this.download(snap);return'download';}return null;},
  download(snap){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([snap],{type:'application/json'}));a.download=this.fileName();a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);localStorage.setItem('pai-lastbackup',new Date().toISOString());},
  auto:debounce(async function(){try{await Backup.write(false);}catch(e){}},5000),
  async list(){const root=await this.getRoot();if(!root||!await this.perm(root,true))return null;const dir=await root.getDirectoryHandle(BACKUP_SUB,{create:true});const files=[];for await(const [n,h] of dir.entries()){if(h.kind==='file'&&n.endsWith('.json'))files.push({name:n,h});}files.sort((a,b)=>b.name.localeCompare(a.name));return files.slice(0,10);},
  async restoreText(txt){const o=JSON.parse(txt);if(!['LUMIO','Paidagogos-AI'].includes(o.app)||!o.kv||!o.kv.meta)throw new Error('Το αρχείο δεν είναι αντίγραφο του LUMIO.');const keys=await IDB.keys();for(const k of keys)if(!['devkey','devkeyraw'].includes(k))await IDB.del(k);for(const k in o.kv)await IDB.set(k,o.kv[k]);}
};

const Sound={ctx:null,play(kind){try{if(S.data&&S.data.settings.sound===false)return;if(localStorage.getItem('pai-mute')==='1')return;this.ctx=this.ctx||new(window.AudioContext||window.webkitAudioContext)();const c=this.ctx;const seq=kind==='ok'?[660,880]:kind==='win'?[523,659,784,1046]:[300,220];seq.forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,c.currentTime+i*.11);g.gain.exponentialRampToValueAtTime(.18,c.currentTime+i*.11+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+i*.11+.18);o.connect(g).connect(c.destination);o.start(c.currentTime+i*.11);o.stop(c.currentTime+i*.11+.2);});}catch(e){}}};

/* ---- υδατογράφημα στα PDF (ίδια λογική με το Δρομολόγιο) ---- */
const MARK_DEF={on:true,mode:'logo',text:'',img:'',op:.08,size:.6,tilt:true,angle:-20,fill:false,mx:0,my:0};
function markCfg(){const m=(S.data&&S.data.settings&&S.data.settings.mark)||{};return Object.assign({},MARK_DEF,m);}
function markImage(c){return new Promise(res=>{if(c.mode==='text')return res(null);const src=c.mode==='image'&&c.img?c.img:svgURL(LOGO_ART.replace('<svg ','<svg width="600" height="600" '));const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src=src;});}
function drawMark(e,t,n,a,img){const top=n*.035,c=Math.max(120,n-top*2);const s=String(a.mode==='text'?(a.text||''):'').trim();if(a.on===false)return;if(!s&&!img)return;
  const l=Math.max(.25,Math.min(1,+a.size||.6)),d=(a.tilt===false?0:a.angle==null?-20:+a.angle)*Math.PI/180,h=t/2+t*((+a.mx||0)/100),u=top+c/2+c*((+a.my||0)/100);
  e.save();e.globalAlpha=Math.max(.02,Math.min(.3,+a.op||.08));
  if(s){e.translate(h,u);e.rotate(d);e.textAlign='center';e.textBaseline='middle';e.fillStyle='#2E2A33';let f=240;e.font='bold '+f+'px Commissioner,system-ui,sans-serif';const r=e.measureText(s).width||1,p=t*l*(d?.86:.96);f=Math.max(18,Math.min(420,Math.round(f*p/r)));if(f>c*l*1.25)f=Math.round(c*l*1.25);e.font='bold '+f+'px Commissioner,system-ui,sans-serif';e.fillText(s,0,0);}
  else{const iw=img.naturalWidth||img.width||1,ih=img.naturalHeight||img.height||1;if(a.fill===false){const W=t*l,H=Math.min(c*l,W*ih/iw),w2=H*iw/ih;e.translate(h,u);e.rotate(d);e.drawImage(img,-w2/2,-H/2,w2,H);}
    else{const g=Math.max(90,t*l*.46),y=ih*(g/iw),b=Math.hypot(t,c)*1.2;e.translate(h,u);e.rotate(d);const w=g*1.22,v=y*1.7;for(let k=-b;k<=b;k+=v)for(let x=-b;x<=b;x+=w)e.drawImage(img,x,k,g,y);}}
  e.restore();}
async function markPNG(c,W=1240,H=1754){c=c||markCfg();if(c.on===false)return null;const img=await markImage(c);if(c.mode!=='text'&&!img)return null;if(c.mode==='text'&&!String(c.text||'').trim())return null;const cv=document.createElement('canvas');cv.width=W;cv.height=H;drawMark(cv.getContext('2d'),W,H,c,img);return cv.toDataURL('image/png');}
async function makePDF(el,filename){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js');let mk=null;try{mk=await markPNG();}catch(e){}
  /* το html2pdf αντιγράφει το στοιχείο με τα στυλ του: αν είναι κρυμμένο έξω από την οθόνη, η αντιγραφή βγαίνει κι αυτή έξω → κενό PDF. Το κρύβουμε σε περιτύλιγμα και το αφήνουμε κανονικό. */
  let wrap=null;if(el.style&&/fixed|absolute/.test(el.style.position)&&parseInt(el.style.left)<0){wrap=document.createElement('div');wrap.style.cssText='position:fixed;left:-10000px;top:0;width:794px;overflow:hidden';el.parentNode.insertBefore(wrap,el);wrap.appendChild(el);el.style.position='static';el.style.left='0';el.style.top='0';el.style.width='794px';el.style.background='#fff';}

/* ---- ασφαλής αριθμητικός υπολογισμός ---- */
function calcExpr(src){const s=String(src).replace(/×|x(?=\s*\d)/g,'*').replace(/÷|:/g,'/').replace(/−/g,'-').replace(/(\d),(\d)/g,'$1.$2');let i=0;const peek=()=>s[i],ws=()=>{while(s[i]===' ')i++;};
  function num(){ws();if(s[i]==='('){i++;const v=add();ws();if(s[i]!==')')throw 0;i++;return v;}if(s[i]==='-'){i++;return-num();}const m=/^\d+(\.\d+)?/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return parseFloat(m[0]);}
  function mul(){let v=num();for(;;){ws();const c=peek();if(c==='*'){i++;v*=num();}else if(c==='/'){i++;const d=num();if(d===0)throw 0;v/=d;}else return v;}}
  function add(){let v=mul();for(;;){ws();const c=peek();if(c==='+'){i++;v+=mul();}else if(c==='-'){i++;v-=mul();}else return v;}}
  try{const v=add();ws();if(i<s.length)return null;return v;}catch(e){return null;}}
function parseNum(str){if(str==null)return null;const t=String(str).trim();const f=/^(-?\d+)\s*\/\s*(\d+)$/.exec(t);if(f)return+f[1]/+f[2];const mx=/^(\d+)\s+(\d+)\/(\d+)$/.exec(t);if(mx)return+mx[1]+(+mx[2]/+mx[3]);const m=/-?\d+(?:[.,]\d+)?/.exec(t.replace(/\.(?=\d{3}\b)/g,''));return m?parseFloat(m[0].replace(',','.')):null;}
const numEq=(a,b)=>a!=null&&b!=null&&Math.abs(a-b)<1e-6*Math.max(1,Math.abs(b));
const norm=s=>String(s??'').trim().toLowerCase().replace(/\s+/g,' ');
const normLoose=s=>norm(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ς/g,'σ').replace(/[.,!;·]/g,'');

/* ---- έλεγχος κλειδιών απαντήσεων ---- */
function verifyContent(c){const notes=[];let fixed=0,flagged=0;
  (c.items||[]).forEach((it,ix)=>{it._flag='';it._fix='';
    if(!it.q){it._flag='Λείπει η ερώτηση.';flagged++;return;}
    if(Array.isArray(it.options)){it.options=[...new Set(it.options.map(o=>String(o).trim()).filter(Boolean))];}
    if(it.calc){const v=calcExpr(it.calc);if(v==null){it._flag='Δεν υπολογίστηκε η έκφραση «'+it.calc+'».';flagged++;}else{const a=parseNum(it.answer);if(!numEq(a,v)){const opt=(it.options||[]).find(o=>numEq(parseNum(o),v));const vs=Number.isInteger(v)?String(v):String(Math.round(v*1000)/1000).replace('.',',');if(opt){it._fix=`Το κλειδί διορθώθηκε από «${it.answer}» σε «${opt}» (υπολογισμός ${it.calc} = ${vs}).`;it.answer=opt;fixed++;}else if(!it.options||!it.options.length){it._fix=`Το κλειδί διορθώθηκε από «${it.answer}» σε «${vs}» (υπολογισμός ${it.calc}).`;it.answer=vs;fixed++;}else{it._flag=`Ο υπολογισμός ${it.calc} δίνει ${vs}, που δεν υπάρχει στις επιλογές. Χρειάζεται έλεγχος.`;flagged++;}}}}
    if(it.options&&it.options.length){if(!it.options.some(o=>norm(o)===norm(it.answer))){const near=it.options.find(o=>normLoose(o)===normLoose(it.answer));if(near){it.answer=near;}else{it._flag=(it._flag?it._flag+' ':'')+'Η σωστή απάντηση δεν βρίσκεται στις επιλογές.';flagged++;}}if(it.options.length<2){it._flag=(it._flag?it._flag+' ':'')+'Λίγες επιλογές.';flagged++;}}
    if(!it.answer&&!it._flag){it._flag='Λείπει η σωστή απάντηση.';flagged++;}
  });
  (c.pairs||[]).forEach(p=>{p.a=String(p.a??'').trim();p.b=String(p.b??'').trim();});
  if(c.pairs)c.pairs=c.pairs.filter(p=>p.a&&p.b);
  if(fixed)notes.push(fixed+' κλειδιά απαντήσεων διορθώθηκαν αυτόματα με υπολογισμό.');
  if(flagged)notes.push(flagged+' σημεία θέλουν τον έλεγχό σου.');
  return{fixed,flagged,notes,checkedAt:new Date().toISOString()};}

const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function numOpts(ans,spread=3){const s=new Set([ans]);let g=0;while(s.size<4&&g<60){g++;const d=rnd(-spread*2,spread*2)||1;const v=ans+d;if(v>=0)s.add(v);}return shuffle([...s]).map(String);}
function localMath({op,level=3,count=10,theme='neutral',words=false}){const R={1:[1,10],2:[2,20],3:[5,60],4:[10,200],5:[50,1000]}[level]||[5,60];const T=MATH_STORIES[theme]||MATH_STORIES.neutral;const items=[];const ops=op?[op]:['+','-','*','/'];

    items.push({q,options:numOpts(ans,Math.max(2,Math.round(ans*.15))),answer:String(ans),calc:expr,concept,hint:o==='-'?'Ξεκίνα από το μεγαλύτερο και μέτρα προς τα πίσω.':o==='*'?'Ο πολλαπλασιασμός είναι επαναλαμβανόμενη πρόσθεση.':o==='/'?'Σκέψου: ποιος αριθμός επί '+b+' κάνει '+a+';':'Πρόσθεσε πρώτα τις μονάδες.',explain:`${a} ${sym} ${b} = ${ans}`});}

function localVerbs({count=10,focus='both'}){const vs=shuffle(VERBS).slice(0,count);return vs.map((v,k)=>{const askAor=focus==='aor'?true:focus==='par'?false:k%2===0;const right=askAor?v[2]:v[1];const pool=shuffle(VERBS.filter(x=>x!==v)).slice(0,2).map(x=>askAor?x[2]:x[1]);const opts=shuffle([right,askAor?v[1]:v[2],...pool]).slice(0,4);if(!opts.includes(right))opts[0]=right;

function resultsOf(sid){return S.data.results.filter(r=>r.studentId===sid).sort((a,b)=>a.date.localeCompare(b.date));}
function conceptStats(sid,sinceISO){const m={};for(const r of resultsOf(sid)){if(sinceISO&&r.date<sinceISO)continue;for(const a of r.answers||[]){const c=a.concept||'Γενικά';const o=m[c]||(m[c]={concept:c,total:0,wrong:0,sessions:new Set(),wrongSessions:new Set(),subject:r.subject,last:r.date,recent:[]});o.total++;o.sessions.add(r.id);if(!a.ok){o.wrong++;o.wrongSessions.add(r.id);}o.last=r.date;o.recent.push(a.ok?1:0);}}
  return Object.values(m).map(o=>({...o,acc:pctOf(o.total-o.wrong,o.total),recentAcc:pctOf(o.recent.slice(-8).reduce((x,y)=>x+y,0),Math.min(8,o.recent.length)),sessions:o.sessions.size,wrongSessions:o.wrongSessions.size}));}
function weakConcepts(sid,since){return conceptStats(sid,since).filter(c=>c.total>=3&&c.recentAcc<70).sort((a,b)=>a.recentAcc-b.recentAcc);}
function masteredConcepts(sid){return conceptStats(sid).filter(c=>c.total>=6&&c.recentAcc>=90);}
function recurringMistakes(st){return conceptStats(st.id).filter(c=>c.wrongSessions>=2&&c.wrong>=3&&c.recentAcc<70).map(c=>`${stuName(st)} εμφανίζει επαναλαμβανόμενη δυσκολία σε: «${c.concept}» (${c.wrong} λάθη σε ${c.wrongSessions} δραστηριότητες, πρόσφατη επιτυχία ${c.recentAcc}%).`);}
const LEVEL_FROM={'Αρχάριο':2,'Χαμηλό':2,'Μέτριο':3,'Καλό':4,'Πολύ καλό':4,'Προχωρημένο':5};
function levelOf(st,subject){st.levels=st.levels||{};if(st.levels[subject])return st.levels[subject];return LEVEL_FROM[st.knowledge]||3;}
function applyAdaptive(st,result){const subj=result.subject||'Γενικά';const cur=levelOf(st,subj);let nl=cur,why;if(result.pct>=90){nl=Math.min(5,cur+1);why='≥90% επιτυχία — αυξάνεται σταδιακά η δυσκολία.';}else if(result.pct>=60){why='60–89% — διατηρείται το ίδιο επίπεδο.';}else{nl=Math.max(1,cur-1);why='<60% — μειώνεται η δυσκολία και αυξάνεται η υποστήριξη.';}
  st.levels[subj]=nl;st.levelLog=st.levelLog||[];st.levelLog.push({date:result.date,subject:subj,from:cur,to:nl,pct:result.pct});st.support=st.support||{};st.support[subj]=result.pct<60;return{from:cur,to:nl,why};}
function needsSupport(st,subject){return!!(st&&st.support&&st.support[subject])||(st&&levelOf(st,subject)<=1);}
function learningIdentity(st,{forAI=false}={}){const subjects=Object.keys(st.levels||{});const lv=subjects.map(s=>`${s}: ${st.levels[s]}/5`).join(', ');const weak=weakConcepts(st.id).slice(0,6).map(c=>`${c.concept} (${c.recentAcc}% πρόσφατη επιτυχία)`);const mast=masteredConcepts(st.id).slice(0,6).map(c=>c.concept);const rs=resultsOf(st.id);
  const lines=[`Κωδικός μαθητή: ${st.code}`,st.age&&`Ηλικία: ${st.age}`,st.grade&&`Τάξη: ${st.grade}`,st.subjects&&`Μαθήματα: ${st.subjects}`,st.knowledge&&`Επίπεδο γνώσεων: ${st.knowledge}`,lpText(st,'strengths')&&`Δυνατά σημεία: ${lpText(st,'strengths')}`,st.difficulties&&`Δυσκολίες: ${st.difficulties}`,lpText(st,'goals')&&`Εκπαιδευτικοί στόχοι: ${lpText(st,'goals')}`,st.favorites&&`Αγαπημένα θέματα: ${st.favorites}`,...LP_CATS.filter(c=>!['strengths','goals'].includes(c.key)).map(c=>{const t=lpText(st,c.key);return t&&`${c.name}: ${t}`;}),st.prior&&`Προηγούμενες επιδόσεις: ${st.prior}`,lv&&`Τρέχοντα επίπεδα δυσκολίας ανά μάθημα (1-5): ${lv}`,weak.length&&`Αδυναμίες από τα δεδομένα: ${weak.join('; ')}`,mast.length&&`Κατακτημένες δεξιότητες: ${mast.join(', ')}`,rs.length&&`Δραστηριότητες μέχρι τώρα: ${rs.length}, μέση επίδοση ${Math.round(avg(rs.map(r=>r.pct)))}%`,(forAI?S.data.settings.sendNotes:true)&&st.notes&&`Σημειώσεις παιδαγωγού: ${st.notes}`];return lines.filter(Boolean).join('\n');}
function recordResult(res){const st=S.data.students.find(s=>s.id===res.studentId);S.data.results.push(res);let adapt=null;if(st)adapt=applyAdaptive(st,res);if(res.assignmentId){const a=S.data.assignments.find(x=>x.id===res.assignmentId);if(a){a.status='done';a.doneAt=res.date;}}for(const p of S.data.programs){for(const w of p.weeks||[])for(const s of w.sessions||[])if(s.materialId&&s.materialId===res.materialId&&p.studentId===res.studentId&&!s.done){s.done=true;s.resultId=res.id;}}save();return adapt;}

const AI={models:null,
  async listModels(force){if(this.models&&!force)return this.models;const cached=JSON.parse(localStorage.getItem('pai-models')||'null');if(!force&&cached&&Date.now()-cached.t<6*3600e3){this.models=cached.m;return this.models;}const r=await fetch('https://openrouter.ai/api/v1/models');const j=await r.json();const m=(j.data||[]).filter(x=>/:free$/.test(x.id)||(x.pricing&&+x.pricing.prompt===0&&+x.pricing.completion===0)).map(x=>({id:x.id,name:x.name,ctx:x.context_length||0,vision:((x.architecture&&(x.architecture.input_modalities||[]).join(','))||(x.architecture&&x.architecture.modality)||'').includes('image')}));this.models=m;localStorage.setItem('pai-models',JSON.stringify({t:Date.now(),m}));return m;},
  rank(m){const pref=[/gemini.*flash/i,/deepseek.*(chat|v3)/i,/llama-?4/i,/llama-3\.3-70b/i,/qwen.*(2\.5|3).*(72|235|vl)/i,/mistral.*(small|medium)/i,/gemma-3/i,/qwen/i,/llama/i];const i=pref.findIndex(re=>re.test(m.id));return(i<0?99:i)*1e7-Math.min(m.ctx,9e6);},
  async candidates(vision){const set=S.data.settings.model;let list=[];try{list=(await this.listModels()).filter(m=>!vision||m.vision).sort((a,b)=>this.rank(a)-this.rank(b)).map(m=>m.id);}catch(e){}if(set&&set!=='auto'){list=[set,...list.filter(x=>x!==set)];}if(!list.length)list=vision?['google/gemini-2.0-flash-exp:free','qwen/qwen2.5-vl-72b-instruct:free']:['deepseek/deepseek-chat-v3-0324:free','meta-llama/llama-3.3-70b-instruct:free','google/gemini-2.0-flash-exp:free'];return list.slice(0,5);},
  async chat(messages,{vision=false,temperature=.7,avoid=null}={}){const key=S.data.settings.aiKey;if(!key)throw new Error('NOKEY');let cands=await this.candidates(vision);if(avoid&&cands.length>1)cands=cands.filter(x=>x!==avoid).concat(cands.includes(avoid)?[avoid]:[]);let lastErr='';
    for(const model of cands){try{const r=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json','HTTP-Referer':location.origin,'X-Title':'Paidagogos AI'},body:JSON.stringify({model,messages,temperature,max_tokens:6000})});const j=await r.json().catch(()=>({}));if(!r.ok||j.error){lastErr=(j.error&&j.error.message)||('Σφάλμα '+r.status);if(r.status===401)throw new Error('Το κλειδί πρόσβασης δεν είναι έγκυρο. Έλεγξέ το στις Ρυθμίσεις.');continue;}const t=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;if(!t){lastErr='Κενή απάντηση';continue;}return{text:t,model};}catch(e){if(/κλειδί/.test(e.message))throw e;lastErr=e.message;}}
    throw new Error('Η τεχνητή νοημοσύνη δεν απάντησε ('+lastErr+'). Τα δωρεάν μοντέλα έχουν όρια — δοκίμασε ξανά σε λίγο.');},
  parse(t){t=String(t).replace(/```json|```/g,'');const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<0)throw new Error('χωρίς JSON');return JSON.parse(t.slice(a,b+1));},
  async json(system,user,opts={}){const msgs=[{role:'system',content:system},{role:'user',content:user}];const r=await this.chat(msgs,opts);try{const o=this.parse(r.text);o._model=r.model;return o;}catch(e){const r2=await this.chat([...msgs,{role:'assistant',content:r.text},{role:'user',content:'Η απάντηση δεν ήταν έγκυρο JSON. Στείλε ξανά ΜΟΝΟ το έγκυρο αντικείμενο JSON, χωρίς κείμενο πριν ή μετά.'}],{...opts,temperature:.2});const o=this.parse(r2.text);o._model=r2.model;return o;}}
};
const AI_SYSTEM=`Είσαι το «LUMIO», δημιουργικός εκπαιδευτικός συνεργάτης για παιδαγωγούς, ειδικούς παιδαγωγούς και εκπαιδευτικούς στην Ελλάδα.
Κανόνες:
- Γράφεις σε σωστά, φυσικά ελληνικά με σωστό τονισμό.
- Το περιεχόμενο είναι κατάλληλο για την ηλικία, ακριβές και, όπου ταιριάζει, συμβατό με το ελληνικό αναλυτικό πρόγραμμα της αντίστοιχης τάξης.
- Κανένα ακατάλληλο, βίαιο, τρομακτικό ή επικίνδυνο περιεχόμενο· καμία επικίνδυνη οδηγία.
- Μην παρουσιάζεις ως βέβαιο κάτι που δεν είναι επαληθευμένο. Αν δεν είσαι σίγουρος για ένα στοιχείο, μην το χρησιμοποιήσεις και γράψε μια σημείωση στο πεδίο "warnings".
- Ποτέ ιατρική, ψυχολογική ή διαγνωστική αξιολόγηση. Μόνο εκπαιδευτικές παρατηρήσεις και προτάσεις.
- Χρησιμοποίησε μόνο πραγματικές, σωστές ελληνικές λέξεις. Πρόσεξε λέξεις που μοιάζουν αλλά σημαίνουν άλλο (π.χ. «σφυρίχτρα» ≠ «σφυρί», «μπάλα» ≠ «μπάλλα»).
- Κάθε ερώτηση πρέπει να έχει ΜΙΑ μόνο αναμφίβολα σωστή απάντηση· οι λάθος επιλογές να είναι σαφώς λάθος.
- Έλεγξε δύο φορές κάθε σωστή απάντηση. Στα μαθηματικά συμπλήρωσε το πεδίο "calc" με την αριθμητική έκφραση (μόνο αριθμοί, + - * / και παρενθέσεις) που δίνει τη σωστή απάντηση.
- Η "answer" να είναι γραμμένη ΑΚΡΙΒΩΣ όπως μία από τις "options".
- Μη χρησιμοποιείς ονόματα προστατευμένων χαρακτήρων ή εμπορικά σήματα· αν το παιδί αγαπά κάποιο προϊόν ή παιχνίδι, εμπνεύσου γενικά το ύφος του (π.χ. «κύβοι και κατασκευές») χωρίς ονόματα.
- Η αισθητική και η γλώσσα προσαρμόζονται στην ηλικία: για εφήβους ύφος ώριμο, όχι παιδικό.
- Απαντάς ΜΟΝΟ με ένα έγκυρο αντικείμενο JSON, χωρίς σχόλια ή άλλο κείμενο.`;
const ITEM_SCHEMA=`{"scene":"(προαιρετικό: σύντομη σκηνή ιστορίας πριν την ερώτηση)","q":"ερώτηση","options":["...","...","...","..."],"answer":"μία από τις options","concept":"η έννοια/δεξιότητα που ελέγχει","hint":"βοήθεια χωρίς να αποκαλύπτει την απάντηση","explain":"σύντομη εξήγηση της σωστής απάντησης","calc":"(μόνο για μαθηματικά)"}`;
function stuCtx(st,age,grade){if(st)return'ΜΑΘΗΣΙΑΚΗ ΤΑΥΤΟΤΗΤΑ ΜΑΘΗΤΗ:\n'+learningIdentity(st,{forAI:true});return`Χωρίς συγκεκριμένο μαθητή. ${age?'Ηλικία: '+age+'. ':''}${grade?'Τάξη: '+grade+'.':''}`;}
function promptGame(o){return`${stuCtx(o.student,o.age,o.grade)}

ΑΙΤΗΜΑ ΠΑΙΔΑΓΩΓΟΥ: «${o.prompt}»
${o.sourceText?'\nΥΛΙΚΟ ΠΗΓΗΣ (βάσισε το περιεχόμενο ΑΠΟΚΛΕΙΣΤΙΚΑ σε αυτό):\n"""'+o.sourceText.slice(0,12000)+'"""\n':''}
Ρυθμίσεις: είδος παιχνιδιού: ${o.gameType==='auto'?'διάλεξε εσύ το καταλληλότερο για τον στόχο και το παιδί':o.gameType}. Θέμα/αισθητική: ${o.theme==='auto'?'διάλεξε από τα ενδιαφέροντα':o.theme}. Δυσκολία 1-5: ${o.level}${o.support?' (το παιδί χρειάζεται περισσότερη υποστήριξη: απλή διατύπωση, καλές βοήθειες)':''}. Αριθμός ερωτήσεων: ${o.count}. ${o.subject&&o.subject!=='auto'?'Μάθημα: '+o.subject+'.':''}
Επιτρεπτά gameType: ${Object.keys(GAME_TYPES).join(', ')}. Επιτρεπτά theme: ${Object.keys(THEMES).join(', ')}.
Για story/choice/roleplay/escape/adventure γράψε σε κάθε ερώτηση "scene" ώστε να σχηματίζεται συνεχής ιστορία στο θέμα του παιδιού. Για memory/matching δώσε και "pairs" (6-8 ζεύγη). Οι ερωτήσεις πρέπει να είναι ενταγμένες στον κόσμο του θέματος (π.χ. ποδόσφαιρο: γκολ, ομάδες, γήπεδο).

Οι ασκήσεις να είναι ποικίλες, σαφείς και κατάλληλες για εκτύπωση. Για ερωτήσεις πολλαπλής επιλογής βάλε "options", αλλιώς άφησέ τες κενές και όρισε "lines" (γραμμές απάντησης 1-4).

function promptActivity(o){return`${stuCtx(o.student,o.age,o.grade)}

ΑΙΤΗΜΑ: εκπαιδευτικό υλικό τύπου «${ACT_KINDS[o.kind]||o.kind}» — «${o.prompt}»

function progressDigest(st){const rs=resultsOf(st.id);const last=rs.slice(-15).map(r=>`${r.date.slice(0,10)} | ${r.title} | ${r.subject||''} | ${r.correct}/${r.total} (${r.pct}%)`).join('\n');const cs=conceptStats(st.id).sort((a,b)=>a.recentAcc-b.recentAcc).slice(0,14).map(c=>`${c.concept}: ${c.total-c.wrong}/${c.total} σωστά, πρόσφατα ${c.recentAcc}%`).join('\n');return`ΤΕΛΕΥΤΑΙΕΣ ΔΡΑΣΤΗΡΙΟΤΗΤΕΣ:\n${last||'καμία'}\n\nΑΝΑ ΔΕΞΙΟΤΗΤΑ:\n${cs||'—'}`;}

function localSuggest(st){const weak=weakConcepts(st.id);const mast=masteredConcepts(st.id);const rs=resultsOf(st.id);let summary;if(!rs.length)summary='Δεν υπάρχουν ακόμη αποτελέσματα. Προτείνεται μια πρώτη διαγνωστική δραστηριότητα σε κάθε βασικό μάθημα, ώστε να χτιστεί εικόνα επιπέδου.';else summary=(mast.length?`Πρόοδος: κατακτημένα — ${mast.slice(0,3).map(c=>c.concept).join(', ')}. `:'')+(weak.length?`Χρειάζεται εξάσκηση σε: ${weak.slice(0,3).map(c=>c.concept+' ('+c.recentAcc+'%)').join(', ')}. Προτείνεται πρόγραμμα ${Math.min(3,weak.length)+1} δραστηριοτήτων την επόμενη εβδομάδα.`:'Σταθερή επίδοση — προτείνεται επόμενος στόχος με ελαφρώς αυξημένη δυσκολία.');
  return{summary,focus:(weak.length?weak.slice(0,3):[{concept:(st.goals||'Επόμενος στόχος'),recentAcc:null}]).map(c=>({skill:c.concept,why:c.recentAcc!=null?`Πρόσφατη επιτυχία ${c.recentAcc}%.`:'Από τους στόχους του προφίλ.',activities:[{kind:'game',title:'Παιχνίδι εξάσκησης: '+c.concept,prompt:`Παιχνίδι εξάσκησης στο «${c.concept}» με πιο εύκολα βήματα και καλές βοήθειες.`},{kind:'worksheet',title:'Φύλλο εργασίας: '+c.concept,prompt:`Φύλλο εργασίας 8 ασκήσεων στο «${c.concept}», σταδιακής δυσκολίας.`}]})),note:'Ενσωματωμένη πρόταση βάσει κανόνων (χωρίς τεχνητή νοημοσύνη).',local:true};}
function localProgram(st,{weeks=4,perWeek=2,minutes=20,prompt=''}){const weak=weakConcepts(st.id).map(c=>c.concept);const topics=weak.length?weak:(st.difficulties||st.goals||prompt||'Βασικές δεξιότητες').split(/[,;\n]/).map(x=>x.trim()).filter(Boolean);const kinds=['game','worksheet','game','review','activity'];const out={title:`Πρόγραμμα ${weeks} εβδομάδων`,goals:topics.slice(0,4).map(t=>'Βελτίωση: '+t),weeks:[],notes:'Ενσωματωμένο πρότυπο προγράμματος (χωρίς τεχνητή νοημοσύνη).'};
  for(let w=1;w<=weeks;w++){const t=topics[(w-1)%topics.length];const ss=[];for(let k=0;k<perWeek;k++){const kind=k===perWeek-1&&w%2===0?'assessment':kinds[(w+k)%kinds.length];ss.push({kind,title:({game:'Παιχνίδι',worksheet:'Φύλλο εργασίας',review:'Επανάληψη',activity:'Δραστηριότητα',assessment:'Αξιολόγηση'}[kind])+': '+t,subject:'',prompt:`${kind==='assessment'?'Σύντομη αξιολόγηση':'Εξάσκηση'} στο «${t}», δυσκολία ${Math.min(5,1+w)}.`,minutes,difficulty:Math.min(5,1+w)});}out.weeks.push({week:w,focus:t,sessions:ss});}return out;}

/* ---- αυτόματος έλεγχος ορθότητας από δεύτερο μοντέλο ---- */
const VERIFY_SYSTEM=`Είσαι αυστηρός ελεγκτής εκπαιδευτικού περιεχομένου για παιδιά στην Ελλάδα. Ελέγχεις κάθε ερώτηση σαν δάσκαλος πριν φτάσει στο παιδί.
Για κάθε στοιχείο έλεγξε:
1. Είναι η «answer» πραγματικά σωστή; (γεγονότα, γλώσσα, μαθηματικά)
2. Υπάρχει άλλη επιλογή που είναι επίσης σωστή ή πιο σωστή;
3. Είναι όλες οι λέξεις πραγματικές και σωστές ελληνικές λέξεις με το σωστό νόημα; (π.χ. ο διαιτητής χρησιμοποιεί «σφυρίχτρα», όχι «σφυρί»)
4. Είναι σωστή η εξήγηση;
5. Είναι η ερώτηση σαφής και κατάλληλη για την ηλικία;
Αν βρεις πρόβλημα, δώσε διορθωμένο στοιχείο ολόκληρο, με την «answer» γραμμένη ακριβώς όπως μία από τις «options». Αν δεν διορθώνεται με βεβαιότητα, βάλε fix: null.
Απαντάς ΜΟΝΟ με JSON.`;
async function aiVerifyContent(content,{age,subject,avoid}={}){const items=(content.items||[]).map(({_flag,_fix,_aiFix,_teacherFlag,...x},i)=>({i,...x}));const cards=(content.cards||[]).map((x,i)=>({i,front:x.front,back:x.back}));if(!items.length&&!cards.length)return{checked:0,fixed:0,removed:0,notes:[]};
  const o=await AI.json(VERIFY_SYSTEM,`Ηλικία: ${age||'—'}. Μάθημα: ${subject||'—'}.\nΕΡΩΤΗΣΕΙΣ:\n${JSON.stringify(items)}\n${cards.length?'ΚΑΡΤΕΣ (front/back):\n'+JSON.stringify(cards)+'\n':''}Μορφή: {"items":[{"i":0,"ok":true,"problem":"","fix":null}],"cards":[{"i":0,"ok":true,"problem":"","fix":null}]}\nΣτο fix για ερωτήσεις: {"q":"","options":[],"answer":"","explain":"","hint":""}. Για κάρτες: {"front":"","back":""}. Συμπερίλαβε ΜΟΝΟ όσα έχουν πρόβλημα.`,{temperature:0,avoid});
  let fixed=0,removed=0;const notes=[];const rm=new Set();
  for(const r of o.items||[]){const it=content.items[r.i];if(!it||r.ok)continue;const f=r.fix;
    if(f&&f.q&&f.answer&&(!f.options||!f.options.length||f.options.some(x=>norm(x)===norm(f.answer)))){it.q=f.q;if(f.options&&f.options.length)it.options=f.options;it.answer=f.answer;if(f.explain)it.explain=f.explain;if(f.hint)it.hint=f.hint;it._aiFix='Διορθώθηκε στον έλεγχο: '+(r.problem||'');fixed++;}
    else{rm.add(r.i);removed++;notes.push('Αφαιρέθηκε: «'+it.q.slice(0,60)+'» — '+(r.problem||'αμφίβολη απάντηση'));}}
  if(rm.size)content.items=content.items.filter((_,i)=>!rm.has(i));
  const rmc=new Set();for(const r of o.cards||[]){const k=content.cards[r.i];if(!k||r.ok)continue;if(r.fix&&r.fix.front&&r.fix.back){k.front=r.fix.front;k.back=r.fix.back;k._aiFix='Διορθώθηκε στον έλεγχο: '+(r.problem||'');fixed++;}else{rmc.add(r.i);removed++;}}
  if(rmc.size)content.cards=content.cards.filter((_,i)=>!rmc.has(i));
  return{checked:items.length+cards.length,fixed,removed,notes,model:o._model,at:new Date().toISOString()};}

const PRAISE={young:['Μπράβο! 🎉','Τέλεια! ⭐','Υπέροχα! 🌟','Σωστό! 👏','Φοβερό! 🚀'],mid:['Σωστό! 👏','Πολύ ωραία!','Εξαιρετικά!','Μπράβο!','Ακριβώς!'],teen:['Σωστό.','Ακριβώς.','Πολύ καλά.','Σωστά.','Ωραία.']};

const pick=a=>a[Math.floor(Math.random()*a.length)];
function isCorrect(it,given){if(norm(given)===norm(it.answer))return true;const a=parseNum(it.answer),g=parseNum(given);if(a!=null&&g!=null&&/^\s*-?[\d.,\/\s]+\s*$/.test(String(given))&&numEq(a,g))return true;return false;}
function confetti(emojis){const c=document.createElement('div');c.className='confetti';const set=emojis||['🎉','⭐','✨','🎊','🌟'];for(let i=0;i<36;i++){const e=document.createElement('i');e.textContent=pick(set);e.style.left=Math.random()*100+'%';e.style.animationDuration=(1.8+Math.random()*1.8)+'s';e.style.animationDelay=(Math.random()*.6)+'s';c.appendChild(e);}document.body.appendChild(c);setTimeout(()=>c.remove(),4200);}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function pairsOf(c){if(c.pairs&&c.pairs.length)return c.pairs;if(c.cards&&c.cards.length)return c.cards.map(x=>({a:x.front,b:x.back,concept:x.concept}));return(c.items||[]).map(it=>({a:it.q,b:it.answer,concept:it.concept}));}

function intentType(t){t=t.toLowerCase();if(/τι (πρέπει|να|θα) (να )?δουλέψ|πρότεινε|τι να κάνω/.test(t))return'suggest';if(/επανάληψη (των )?λαθ|λάθη του (τελευταί|μήνα)/.test(t))return'review';if(/πρόγραμμα \d|πρόγραμμα (για|εβδομ)|εκπαιδευτικό πρόγραμμα|πλάνο/.test(t))return'plan';if(/φύλλο|για εκτύπωση|εκτυπώσ/.test(t))return'worksheet';if(/κουίζ|quiz/.test(t))return'quiz';if(/κάρτες|καρτέλες/.test(t))return'flashcards';if(/ιστορία|παραμύθι/.test(t)&&!/κοινωνική/.test(t))return'story';if(/σελίδα (του )?βιβλίου|από αυτό|pdf|φωτογραφ/.test(t))return'material';if(/κοινωνική|οπτικό πρόγραμμα|δραστηριότητα|άσκηση (μνήμης|συγκέντρωσης|λογικής|κατανόησης)/.test(t)&&!/παιχνίδι/.test(t))return'activity';return'game';}
function routeIntent(text,sid){const k=intentType(text);if(k==='suggest'||k==='review'){if(!sid){const s=findStudentIn(text);if(s)sid=s.id;}if(!sid)return toast('Διάλεξε πρώτα μαθητή.','bad');return k==='suggest'?showSuggestions(sid,text):reviewMistakes(sid,text);}
  sessionStorage.setItem('pai-draft',JSON.stringify({prompt:text,studentId:sid||'',auto:true}));go('create/'+k);}
function findStudentIn(text){const t=normLoose(text);return myStudents().find(s=>(s.name&&t.includes(normLoose(s.name.split(' ')[0])))||t.includes(normLoose(s.code)));}

function createPresets(type){const L=[];

  else if(type==='activity')Object.entries(ACT_KINDS).forEach(([k,v])=>L.push({ic:AK_IC[k]||'puzzle',t:v,h:`create/activity?ak=${k}`}));
  else if(type==='story')Object.entries(THEMES).forEach(([k,v])=>L.push({ic:TH_IC[k]||'l-sparkles',t:v.n,d:'Ιστορία με αυτό το θέμα',h:`create/story?th=${k}`}));
  else if(type==='material')OUTS.forEach(([k,i,l])=>L.push({ic:i,t:l,d:'Από σελίδα, PDF ή φωτογραφία',h:`create/material?out=${k}`}));
  else(GOAL_PRESETS[type]||[]).forEach(([i,t,g])=>L.push({ic:i,t,d:g,h:`create/${type}?g=${encodeURIComponent(g)}`}));
  return L;}

const D864=864e5;
function weeksBack(n){const w=[];for(let i=n-1;i>=0;i--)w.push(new Date(weekStart(new Date())-i*7*D864));return w;}
function weeklySeries(rs,subs,weeks){return subs.map(sub=>({name:sub,values:weeks.map((ws,i)=>{const we=i<weeks.length-1?weeks[i+1]:new Date(Date.now()+D864);const v=rs.filter(x=>(x.subject||'Γενικά')===sub&&new Date(x.date)>=ws&&new Date(x.date)<we).map(x=>x.pct);return v.length?avg(v):null;})}));}
function compareSets(rs,cmp){let A,B,la,lb;if(cmp==='week'){const w0=weekStart(new Date()).toISOString(),w1=new Date(weekStart(new Date())-7*D864).toISOString();A=rs.filter(x=>x.date>=w1&&x.date<w0);B=rs.filter(x=>x.date>=w0);la='Προηγούμενη εβδομάδα';lb='Αυτή η εβδομάδα';}
  else if(cmp==='start'){const by={};rs.forEach(x=>{(by[x.subject||'Γενικά']=by[x.subject||'Γενικά']||[]).push(x);});A=[];B=[];for(const k in by){A.push(...by[k].slice(0,3));B.push(...by[k].slice(-3));}la='Αρχική επίδοση';lb='Τρέχουσα επίδοση';}
  else{const m0=todayISO().slice(0,7);const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);const m1=isoDate(d).slice(0,7);A=rs.filter(x=>x.date.startsWith(m1));B=rs.filter(x=>x.date.startsWith(m0));la=MONTHS[+m1.slice(5)-1];lb=MONTHS[+m0.slice(5)-1];}return{A,B,la,lb};}
function progressStudentHTML(s,cmp,base){const rs=resultsOf(s.id);if(!rs.length)return emptyHTML('chart','Δεν υπάρχουν ακόμη αποτελέσματα','Η πρόοδος θα εμφανιστεί μόλις ο μαθητής ολοκληρώσει δραστηριότητες.');

function calFilters(){try{return Object.assign({appt:1,res:1,mat:1,plan:1,sess:1},JSON.parse(localStorage.getItem('lumio-calf')||'null')||{});}catch(e){return{res:1,mat:1,plan:1,sess:1};}}
function calEvents(sid){const ids=new Set(sid?[sid]:myStudents().map(s=>s.id));const ev={};const add=(d,e)=>{(ev[d]=ev[d]||[]).push(e);};
  for(const x of S.data.results)if(ids.has(x.studentId))add(isoDate(new Date(x.date)),{t:'res',x,label:`${x.pct}% ${x.title}`});
  for(const m of myMaterials())if(sid?m.studentId===sid:true)add(isoDate(new Date(m.created)),{t:'mat',x:m,label:m.title});
  for(const p of S.data.programs)if(ids.has(p.studentId))for(const w of p.weeks)for(const s of w.sessions)if(!s.done)add(s.date,{t:'plan',x:s,p,label:s.title});
  if(S.earn)for(const s of S.earn.sessions)if(!sid||s.studentId===sid)add(s.date,{t:'sess',x:s,label:`${s.start} ${stuName(S.data.students.find(y=>y.id===s.studentId))}`});
  try{const t=todayISO();for(const o of occ(addDays(t,-62),addDays(t,124),{sid,withCancel:true}))add(o.date,{t:'appt',x:o,label:`${o.s} ${stuName(stOf(o.a.sid))}`});}catch(e){}

function mountCalendar(el,{sid,ym,base}){ym=ym||todayISO().slice(0,7);const[Y,Mo]=ym.split('-').map(Number);const start=weekStart(new Date(Y,Mo-1,1));const ev=calEvents(sid);const today=todayISO();const prev=isoDate(new Date(Y,Mo-2,1)).slice(0,7),next=isoDate(new Date(Y,Mo,1)).slice(0,7);let sel=ym===today.slice(0,7)?today:isoDate(new Date(Y,Mo-1,1));
  const draw=()=>{const F=calFilters();el.innerHTML=`<div class="side2"><div class="card"><div class="spread" style="margin-bottom:14px"><a class="iconbtn" href="#/${base}&m=${prev}" aria-label="Προηγούμενος μήνας">${ic('left',20)}</a><h2 style="margin:0">${MONTHS[Mo-1]} ${Y}</h2><a class="iconbtn" href="#/${base}&m=${next}" aria-label="Επόμενος μήνας">${ic('right',20)}</a></div>
   <div class="cal">${DAYS.map(d=>`<div class="h">${d}</div>`).join('')}${Array.from({length:42},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);const k=isoDate(d);const e=(ev[k]||[]).filter(v=>F[v.t]);return`<button class="d ${d.getMonth()!==Mo-1?'out':''} ${k===today?'today':''} ${k===sel?'sel':''}" data-d="${k}"><div class="n">${d.getDate()}</div>${e.slice(0,3).map(v=>`<span class="ev ${v.t} ${v.t==='res'&&v.x.pct<60?'low':''}">${esc(v.label)}</span>`).join('')}${e.length>3?`<span class="tiny muted">+${e.length-3}</span>`:''}<span class="dots">${e.slice(0,4).map(v=>`<i style="background:${EV_TYPES.find(t=>t[0]===v.t)[2]}"></i>`).join('')}</span></button>`;}).join('')}</div>
   <div class="legend">${EV_TYPES.map(([k,l,c])=>`<button data-f="${k}" class="${F[k]?'':'off'}"><i style="background:${c}"></i>${l}</button>`).join('')}</div>${!S.earn?`<p class="tiny muted" style="margin:8px 0 0">Οι συνεδρίες εμφανίζονται όταν <a href="#/earnings">ξεκλειδώσεις το Ταμείο (PIN)</a>.</p>`:''}</div>
   <div class="card" id="dayp">${dayDetailHTML(sel,ev[sel]||[])}</div></div>`;};
  draw();el.onclick=e=>{const d=e.target.closest('[data-d]');if(d){sel=d.dataset.d;draw();if(innerWidth<=960)$('#dayp',el).scrollIntoView({behavior:'smooth'});return;}const f=e.target.closest('[data-f]');if(f){const F=calFilters();F[f.dataset.f]=F[f.dataset.f]?0:1;try{localStorage.setItem('lumio-calf',JSON.stringify(F));}catch(x){}draw();return;}const rr=e.target.closest('[data-res]');if(rr)showResult(rr.dataset.res);};}

async function removeAccount(id,silent){const u=S.meta.users.find(x=>x.id===id);if(!u)return true;if(u.id===S.user.id)return toast('Δεν γίνεται να αφαιρέσεις τη δική σου σύνδεση.','bad'),false;

  S.data.students.forEach(s=>{if(s.ownerId===u.id)s.ownerId=S.user.id;});(S.data.materials||[]).forEach(m=>{if(m.ownerId===u.id)m.ownerId=S.user.id;});S.meta.users=S.meta.users.filter(x=>x.id!==u.id);
  try{await IDB.del('earn:'+u.id);}catch(e){}try{TM.lsKeys().forEach(k=>{if(k.includes(u.id))try{localStorage.removeItem(k);}catch(e){}});}catch(e){}await saveMeta();save();toast('Η σύνδεση αφαιρέθηκε.','ok');return true;}
function greekToLatin(t){const M={α:'a',β:'v',γ:'g',δ:'d',ε:'e',ζ:'z',η:'i',θ:'th',ι:'i',κ:'k',λ:'l',μ:'m',ν:'n',ξ:'x',ο:'o',π:'p',ρ:'r',σ:'s',ς:'s',τ:'t',υ:'y',φ:'f',χ:'ch',ψ:'ps',ω:'o',ά:'a',έ:'e',ή:'i',ί:'i',ό:'o',ύ:'y',ώ:'o',ϊ:'i',ϋ:'y',ΐ:'i',ΰ:'y'};return[...String(t||'').toLowerCase()].map(c=>M[c]??c).join('').replace(/[^a-z0-9._-]/g,'');}

const TEACH_ROLES=['teacher','assistant','tutor','music','special','other'],THER_ROLES=['speech','ot','psych'];
function docReq(role,emp){return DOC_TYPES.filter(([k,,r])=>(r.includes('T')&&TEACH_ROLES.includes(role))||(r.includes('H')&&THER_ROLES.includes(role))||(r.includes('A')&&emp)).map(x=>x[0]);}
function staffDocs(id){const B=biz();if(id==='me')return B.meDocs=B.meDocs||[];const x=B.staff.find(y=>y.id===id);return x?(x.docs=x.docs||[]):[];}
function docState(d){if(!d.exp)return'ok';const t=todayISO();if(d.exp<t)return'bad';return d.exp<=addDays(t,30)?'warn':'ok';}
function docsSummary(id){const B=biz();const me=id==='me';const x=me?{role:B.meRole}:B.staff.find(y=>y.id===id);const D=staffDocs(id);const req=docReq(x.role,!me);
  const miss=req.filter(k=>!D.some(d=>d.type===k));const bad=D.filter(d=>docState(d)==='bad').length,warn=D.filter(d=>docState(d)==='warn').length;return{miss,bad,warn,n:D.length};}
function docsChip(id){const s=docsSummary(id);const t=s.bad?`${s.bad} έληξ${s.bad>1?'αν':'ε'}`:s.miss.length?`${s.miss.length} λείπ${s.miss.length>1?'ουν':'ει'}`:s.warn?`${s.warn} λήγ${s.warn>1?'ουν':'ει'} σύντομα`:s.n?'πλήρης':'κενός';
  return`<button type="button" class="chip ${s.bad||s.miss.length?'bad':s.warn?'warn':s.n?'ok':''}" data-docs="${id}">${ic('folder',13)} Φάκελος: ${t}</button>`;}
function staffDocsDialog(id){const B=biz();const me=id==='me';const x=me?{name:S.user.name,role:B.meRole,custom:B.meCustom}:B.staff.find(y=>y.id===id);if(!x)return;
  const md=modal(`<div class="spread" style="margin-bottom:6px"><h3 style="margin:0">Φάκελος · ${esc(x.name)}</h3><button class="iconbtn" data-close aria-label="Κλείσιμο">${ic('x',18)}</button></div><p class="small muted" style="margin-top:0">${esc(roleName(x.role,x.custom))} — πιστοποιητικά, διπλώματα και έγγραφα με ημερομηνία λήξης.</p><div id="dl"></div>`,{wide:true,onClose:()=>{if(/settings\/business/.test(location.hash))render();}});
  const draw=()=>{const D=staffDocs(id);const req=docReq(x.role,!me);const miss=req.filter(k=>!D.some(d=>d.type===k));const tn=k=>(DOC_TYPES.find(y=>y[0]===k)||[0,'Έγγραφο'])[1];
    $('#dl',md.el).innerHTML=`${miss.length?`<div class="stbox bad" style="margin-top:0">${ic('alert',18)}<div><b>Λείπουν απαραίτητα για την ειδικότητα «${esc(roleName(x.role,x.custom))}»:</b><div class="docmiss">${miss.map(k=>`<button type="button" class="chipt" data-add="${k}">${ic('plus',13)} ${esc(tn(k))}</button>`).join('')}</div></div></div>`:req.length?`<div class="stbox ok" style="margin-top:0">${ic('check',18)} <b>Υπάρχουν όλα τα απαραίτητα για την ειδικότητα.</b></div>`:''}
     ${D.length?`<div class="doclist">${D.slice().sort((a,b)=>(a.exp||'9')<(b.exp||'9')?-1:1).map(d=>{const st=docState(d);return`<div class="docrow ${st}"><span class="docic">${ic(d.file?'file':'folder',18)}</span><div class="grow"><b>${esc(d.title||tn(d.type))}</b><small>${d.title&&d.title!==tn(d.type)?esc(tn(d.type))+' · ':''}${d.issued?'Έκδοση '+fmtShort(d.issued)+(d.issued.slice(0,4)!==todayISO().slice(0,4)?'/'+d.issued.slice(2,4):''):''}${d.exp?` · <span class="dexp">${st==='bad'?'Έληξε':'Λήγει'} ${fmtShort(d.exp)}/${d.exp.slice(2,4)}</span>`:''}${d.no?' · Αρ. '+esc(d.no):''}</small></div>${d.file?`<button type="button" class="iconbtn" data-view="${d.id}" aria-label="Προβολή">${ic('eye',16)}</button>`:''}<button type="button" class="iconbtn" data-ed="${d.id}" aria-label="Αλλαγή">${ic('edit',16)}</button></div>`;}).join('')}</div>`:'<p class="small muted">Δεν έχει καταχωριστεί κανένα έγγραφο ακόμα.</p>'}
     <div class="row" style="justify-content:space-between;margin-top:14px"><button type="button" class="btn ghost sm" id="dinfo">${ic('info',15)} Τι χρειάζεται;</button><button type="button" class="btn pri" data-add="">${ic('plus',16)} Νέο έγγραφο</button></div>`;};
  draw();

    const v=e.target.closest('[data-view]');if(v){const d=staffDocs(id).find(y=>y.id===v.dataset.view);if(d&&d.file)openDataURL(d.file.data,d.file.name);}
    if(e.target.closest('#dinfo'))docInfoDialog();});}
function openDataURL(data,name){try{const[h,b]=data.split(',');const mime=h.match(/:(.*?);/)[1];const bin=atob(b);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);const url=URL.createObjectURL(new Blob([u8],{type:mime}));const w=window.open(url,'_blank');if(!w){const a=document.createElement('a');a.href=url;a.download=name||'egrafo';a.click();}setTimeout(()=>URL.revokeObjectURL(url),60000);}catch(e){toast('Δεν άνοιξε το αρχείο.','bad');}}
function docInfoDialog(){modal(`<div class="spread" style="margin-bottom:6px"><h3 style="margin:0">Τι χρειάζεται ο φάκελος</h3><button class="iconbtn" data-close aria-label="Κλείσιμο">${ic('x',18)}</button></div>

  <div class="docinfo">${DOC_TYPES.filter(d=>d[4]).map(([k,n,r,exp,h])=>`<div><b>${esc(n)}</b> ${r.includes('T')?'<span class="chip">καθηγητές</span>':''}${r.includes('H')?'<span class="chip">θεραπευτές</span>':''}${r.includes('A')?'<span class="chip">όλοι οι εργαζόμενοι</span>':''}${!r?'<span class="chip">όπου χρειάζεται</span>':''}<div class="small muted">${esc(h)}${exp?` Προτεινόμενη ανανέωση: κάθε ${exp>=12?exp/12+(exp===12?' χρόνο':' χρόνια'):exp+' μήνες'}.`:''}</div></div>`).join('')}</div>`,{wide:true});}
function docEdit(id,docId,type){return new Promise(res=>{const D=staffDocs(id);const d=docId?D.find(y=>y.id===docId):{type:type||'degree'};let file=d.file||null;
  const md=modal(`<h3 style="margin-top:0">${docId?'Αλλαγή εγγράφου':'Νέο έγγραφο'}</h3><form id="df">
   <div class="field"><label class="f" for="d-t">Είδος</label><select class="in" id="d-t" name="type">${DOC_TYPES.map(([k,n])=>opt(k,n,d.type)).join('')}</select><div class="tiny muted" id="d-h" style="margin-top:4px"></div></div>
   <div class="field"><label class="f" for="d-n">Τίτλος (προαιρετικό)</label><input class="in" id="d-n" name="title" value="${esc(d.title||'')}" placeholder="π.χ. Πτυχίο Φιλολογίας ΕΚΠΑ, Proficiency"></div>
   <div class="grid g2" style="gap:10px"><div class="field"><label class="f" for="d-i">Ημερομηνία έκδοσης</label><input class="in" type="date" id="d-i" name="issued" value="${d.issued||''}"></div><div class="field"><label class="f" for="d-x">Λήξη / ανανέωση</label><input class="in" type="date" id="d-x" name="exp" value="${d.exp||''}"><div class="tiny muted" style="margin-top:4px">Κενό = δεν λήγει.</div></div></div>
   <div class="field"><label class="f" for="d-no">Αριθμός πρωτοκόλλου / βεβαίωσης (προαιρετικό)</label><input class="in" id="d-no" name="no" value="${esc(d.no||'')}"></div>
   <div class="field"><label class="f">Αρχείο (φωτογραφία ή PDF)</label><div class="row" style="gap:8px"><label class="btn sm">${ic('upload',15)} ${file?'Αλλαγή αρχείου':'Επισύναψη'}<input type="file" id="d-f" accept="image/*,application/pdf" style="display:none"></label><span class="small muted" id="d-fn">${file?esc(file.name):'Κανένα'}</span></div><div class="tiny muted" style="margin-top:4px">Μένει κρυπτογραφημένο σε αυτή τη συσκευή. Έως 2 MB για PDF.</div></div>
   <div class="field"><label class="f" for="d-nt">Σημείωση</label><input class="in" id="d-nt" name="note" value="${esc(d.note||'')}"></div>
   <div class="row" style="justify-content:space-between">${docId?`<button type="button" class="btn danger" id="d-del">${ic('trash',16)} Διαγραφή</button>`:'<span></span>'}<span class="row"><button type="button" class="btn" data-close>Άκυρο</button><button class="btn pri">${ic('check',16)} Αποθήκευση</button></span></div></form>`,{onClose:()=>res()});
  const f=$('#df',md.el);const hint=()=>{const T=DOC_TYPES.find(y=>y[0]===f.type.value);$('#d-h',md.el).textContent=T?T[4]:'';if(!docId&&T&&T[3]&&f.issued.value&&!f.exp.value){const x=new Date(f.issued.value+'T12:00');x.setMonth(x.getMonth()+T[3]);f.exp.value=isoDate(x);}};hint();f.type.onchange=hint;f.issued.onchange=hint;
  $('#d-f',md.el).onchange=async e=>{const fl=e.target.files[0];if(!fl)return;try{if(fl.type==='application/pdf'){if(fl.size>2e6)return toast('Το PDF είναι πάνω από 2 MB.','bad');const data=await new Promise((r,j)=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=j;fr.readAsDataURL(fl);});file={name:fl.name,data};}
    else file={name:fl.name.replace(/\.\w+$/,'')+'.jpg',data:await imageToDataURL(fl,1600)};$('#d-fn',md.el).textContent=file.name;}catch(err){toast('Δεν διαβάστηκε το αρχείο.','bad');}};

  f.onsubmit=e=>{e.preventDefault();const o=fd(f);Object.assign(d,{type:o.type,title:(o.title||'').trim(),issued:o.issued||'',exp:o.exp||'',no:(o.no||'').trim(),note:(o.note||'').trim(),file});if(!docId){d.id=uid();D.push(d);}save();md.close();toast('Αποθηκεύτηκε.','ok');};});}

  /* χρώματα, γραμματοσειρά και φόντο του LUMIO μέσα στο Ταμείο */

    const cs=getComputedStyle(document.documentElement),v=n=>cs.getPropertyValue(n).trim();const tp=TM_PALS[lsGet('lumio-tpal',TM_PAL_DEF)]||TM_PALS[TM_PAL_DEF];const dark=isDarkMode();const P=tp.deep?{brand:tp.brand,onb:'#fff',tx:dark?tp.accent:tp.brand,ln:tp.ln,ink:dark?v('--ink'):tp.brand}:(dark?{brand:tp.on,onb:'#fff',tx:tp.brand,ln:tp.ln,ink:v('--ink')}:{brand:tp.brand,onb:tp.on,tx:tp.on,ln:tp.ln,ink:tp.on});

    const bgOn=document.documentElement.classList.contains('hasbg');const bgPos={icon:'right -3vw bottom -3vh / min(70vw,540px) auto',scene:'right bottom / min(100vw,1100px) auto',custom:'center / cover'}[document.documentElement.dataset.bg]||'center / contain';

:root{--hdr:0px!important;--brand:${P.brand}!important;--onbrand:${P.onb}!important;--brandtx:${P.tx}!important;--brandln:${P.ln}!important;--accent:${tp.accent}!important;--onaccent:${tp.onaccent}!important;--accenttx:${tp.acctx}!important;--paper:${v('--cream')}!important;--card:${v('--paper')}!important;--ink:${P.ink}!important;--muted:${v('--ink2')}!important;--line:${v('--line')}!important;--red:${v('--bad')}!important;--green:${v('--ok')}!important;--z:1!important}

${bgOn?`body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:${v('--bgimg')} no-repeat ${bgPos};opacity:${v('--bgop')}}`:''}
${dark?`.sheet,.alertbox,.clockbox{background:${v('--paper')}!important;color:${v('--ink')}!important}input,select,textarea{background:${v('--field')}!important;color:${v('--ink')}!important;border-color:${v('--line')}!important}`:''}`;},
  mount(){const f=this.frame();if(!f)return;window.LUMIO_TM_U=S.user.id;

const sumA=a=>a.reduce((x,t)=>x+(+t.amount||0),0);
const paidOf=s=>s.paid?(+s.paidAmount||+s.amount||0):0;
const paidSum=a=>a.reduce((x,s)=>x+paidOf(s),0);
const r2=n=>Math.round((+n||0)*100)/100;
function sessMonth(ym){return S.earn?(S.earn.sessions||[]).filter(s=>s.date.startsWith(ym)):[];}
const WDAYS=['Κυριακή','Δευτέρα','Τρίτη','Τετάρτη','Πέμπτη','Παρασκευή','Σάββατο'];
const WDAYS_S=['Κυρ','Δευ','Τρί','Τετ','Πέμ','Παρ','Σάβ'];
const DAY_ORDER=[1,2,3,4,5,6,0];
const wdOf=iso=>new Date(iso+'T12:00').getDay();
function earnInit(){const E=S.earn;if(!E)return null;E.sessions=E.sessions||[];E.rates=E.rates||{};E.plans=E.plans||{};
  for(const k in E.plans){const p=E.plans[k];if(p&&p.slots){if(!appts().some(x=>x.sid===k&&x.kind!=='once'))p.slots.forEach(x=>appts().push({id:uid(),sid:k,kind:'weekly',date:todayISO(),d:+x.d,s:x.s,e:x.e,until:null,note:'',ex:{},created:new Date().toISOString()}));delete p.slots;save();}}
  for(const k in E.rates){if(E.rates[k]!=null&&E.rates[k]!==''&&!E.plans[k])E.plans[k]={mode:'hour',price:+E.rates[k],slots:[]};}return E;}
function planOf(sid){const E=earnInit();const p=E&&E.plans[sid];if(!p)return null;return Object.assign({},p,{sid,slots:weeklySlots(sid)});}
function setPlan(sid,p){const E=earnInit();const slots=p.slots||[];const keep=new Set(slots.filter(x=>x.id).map(x=>x.id));
  S.data.appts=appts().filter(a=>!(a.sid===sid&&a.kind!=='once'&&!keep.has(a.id)&&(!a.until||a.until>=todayISO())));
  for(const x of slots){const a=x.id&&appts().find(y=>y.id===x.id);if(a){if(+a.d!==+x.d){a.d=+x.d;a.date=todayISO();}a.s=x.s;a.e=x.e;}else appts().push({id:uid(),sid,kind:'weekly',date:todayISO(),d:+x.d,s:x.s,e:x.e,until:null,note:'',ex:{},created:new Date().toISOString()});}
  E.plans[sid]={mode:p.mode,price:p.price};save();}
function priceTxt(p){return p?`${fmtEur(p.price)} ${p.mode==='hour'?'την ώρα':'τη συνεδρία'}`:'—';}
function slotsTxt(p){if(!p||!(p.slots||[]).length)return'Χωρίς σταθερή μέρα';return p.slots.slice().sort((a,b)=>DAY_ORDER.indexOf(+a.d)-DAY_ORDER.indexOf(+b.d)).map(x=>`${WDAYS_S[+x.d]} ${x.s}–${x.e}`).join(' · ');}
function slotFor(p,date){const sid=p&&p.sid;if(!sid)return null;const o=occ(date,date,{sid})[0];return o?{s:o.s,e:o.e}:null;}
function amountOf(mode,price,min){return mode==='hour'?r2((+price||0)*min/60):r2(+price||0);}
function balanceOf(sid){const E=earnInit();if(!E)return{sum:0,n:0,list:[]};const L=E.sessions.filter(x=>x.studentId===sid&&!x.paid);return{sum:sumA(L),n:L.length,list:L};}
const stuNm=id=>stuName(S.data.students.find(s=>s.id===id))||'(διαγραμμένος)';
function parentEmails(sid){const st=S.data.students.find(s=>s.id===sid);return((st&&st.contacts)||[]).filter(c=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email||''));}
const rateTxt=s=>s.mode==='session'?`${fmtEur(s.price)}/συνεδρία`:`${hoursTxt(s.minutes)} × ${fmtEur(s.rate??s.price)}/ώρα`;

  $('#mxl',eb).onclick=()=>monthExcel(ym);const sb=$('#stmt',eb);if(sb)sb.onclick=()=>statementDialog(fs);

function planDialog(sid,after){const E=earnInit();const st=S.data.students.find(x=>x.id===sid);if(!st)return;const p0=planOf(sid);const ws=weeklySlots(sid);const p=p0?JSON.parse(JSON.stringify(p0)):{mode:'session',price:'',slots:ws.length?ws:[{d:wdOf(todayISO()),s:'17:00',e:'18:00'}]};

   <form id="pf"><div class="seg" style="margin-bottom:12px" id="pm">${[['session','Τιμή ανά συνεδρία'],['hour','Τιμή ανά ώρα']].map(([k,l])=>`<button type="button" data-pm="${k}" class="${p.mode===k?'on':''}">${l}</button>`).join('')}</div>
   <div class="field"><label class="f" for="p-pr">Τιμή (€)</label><input class="in" id="p-pr" type="number" inputmode="decimal" step="0.5" min="0" required value="${esc(p.price)}" placeholder="π.χ. 20"></div>
   <label class="f">Μέρες και ώρες που έρχεται</label><div id="psl"></div><button type="button" class="btn sm" id="pad">${ic('plus',15)} Προσθήκη μέρας</button>
   <div class="row" style="justify-content:flex-end;margin-top:16px"><button type="button" class="btn" data-close>Άκυρο</button><button class="btn pri">${ic('check',16)} Αποθήκευση</button></div></form>`);
  const drawS=()=>{$('#psl',md.el).innerHTML=p.slots.map((x,i)=>`<div class="slotrow" data-i="${i}"><select class="in" data-k="d" aria-label="Μέρα">${DAY_ORDER.map(d=>opt(d,WDAYS[d],String(x.d))).join('')}</select><input class="in" type="time" data-k="s" value="${x.s}" aria-label="Έναρξη"><input class="in" type="time" data-k="e" value="${x.e}" aria-label="Λήξη"><button type="button" class="iconbtn" data-rm="${i}" aria-label="Αφαίρεση">${ic('x',16)}</button></div>`).join('')||'<p class="tiny muted">Χωρίς σταθερή μέρα — η ώρα θα συμπληρώνεται από την τελευταία συνεδρία.</p>';};drawS();

/* ---- καταχώριση με ένα πάτημα (με τα σταθερά της καρτέλας) ---- */
/* ραντεβού του μαθητή που περιμένει καταχώριση (σήμερα ή ξεχασμένο τις τελευταίες 14 μέρες) */
function pendingAppt(sid){const t=todayISO();const L=occ(addDays(t,-14),t,{sid}).filter(o=>!o.st);const today=L.filter(o=>o.date===t);return today.length?today[0]:L[L.length-1]||null;}
function quickSession(sid,date,{appt}={}){const E=earnInit();const p=planOf(sid);if(!p)return planDialog(sid,()=>quickSession(sid,date,{appt}));const st=S.data.students.find(x=>x.id===sid);const t=todayISO();
  let sl=appt||null,pend=null;if(!date&&!E.sessions.some(x=>x.studentId===sid&&x.date===t)){pend=pendingAppt(sid);if(pend){date=pend.date;sl={s:pend.s,e:pend.e};}}date=date||t;
  const last=E.sessions.filter(x=>x.studentId===sid).sort((a,b)=>(b.date+b.start).localeCompare(a.date+a.start))[0];sl=sl||slotFor(p,date)||(last?{s:last.start,e:last.end}:{s:'17:00',e:'18:00'});const min=sessMin(sl.s,sl.e);const amt=amountOf(p.mode,p.price,min);const em=parentEmails(sid);
  const dup=E.sessions.filter(x=>x.studentId===sid&&x.date===date);const extra=!appt&&!pend||dup.length>0;
  const md=modal(`<h3 style="margin-top:0">${extra?'Έξτρα συνεδρία;':'Καταχώριση συνεδρίας'}</h3><div class="qsum"><span class="av lg">${st.avatar||'🙂'}</span><div><b>${esc(stuName(st))}</b><div class="small">${WDAYS[wdOf(date)]} ${fmtDate(date)} · ${sl.s}–${sl.e} (${hoursTxt(min)})</div><div class="qamt">${fmtEur(amt)}</div><div class="tiny muted">${p.mode==='hour'?`${fmtEur(p.price)}/ώρα × ${hoursNum(min)} ώρες`:'Τιμή ανά συνεδρία'}</div></div></div>
   ${extra?`<div class="stbox bad">${ic('alert',18)}<div><b>${dup.length?`Υπάρχει ήδη ${dup.length===1?'συνεδρία':dup.length+' συνεδρίες'} αυτή τη μέρα (${dup.map(x=>x.start).join(', ')}).`:'Δεν υπάρχει ραντεβού που να περιμένει καταχώριση.'}</b><div class="small">Για να μη χρεωθεί κατά λάθος δεύτερη φορά, επιβεβαίωσε ότι πρόκειται για έξτρα συνεδρία.</div></div></div>
     <label class="check field"><input type="checkbox" id="q-x"> <span><b>Ναι, είναι έξτρα συνεδρία</b></span></label>`
    :`<div class="note small field">${ic('info',14)} ${pend&&pend.date!==t?`Ραντεβού της ${WDAYS[wdOf(date)]} ${fmtShort(date)} που δεν είχε καταχωριστεί. `:'Από το σημερινό ραντεβού. '}Με τα σταθερά της καρτέλας — δεν έχεις αλλάξει τίποτα. Αν ήταν διαφορετικά, πάτα «Αλλαγή».</div>`}

  sheets.forEach(sh=>{const ws=XLSX.utils.aoa_to_sheet(sh.rows);ws['!cols']=(sh.rows[0]||[]).map((_,i)=>({wch:Math.min(42,Math.max(8,...sh.rows.map(r=>String(r[i]??'').length+2)))}));XLSX.utils.book_append_sheet(wb,ws,sh.name.slice(0,31));});XLSX.writeFile(wb,name);}

  const R=L.slice().sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)).map(x=>[xd(x.date),WDAYS[wdOf(x.date)],`${x.start}–${x.end}`,stuNm(x.studentId),x.minutes,x.price??x.rate??'',x.mode==='session'?'ανά συνεδρία':'ανά ώρα',r2(x.amount),x.paid?'Ναι':'Όχι',x.paid?r2(+x.paidAmount||x.amount):0,x.paidAt?xd(x.paidAt.slice(0,10)):'',x.receiptNo?'#'+x.receiptNo:'',x.note||'']);
  const tot=sumA(L),pd=paidSum(L);return[H,...R,[],['Σύνολο','','','',L.reduce((a,x)=>a+x.minutes,0),'','',r2(tot),'',r2(pd),'','',''],['Υπόλοιπο','','','','','','',r2(sumA(L.filter(x=>!x.paid)))]];}

  return[H,...occ(from,to,{withCancel:true}).map(o=>[xd(o.date),WDAYS[wdOf(o.date)],o.s,o.e,stuNm(o.a.sid),provById(provOcc(o)).name,kindTxt(o.a.kind),st[o.st]||(o.date<todayISO()?'Χωρίς καταχώριση':'Προγραμματισμένο'),o.a.note||''])];}

  locked(){return!!(S.data&&S.data.settings.stuLock)&&!S.stuOpen;},

  async setup(){const a=await promptDlg('Νέος κωδικός μαθητών (4–6 ψηφία)',{type:'password'});if(!a)return false;if(!/^\d{4,6}$/.test(a)){toast('Ο κωδικός πρέπει να έχει 4–6 ψηφία.','bad');return false;}const b=await promptDlg('Επανάληψη κωδικού',{type:'password'});if(b!==a){toast('Οι κωδικοί δεν ταιριάζουν.','bad');return false;}const salt=uid();S.data.settings.stuLock={salt,hash:await this.hash(a,salt)};S.stuOpen=true;S.stuAt=Date.now();save();toast('Οι «Μαθητές» κλειδώνουν πλέον με κωδικό.','ok');return true;},

    <form id="slf"><div class="field"><label class="f" for="slp">Κωδικός μαθητών</label><input class="in" type="password" inputmode="numeric" id="slp" name="p" required autocomplete="off" maxlength="6" style="text-align:center;font-size:1.4rem;letter-spacing:.4em"></div><button class="btn pri lg block">${ic('lock',16)} Ξεκλείδωμα</button></form><button class="btn ghost block" id="slf2" style="margin-top:10px">Ξέχασα τον κωδικό</button></div>`;
    const inp=$('#slp');inp.focus();const tryIt=async()=>{if(Date.now()<(S.stuWait||0))return toast('Περίμενε λίγα δευτερόλεπτα.','bad');if(await this.check(inp.value)){S.stuOpen=true;S.stuAt=Date.now();S.stuFails=0;render();}else{S.stuFails=(S.stuFails||0)+1;if(S.stuFails>=5){S.stuWait=Date.now()+30000;S.stuFails=0;}inp.value='';toast('Λάθος κωδικός.','bad');}};

/* ===== Ραντεβού: εβδομαδιαίο πρόγραμμα, κενά, πάγια ραντεβού ===== */
const tmin=t=>{const[a,b]=String(t||'0:0').split(':').map(Number);return a*60+(b||0);};
const tstr=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00');d.setDate(d.getDate()+n);return isoDate(d);};
const mondayOf=iso=>{const d=new Date(iso+'T12:00');const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return isoDate(d);};
const REPEAT=[['once','Μία φορά'],['weekly','Κάθε εβδομάδα'],['biweekly','Κάθε 2 εβδομάδες']];
function appts(){return S.data.appts=S.data.appts||[];}
function agCfg(){return S.data.settings.agenda=Object.assign({from:'09:00',to:'21:00',step:60,days:[1,2,3,4,5,6]},S.data.settings.agenda||{});}

/* ---- επίσημες αργίες (Ελλάδα): σταθερές + κινητές από το ορθόδοξο Πάσχα ---- */
function orthEaster(y){const a=y%4,b=y%7,c=y%19,d=(19*c+15)%30,e=(2*a+4*b-d+34)%7;const mo=Math.floor((d+e+114)/31),da=(d+e+114)%31+1;const j=new Date(y,mo-1,da,12);j.setDate(j.getDate()+13);return isoDate(j);}
function grHolidays(y){const E=orthEaster(y);const F=(m,d)=>`${y}-${pad(m)}-${pad(d)}`;
  return[['ny',F(1,1),'Πρωτοχρονιά',1],['epi',F(1,6),'Θεοφάνεια',1],['tri',F(1,30),'Τριών Ιεραρχών (σχολεία)',0],['kd',addDays(E,-48),'Καθαρά Δευτέρα',1],['25m',F(3,25),'25η Μαρτίου',1],
   ['mp',addDays(E,-2),'Μεγάλη Παρασκευή',1],['ms',addDays(E,-1),'Μεγάλο Σάββατο',1],['pa',E,'Κυριακή του Πάσχα',1],['dp',addDays(E,1),'Δευτέρα του Πάσχα',1],['pm',F(5,1),'Πρωτομαγιά',1],
   ['ap',addDays(E,50),'Αγίου Πνεύματος',1],['15a',F(8,15),'Κοίμηση της Θεοτόκου',1],['28o',F(10,28),'Επέτειος του «Όχι»',1],['pol',F(11,17),'Πολυτεχνείο (σχολεία)',0],
   ['xm',F(12,24),'Παραμονή Χριστουγέννων',0],['xr',F(12,25),'Χριστούγεννα',1],['sy',F(12,26),'Σύναξη της Θεοτόκου',1],['pp',F(12,31),'Παραμονή Πρωτοχρονιάς',0]].map(([id,date,name,def])=>({id,date,name,def:!!def}));}
const HOLC={};function holList(y){return HOLC[y]=HOLC[y]||grHolidays(y);}
function holOn(h){const H=biz().hol||{};return H[h.id]!==undefined?!!H[h.id]:h.def;}
function holidayOf(d){if(biz().holOff)return'';const h=holList(+d.slice(0,4)).find(x=>x.date===d&&holOn(x));return h?h.name:'';}
function isClosed(d){const C=closedDays();if(C[d]===false)return false;return!!C[d]||!!holidayOf(d);}

const ROLES=[['teacher','Καθηγητής',1],['assistant','Βοηθός καθηγητή',1],['secretary','Γραμματέας',0],['special','Ειδικός παιδαγωγός',1],['speech','Λογοθεραπευτής',1],['ot','Εργοθεραπευτής',1],['psych','Ψυχολόγος',1],['tutor','Φροντιστής / Ιδιαίτερα',1],['music','Δάσκαλος μουσικής / τέχνης',1],['coord','Υπεύθυνος σπουδών',0],['acct','Λογιστήριο / Διοικητικός',0],['clean','Καθαριότητα / Βοηθητικό',0],['other','Άλλη ειδικότητα',1]];
const STAFF_COLORS=['#7462B4','#3A8A61','#C77A3A','#2F7FA8','#B4527A','#8A7A2E','#5A6ACF','#A0522D','#2E8C8C','#9C5BB5'];

const provOf=a=>(a&&a.by)||'me';
const provOcc=o=>(o&&o.by)||provOf(o&&o.a);
function provById(id){const B=biz();if(id==='me')return{id:'me',name:S.user.name||'Εγώ',short:'Εγώ',color:B.meColor||'#7462B4',role:B.meRole};const x=B.staff.find(y=>y.id===id);return x?{id,name:x.name,short:(x.name||'').split(' ')[0],color:x.color,role:x.role,custom:x.custom}:{id,name:'—',short:'—',color:'#999'};}

/* όλες οι εμφανίσεις ραντεβού σε ένα διάστημα */
function occ(from,to,{sid,withCancel,by}={}){const out=[];const cl=closedDays();const sess=S.earn?(S.earn.sessions||[]):[];const B=by!==undefined?by:AGF;
  for(const a of appts()){if(sid&&a.sid!==sid)continue;if(!S.data.students.some(s=>s.id===a.sid))continue;
    const push=d=>{if(d<from||d>to||isClosed(d))return;const x=(a.ex||{})[d];if(x&&x.st==='moved')return;if(x&&x.st==='cancel'&&!withCancel)return;const done=sess.some(s=>s.studentId===a.sid&&s.date===d);out.push({a,date:d,s:a.s,e:a.e,by:(x&&x.by)||undefined,st:x&&x.st==='cancel'?'cancel':x&&x.st==='absent'?'absent':done?'done':'',key:a.id+'|'+d});};
    if(a.kind==='once'){push(a.date);continue;}
    let d=from>a.date?from:a.date;const wd=+a.d;const off=(wd-wdOf(d)+7)%7;d=addDays(d,off);
    for(;d<=to;d=addDays(d,7)){if(a.until&&d>a.until)break;if(a.kind==='biweekly'){const wk=Math.round((new Date(mondayOf(d))-new Date(mondayOf(a.date)))/6048e5);if(wk%2)continue;}push(d);}}
  return(B?out.filter(o=>provOcc(o)===B):out).sort((x,y)=>(x.date+x.s).localeCompare(y.date+y.s));}
function weeklySlots(sid){return appts().filter(a=>a.sid===sid&&a.kind!=='once'&&(!a.until||a.until>=todayISO())).map(a=>({id:a.id,d:+a.d,s:a.s,e:a.e,kind:a.kind}));}
function conflicts(date,s,e,skipId,by){return occ(date,date,{by:by||''}).concat(blockOcc(date,date,{by:by||''})).filter(o=>o.a.id!==skipId&&(!by||provOcc(o)===by)&&tmin(o.s)<tmin(e)&&tmin(s)<tmin(o.e));}
function freeSlots(date){const c=agCfg();if(!c.days.includes(wdOf(date))||isClosed(date))return[];const L=occ(date,date).concat(blockOcc(date,date));const P=AGF?[AGF]:providers().map(p=>p.id);const out=[];for(let t=tmin(c.from);t+c.step<=tmin(c.to);t+=c.step){const s=tstr(t);if(P.some(pid=>!L.some(o=>provOcc(o)===pid&&tmin(o.s)<t+c.step&&t<tmin(o.e))))out.push(s);}return out;}
function nextFree(){const now=new Date();let d=todayISO();for(let i=0;i<21;i++,d=addDays(d,1)){const F=freeSlots(d).filter(s=>i>0||tmin(s)>now.getHours()*60+now.getMinutes());if(F.length)return{date:d,s:F[0]};}return null;}
const stOf=id=>S.data.students.find(s=>s.id===id);
function pvBadge(a,full){const pid=a&&a.a?provOcc(a):provOf(a);if(providers().length<2&&pid==='me')return'';const p=provById(pid);return full?`<span class="pvtag"><i style="background:${p.color}">${provIni(p)}</i>${esc(p.short)}</span>`:`<i class="pvb" style="background:${p.color}" title="${esc(p.name)}">${provIni(p)}</i>`;}
const kindTxt=k=>k==='weekly'?'Πάγιο':k==='biweekly'?'Ανά 2 εβδ.':'Μία φορά';
function apptCard(o,{compact}={}){const st=stOf(o.a.sid)||{};return`<button type="button" class="appt ${apStateCls(o)} k-${o.a.kind} ${st.color?'hasc':''}" data-ap="${o.key}" ${st.color?`style="--sc:${st.color}"`:''}><span class="av">${st.avatar||'🙂'}</span><span class="grow"><b>${esc(stuName(st))}</b><small>${pvBadge(o,1)}${o.s}–${o.e}${compact?'':' · '+kindTxt(o.a.kind)}${o.st==='done'?' · ήρθε':o.st==='absent'?' · απουσία':o.st==='cancel'?' · ακυρώθηκε':''}${apptMats(o.a,o.date).length?' · 📚 '+apptMats(o.a,o.date).length:''}</small></span>${o.st==='done'?ic('check',15):o.st==='absent'||o.st==='cancel'?ic('x',15):''}</button>`;}

/* ---- διάταξη επικαλυπτόμενων ραντεβού: ομάδες που αλληλοκαλύπτονται, στήλες δίπλα-δίπλα (όπως τα επαγγελματικά ημερολόγια) ---- */
function laneLayout(list){const L=list.slice().sort((a,b)=>tmin(a.s)-tmin(b.s)||(tmin(b.e)-tmin(b.s))-(tmin(a.e)-tmin(a.s)));const out=[];let cl=[],clEnd=-1;
  const flush=()=>{const cols=[];cl.forEach(o=>{let i=cols.findIndex(end=>end<=tmin(o.s));if(i<0){i=cols.length;cols.push(0);}cols[i]=tmin(o.e);o.lane=i;});cl.forEach(o=>{o.lanes=cols.length;
    let span=1;for(let j=o.lane+1;j<cols.length;j++){if(cl.some(p=>p.lane===j&&tmin(p.s)<tmin(o.e)&&tmin(o.s)<tmin(p.e)))break;span++;}o.span=span;out.push(o);});cl=[];clEnd=-1;};
  L.forEach(o=>{if(cl.length&&tmin(o.s)>=clEnd)flush();cl.push(o);clEnd=Math.max(clEnd,tmin(o.e));});if(cl.length)flush();return out;}
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes();};
const isLive=o=>o.date===todayISO()&&!o.st&&tmin(o.s)<=nowMin()&&nowMin()<tmin(o.e);
const isActive=o=>!o.st&&(o.date>todayISO()||(o.date===todayISO()&&tmin(o.e)>nowMin()));
function apStateCls(o){return o.st==='cancel'?'cancel':o.st==='done'?'done':o.st==='absent'?'absent':isLive(o)?'live':isActive(o)?'active':'past';}

/* ---- χρονογραμμή ημέρας / εβδομάδας με ακριβείς ώρες ---- */
let PPM=(()=>{try{const v=+localStorage.getItem('lumio-agzoom');return v>=.5&&v<=3?v:1.15;}catch(e){return 1.15;}})();
/* εύρος προβολής: όλο το 24ωρο ή κλειδωμένο σε συγκεκριμένες ώρες */
function agLock(){try{const o=JSON.parse(localStorage.getItem('lumio-aglock')||'null');if(o&&o.from&&o.to)return o;}catch(e){}const c=agCfg();return{on:false,from:c.from,to:c.to};}
function agRange(){const L=agLock();if(L.on){const f=tmin(L.from),t=Math.max(tmin(L.to),f+60);return[f,t];}return[0,1440];}
function timelineHTML(days,L){const c=agCfg();const[f,t]=agRange();const wf=tmin(c.from),wt=tmin(c.to);const H=Math.round((t-f)*PPM);const today=todayISO();const nm=nowMin();

  return`<div class="tl" style="--cols:${days.length}"><div class="tl-head">${days.length>1?'<div></div>':''}${days.map(d=>{const la=loadAttr(d);if(days.length===1)return agDayHead(d,today,la,c);return`<a href="#/agenda?view=day&d=${d}" class="tl-dh ${la.cls} ${isClosed(d)?'closed':''} ${d===today?'today':''} ${c.days.includes(wdOf(d))&&!isClosed(d)?'':'off'}" style="${la.sty}" title="${la.tip}"><span>${WDAYS_S[wdOf(d)]}</span><b>${+d.slice(8)}</b>${la.txt?`<small class="ldt">${la.txt}</small>`:''}${day24HTML(d)}</a>`;}).join('')}</div>
   <div class="tl-scroll" id="tlScroll"><div class="tl-body" style="height:${H}px"><div class="tl-times">${hours.map(m=>`<span style="top:${Math.round((m-f)*PPM)}px">${tstr(m)}</span>`).join('')}</div>
   ${days.map(d=>{const off=!c.days.includes(wdOf(d))||isClosed(d);const X=laneLayout(L.filter(o=>o.date===d).concat(blockOcc(d,d)));
     return`<div class="tl-col ${off?'off':''} ${isClosed(d)?'closed':''} ${d===today?'today':''}" data-col="${d}">${hours.map(m=>`<i class="tl-line" style="top:${Math.round((m-f)*PPM)}px"></i>`).join('')}${wf>f?`<i class="tl-offh" style="top:0;height:${Math.round((Math.min(wf,t)-f)*PPM)}px"></i>`:''}${wt<t?`<i class="tl-offh" style="top:${Math.round((Math.max(wt,f)-f)*PPM)}px;bottom:0"></i>`:''}
      ${X.map(o=>{const top=Math.round((tmin(o.s)-f)*PPM),h=Math.max(22,Math.round((tmin(o.e)-tmin(o.s))*PPM)-2);const w=100/o.lanes;
        if(o.blk){const b=o.blk;return`<button type="button" class="tl-ev tl-blk" data-blk="${o.key}" data-s="${o.s}" data-e="${o.e}" style="top:${top}px;height:${h}px;left:calc(${o.lane*w}% + 2px);width:calc(${w*o.span}% - 4px);--bc:${blkColor(b)}" title="${esc(blkTitle(b))} ${o.s}–${o.e}">${pvBadge(o)}<b>${blkCat(b)[2]} ${esc(blkTitle(b))}</b><small>${o.s}–${o.e}</small><i class="rsz" aria-hidden="true"></i></button>`;}

        return`<button type="button" class="tl-ev ${apStateCls(o)} k-${o.a.kind} ${st.color?'hasc':''}" data-ap="${o.key}" data-s="${o.s}" data-e="${o.e}" style="top:${top}px;height:${h}px;left:calc(${o.lane*w}% + 2px);width:calc(${w*o.span}% - 4px)${st.color?';--sc:'+st.color:''}" title="${esc(stuName(st))} ${o.s}–${o.e}">${pvBadge(o)}<b>${st.avatar||''} ${esc(stuName(st))}</b><small>${o.s}–${o.e}${isLive(o)?' · τώρα':''}</small><i class="rsz" aria-hidden="true"></i></button>`;}).join('')}
      ${(()=>{const all=L.filter(o=>o.date===d).concat(blockOcc(d,d));const up=all.filter(o=>tmin(o.e)<=f),dn=all.filter(o=>tmin(o.s)>=t);return(up.length?`<span class="tl-more up" title="${up.map(o=>o.s).join(', ')}">↑ ${up.length} πριν τις ${tstr(f)}</span>`:'')+(dn.length?`<span class="tl-more dn" title="${dn.map(o=>o.s).join(', ')}">↓ ${dn.length} μετά τις ${tstr(t)}</span>`:'');})()}${d===today&&nm>=f&&nm<=t?`<i class="tl-now" style="top:${Math.round((nm-f)*PPM)}px"></i>`:''}</div>`;}).join('')}</div></div></div>`;}


/* ---- πληρότητα ημέρας με βάση το ωράριο λειτουργίας ---- */
function dayLoad(d){const c=agCfg();const f=tmin(c.from),t=Math.max(tmin(c.to),f+30);const cap=t-f;if(!c.days.includes(wdOf(d))||isClosed(d))return{off:true,busy:0,cap,frac:0};
  const P=AGF?[AGF]:providers().map(p=>p.id);const O=occ(d,d).concat(blockOcc(d,d));let busy=0;
  for(const pid of P){const iv=O.filter(o=>provOcc(o)===pid).map(o=>[Math.max(f,tmin(o.s)),Math.min(t,tmin(o.e))]).filter(x=>x[1]>x[0]).sort((a,b)=>a[0]-b[0]);let cs=-1,ce=-1;
    for(const[a,b]of iv){if(a>ce){busy+=Math.max(0,ce-cs);cs=a;ce=b;}else ce=Math.max(ce,b);}busy+=Math.max(0,ce-cs);}
  const capT=cap*P.length;return{off:false,busy,cap:capT,frac:Math.min(1,busy/capT),n:P.length};}
const hN=m=>{const h=m/60;return Number.isInteger(h)?String(h):h.toFixed(1).replace('.',',');};
function loadAttr(d){const L=dayLoad(d);if(L.off)return{cls:'',sty:'',txt:'',tip:''};const fr=L.frac;const hue=Math.round(130*(1-fr));
  return{cls:`ld ${fr>=1?'ld-full':''}`,sty:`--ld:${Math.round(fr*100)}%;--lc:hsl(${hue} 68% 55%)`,txt:`${hN(L.busy)}/${hN(L.cap)}`,tip:`Πληρότητα: ${hN(L.busy)} από ${hN(L.cap)} ώρες ραντεβού${L.n>1?` (${L.n} άτομα × ${hN(L.cap/L.n)} ώρες)`:''} — ${Math.round(fr*100)}%`};}

     <div class="mev">${X.slice().sort((p,q)=>{const r=o=>isLive(o)?0:isActive(o)?1:2;return r(p)-r(q)||p.s.localeCompare(q.s);}).slice(0,3).sort((p,q)=>p.s.localeCompare(q.s)).map(o=>{const st=stOf(o.a.sid)||{};return`<span class="mchip ${apStateCls(o)}">${o.s} ${esc((stuName(st)||'').split(' ')[0])}</span>`;}).join('')}${X.length>3?`<span class="mmore">+${X.length-3} ακόμα</span>`:''}</div></a>`;}).join('')}</div></div>`;}

/* ---- λωρίδα ημερών του μήνα (προβολή Ημέρα): κύλιση, αλλαγή μήνα, πληρότητα, πρώτο κενό ---- */
function daystripHTML(sel,t){const c=agCfg();const ym=sel.slice(0,7);const[Y,Mo]=ym.split('-').map(Number);const last=+isoDate(new Date(Y,Mo,0)).slice(8);

  const days=[...Array(last)].map((_,i)=>`${ym}-${pad(i+1)}`);const O=occ(`${ym}-01`,`${ym}-${pad(last)}`);
  const nf=nextFreeFrom(t);let busyD=0,fullD=0,workD=0;
  const chips=days.map(d=>{const off=!c.days.includes(wdOf(d))||isClosed(d);const n=O.filter(o=>o.date===d).length;const la=loadAttr(d);const F=off?[]:freeSlots(d).filter(x=>d!==t||tmin(x)>nowMin());
    if(!off){workD++;if(n)busyD++;if(!freeSlots(d).length)fullD++;}
    const full=!off&&!freeSlots(d).length;const sub=isClosed(d)?(holidayOf(d)?'αργία':'κλειστά'):off?'ρεπό':d<t||(d===t&&!F.length&&!full)?(n?n+' ραντ.':'—'):full?'γεμάτη':`κενό ${F[0]}`;
    return`<a href="#/agenda?view=day&d=${d}" data-dd="${d}" class="dchip ${la.cls} ${isClosed(d)?'closed':''} ${d===sel?'on':''} ${d===t?'today':''} ${d<t?'pastd':''} ${off?'off':''} ${wdOf(d)===1?'wk':''}" style="${la.sty}" title="${isClosed(d)?esc(holidayOf(d)||'Κλειστά'):la.tip}"><span>${WDAYS_S[wdOf(d)]}</span><b>${+d.slice(8)}</b>${n?`<em class="dn">${n}</em>`:''}<small class="${F.length&&d>=t?'fr':''}">${sub}</small>${la.txt?`<small class="ldt">${la.txt}</small>`:''}${day24HTML(d)}</a>`;}).join('');
  return`<div class="dstrip-h"><div class="seg" style="align-items:center"><a href="#/agenda?view=day&d=${mv(-1)}" aria-label="Προηγούμενος μήνας">${ic('left',16)}</a><a href="#/agenda?view=day&d=${mv(0)===t?t:ym+'-01'}" class="dsm">${MONTHS[Mo-1]} ${Y}</a><a href="#/agenda?view=day&d=${mv(1)}" aria-label="Επόμενος μήνας">${ic('right',16)}</a></div>
    <div class="row" style="gap:6px">${sel!==t?`<a class="btn sm" href="#/agenda?view=day&d=${t}">${ic('calendar',14)} Σήμερα</a>`:''}${nf?`<button type="button" class="btn sm soft" data-new="${nf.date}|${nf.s}" title="Κλείσε ραντεβού στο πρώτο ελεύθερο κενό">${ic('plus',14)} Πρώτο κενό: ${nf.date===t?'σήμερα':WDAYS_S[wdOf(nf.date)]+' '+fmtShort(nf.date)} ${nf.s}</button>`:''}</div></div>
   <div class="dstrip" id="dstrip">${chips}</div>
   <div class="dstat tiny muted">${MONTHS[Mo-1]}: ${O.length} ραντεβού · ${busyD}/${workD} εργάσιμες με ραντεβού · ${fullD?`<b style="color:var(--bad)">${fullD} γεμάτες</b>`:'καμία γεμάτη'}</div>`;}
function agDayHead(sel,t,la,c){const dd=Math.round((new Date(sel+'T12:00')-new Date(t+'T12:00'))/864e5);const rel=dd===0?'Σήμερα':dd===1?'Αύριο':dd===-1?'Χθες':'';const y=+sel.slice(0,4);const off=!c.days.includes(wdOf(sel))||isClosed(sel);
  return`<div class="tl-dh one dayhd ${la.cls} ${dd===0?'today':''} ${isClosed(sel)?'closed':''} ${off?'offday':''}" style="${la.sty}" title="${la.tip}"><a class="dayarr" href="#/agenda?view=day&d=${addDays(sel,-1)}" aria-label="Προηγούμενη μέρα">${ic('left',22)}</a>

    <a class="dayarr" href="#/agenda?view=day&d=${addDays(sel,1)}" aria-label="Επόμενη μέρα">${ic('right',22)}</a></div>`;}
function nextFreeFrom(t){const now=nowMin();let d=t;for(let i=0;i<45;i++,d=addDays(d,1)){const F=freeSlots(d).filter(s=>i>0||tmin(s)>now);if(F.length)return{date:d,s:F[0]};}return null;}

/* ελεύθερα κενά για συγκεκριμένο άτομο και διάρκεια, ανά μισή ώρα */
function slotsFor(date,pv,dur,skipId){const c=agCfg();if(!c.days.includes(wdOf(date))||isClosed(date))return[];const L=occ(date,date,{by:pv}).concat(blockOcc(date,date,{by:pv})).filter(o=>o.a.id!==skipId);const out=[];const now=date===todayISO()?nowMin():-1;
  for(let t=tmin(c.from);t+dur<=tmin(c.to);t+=30){if(t<=now)continue;if(!L.some(o=>tmin(o.s)<t+dur&&t<tmin(o.e)))out.push(tstr(t));}return out;}
