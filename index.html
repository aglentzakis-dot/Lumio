<!doctype html>
<html lang="el"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LUMIO</title>
<meta name="description" content="Εξατομικευμένα εκπαιδευτικά παιχνίδια, φύλλα εργασίας και προγράμματα για κάθε μαθητή.">
<meta name="theme-color" content="#FBF7EF">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700;800&family=Comfortaa:wght@500;700&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap&subset=greek" rel="stylesheet">
<style>/* LUMIO — σταθερό πλαϊνό μενού + σελίδες με κάρτες· απαλό παστέλ σε κρεμ βάση */
:root{
  --cream:#FAF6EF;--paper:#FFFFFF;--field:#FFFFFF;--raise:#FDFBF7;
  --ink:#2E2A33;--ink2:#6B6573;--ink3:#9C95A5;--on-ink:#FFFFFF;
  --line:#ECE5DA;--line2:#F3EEE6;
  --yellow:#F8E7AE;--yellow-d:#B98A1E;--lilac:#E9E2F7;--lilac-d:#7462B4;--pink:#F9E0E8;--pink-d:#C0627F;
  --peach:#FCE6D6;--peach-d:#C77A4E;--blue:#DFEBF8;--blue-d:#4E7FB8;--mint:#DFF1E6;--mint-d:#3A8A61;
  --ok:#3A8A61;--bad:#C2524A;--warn:#B98A1E;--badbg:#FBE4E1;
  --sh:0 1px 2px rgba(46,42,51,.04),0 8px 28px rgba(46,42,51,.06);
  --font:"Commissioner",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --head:"Literata",Georgia,"Times New Roman",serif;
  --side:256px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --cream:#16141B;--paper:#1F1C25;--field:#262230;--raise:#24212B;
  --ink:#EEEAF3;--ink2:#B3ABBD;--ink3:#857D90;--on-ink:#16141B;
  --line:#322D3B;--line2:#2A2632;
  --yellow:#3A3120;--yellow-d:#E7C46A;--lilac:#2E2846;--lilac-d:#B8A8F2;--pink:#3B2530;--pink-d:#EE9DB5;
  --peach:#3B2B21;--peach-d:#F0AE86;--blue:#1E2B3C;--blue-d:#8EB6E8;--mint:#1D3227;--mint-d:#7FCFA3;
  --ok:#7FCFA3;--bad:#F08A80;--warn:#E7C46A;--badbg:#3D2224;
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --cream:#16141B;--paper:#1F1C25;--field:#262230;--raise:#24212B;
  --ink:#EEEAF3;--ink2:#B3ABBD;--ink3:#857D90;--on-ink:#16141B;
  --line:#322D3B;--line2:#2A2632;
  --yellow:#3A3120;--yellow-d:#E7C46A;--lilac:#2E2846;--lilac-d:#B8A8F2;--pink:#3B2530;--pink-d:#EE9DB5;
  --peach:#3B2B21;--peach-d:#F0AE86;--blue:#1E2B3C;--blue-d:#8EB6E8;--mint:#1D3227;--mint-d:#7FCFA3;
  --ok:#7FCFA3;--bad:#F08A80;--warn:#E7C46A;--badbg:#3D2224;
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
body{min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--lilac-d)}
h1,h2,h3{font-family:var(--head);font-weight:600;letter-spacing:-.01em;margin:0 0 .4em;text-wrap:balance}
h1{font-size:1.65rem}h2{font-size:1.2rem}h3{font-size:1.02rem}
.muted{color:var(--ink2)}.small{font-size:.86rem}.tiny{font-size:.76rem}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--lilac-d);outline-offset:2px}
.ic{display:inline-block;vertical-align:middle;flex:none}
.icw{display:inline-flex;margin-right:7px;vertical-align:-3px}
.btn .icw{margin-right:0}

/* ===== κέλυφος ===== */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{background:var(--paper);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:16px 12px 12px;z-index:60}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;text-decoration:none;color:var(--ink)}
.brand svg{width:38px;height:38px;flex:none;border-radius:11px}
.brand b{font-family:var(--head);font-size:1.18rem;letter-spacing:.12em;display:block;line-height:1.1}
.brand span{font-size:.7rem;color:var(--ink2);display:block}
.nav{display:flex;flex-direction:column;gap:1px}
.nav-h{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink3);padding:16px 12px 6px;font-weight:600}
.nav a,.nav button.navx{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:10px;color:var(--ink2);text-decoration:none;font-size:.92rem;border:0;background:transparent;width:100%;text-align:left;cursor:pointer}
.nav a .ic,.nav .navx .ic{color:var(--ink3)}
.nav a:hover,.nav .navx:hover{background:var(--line2);color:var(--ink)}
.nav a.on{background:var(--lilac);color:var(--ink);font-weight:600}
.nav a.on .ic{color:var(--lilac-d)}
.nav .navx .chev{margin-left:auto;transition:transform .2s}
.nav .navx.open .chev{transform:rotate(180deg)}
.nav .navx.on{color:var(--ink);font-weight:600}
.nav .sub{display:flex;flex-direction:column;gap:1px;margin:2px 0 4px 22px;padding-left:12px;border-left:1px solid var(--line)}
.nav .sub a{padding:6px 10px;font-size:.86rem}
.nav .sub a.on{background:transparent;color:var(--lilac-d);font-weight:600}
.side-foot{margin-top:auto;padding:12px 4px 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.side-foot>div{flex:1;min-width:0}
.side-foot b{display:block;font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot span{font-size:.72rem;color:var(--ink2)}
.meav{width:34px;height:34px;border-radius:50%;background:var(--lilac);display:grid;place-items:center;font-weight:700;color:var(--lilac-d);flex:none;text-decoration:none}
.meav.lg{width:52px;height:52px;font-size:1.3rem}
.iconbtn{position:relative;width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;border:0;background:transparent;color:var(--ink2);cursor:pointer;text-decoration:none;flex:none}
.iconbtn:hover{background:var(--line2);color:var(--ink)}
.iconbtn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--pink-d)}
.shell{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;height:60px;padding:0 clamp(16px,3vw,36px);background:color-mix(in srgb,var(--cream) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar .burger,.topbar .tlogo{display:none}
.crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-size:.88rem;color:var(--ink2);white-space:nowrap;overflow:hidden}
.crumbs a{color:var(--ink2);text-decoration:none}.crumbs a:hover{color:var(--ink)}
.crumbs b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.crumbs .ic{color:var(--ink3)}
.main{width:100%;max-width:1180px;margin:0 auto;padding:28px clamp(16px,3vw,36px) 72px}
.bottomnav,.drawer-ov{display:none}
@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);transform:translateX(-102%);transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.18);padding-top:calc(16px + env(safe-area-inset-top,0px))}
  body.drawer .side{transform:none}
  body.drawer .drawer-ov{display:block;position:fixed;inset:0;background:rgba(20,18,25,.35);z-index:55}
  .topbar{height:auto;min-height:56px;padding:calc(6px + env(safe-area-inset-top,0px)) 8px 6px}
  .topbar .burger{display:inline-grid}
  .crumbs{font-size:1rem}.crumbs .cpath{display:none}.crumbs b{font-family:var(--head);font-size:1.08rem}
  .main{padding:18px 16px 104px}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--ink3);font-size:.66rem;font-weight:500;cursor:pointer}
  .bottomnav .bi{display:grid;place-items:center;width:52px;height:30px;border-radius:15px;transition:.15s}
  .bottomnav a.on{color:var(--ink)}
  .bottomnav a.on .bi{background:var(--lilac);color:var(--lilac-d)}
  .bottomnav a.mid .bi{background:var(--ink);color:var(--on-ink);width:46px;height:46px;border-radius:50%;margin-top:-20px;box-shadow:0 6px 16px rgba(46,42,51,.25)}
}

/* ===== σελίδα ===== */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.page-head>div:first-child{min-width:0}
.page-head h1{margin:0}
.page-head .sub{color:var(--ink2);margin-top:4px;font-size:.92rem}
.page-head .actions{display:flex;gap:8px;flex-wrap:wrap}
.eyebrow{font-size:.76rem;color:var(--ink2);letter-spacing:.03em;margin-bottom:2px}
.section{margin-bottom:26px}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 2px 10px}
.section-h h2{font-family:var(--font);font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink2);font-weight:600;margin:0}
.section-h a,.section-h button{font-size:.84rem;color:var(--lilac-d);text-decoration:none;background:none;border:0;cursor:pointer}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a,.tabs button{padding:10px 14px;color:var(--ink2);text-decoration:none;font-weight:500;font-size:.9rem;border:0;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tabs a:hover,.tabs button:hover{color:var(--ink)}
.tabs a.on,.tabs button.on{color:var(--ink);border-bottom-color:var(--lilac-d);font-weight:600}
.seg{display:inline-flex;gap:3px;background:var(--line2);padding:3px;border-radius:11px;max-width:100%;overflow-x:auto}
.seg a,.seg button{padding:6px 13px;border-radius:8px;text-decoration:none;color:var(--ink2);font-size:.85rem;font-weight:500;white-space:nowrap;border:0;background:none;cursor:pointer}
.seg .on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px}
.card.pad0{padding:0;overflow:hidden}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.card-h h3{margin:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:960px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stack>*+*{margin-top:12px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis.k6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media(max-width:960px){.kpis.k6{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:620px){.kpis,.kpis.k3,.kpis.k6{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-decoration:none;color:var(--ink);display:block;min-width:0}
a.kpi:hover{border-color:var(--lilac-d)}
.kpi .k{font-size:.78rem;color:var(--ink2);display:flex;align-items:center;gap:6px}
.kpi .v{font-family:var(--head);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-size:.76rem;color:var(--ink3)}
.kpi .v.sm{font-size:1.15rem}
/* γραμμές λίστας */
.list{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.rw{display:flex;align-items:center;gap:12px;padding:12px 16px;border:0;border-bottom:1px solid var(--line2);background:transparent;width:100%;text-align:left;color:var(--ink);text-decoration:none;font:inherit;cursor:pointer;min-height:58px}
.rw:last-child{border-bottom:0}
.rw:hover{background:var(--raise)}
.rw>.ic:last-child{color:var(--ink3)}
.rw .grow{flex:1;min-width:0}
.rw b{display:block;font-weight:600;font-size:.94rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw small{display:block;color:var(--ink2);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw.static{cursor:default}.rw.static:hover{background:transparent}
.rw.danger,.rw.danger .ricon{color:var(--bad)}
.rw .av{width:40px;height:40px;border-radius:12px;font-size:1.2rem}
.rw .end{display:flex;gap:6px;align-items:center;flex:none}
.ricon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--line2);color:var(--ink2);flex:none}
.ricon.l{background:var(--lilac);color:var(--lilac-d)}.ricon.b{background:var(--blue);color:var(--blue-d)}.ricon.p{background:var(--pink);color:var(--pink-d)}.ricon.pe{background:var(--peach);color:var(--peach-d)}.ricon.y{background:var(--yellow);color:var(--yellow-d)}.ricon.g{background:var(--mint);color:var(--mint-d)}.ricon.r{background:var(--pink);color:var(--pink-d)}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:1.3rem;flex:none;background:var(--lilac)}
.pct{font-weight:700;font-variant-numeric:tabular-nums}
.pct.g{color:var(--ok)}.pct.y{color:var(--warn)}.pct.r{color:var(--bad)}
.bar{height:7px;border-radius:9px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--lilac-d)}
.empty{text-align:center;padding:36px 16px;color:var(--ink2)}
.empty .e{color:var(--ink3);margin-bottom:8px}
.empty b{display:block;color:var(--ink);font-size:1rem;margin-bottom:4px}
/* κουμπιά */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--paper);padding:8px 15px;border-radius:11px;cursor:pointer;font-weight:500;font-size:.9rem;text-decoration:none;color:var(--ink);transition:.15s;min-height:40px;white-space:nowrap}
.btn:hover{background:var(--line2)}
.btn.pri{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.pri:hover{opacity:.9}
.btn.soft{background:var(--lilac);border-color:transparent;color:var(--ink)}
.btn.yel{background:var(--yellow);border-color:transparent;color:var(--ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 11px;min-height:32px;font-size:.83rem;border-radius:9px}
.btn.lg{min-height:48px;padding:12px 22px;font-size:1rem}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:var(--line2);font-size:.78rem;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.chip.l{background:var(--lilac)}.chip.y{background:var(--yellow)}.chip.p{background:var(--pink)}.chip.b{background:var(--blue)}.chip.pe{background:var(--peach)}.chip.m{background:var(--mint)}
.chip.ok{background:var(--mint);color:var(--ok)}.chip.bad{background:var(--badbg);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
button.chip{border:0;cursor:pointer}
/* φόρμες */
label.f{display:block;font-size:.83rem;color:var(--ink2);margin-bottom:5px;font-weight:500}
.in{width:100%;border:1px solid var(--line);background:var(--field);border-radius:11px;padding:9px 12px;outline:none;transition:.15s;min-height:42px;color:var(--ink)}
.in:focus{border-color:var(--lilac-d);box-shadow:0 0 0 3px var(--lilac)}
textarea.in{min-height:96px;resize:vertical}
.in.sm{min-height:34px;padding:5px 10px;font-size:.86rem;width:auto;border-radius:9px}
.field{margin-bottom:14px}
.check{display:flex;gap:9px;align-items:flex-start;font-size:.92rem;cursor:pointer}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--lilac-d);flex:none}
.switch{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.switch:last-child{border-bottom:0}
.switch input{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:.2s}
.switch input:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--paper);transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked{background:var(--lilac-d)}
.switch input:checked:after{left:21px}
.switch b{display:block;font-weight:500;font-size:.94rem}.switch small{color:var(--ink2);font-size:.8rem}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .search{position:relative;flex:1;min-width:200px}
.toolbar .search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.toolbar .search input{padding-left:38px}
.toolbar select.in{width:auto;min-width:0;max-width:100%}
/* σημειώσεις */
.note{background:var(--yellow);border-radius:14px;padding:12px 14px;font-size:.88rem;color:var(--ink)}
.note.l{background:var(--lilac)}.note.b{background:var(--blue)}.note.p{background:var(--pink)}
.warnbox{border-left:3px solid var(--warn);background:color-mix(in srgb,var(--yellow) 60%,var(--paper));padding:10px 12px;border-radius:10px;font-size:.88rem}
.okbox{border-left:3px solid var(--ok);background:var(--mint);padding:10px 12px;border-radius:10px;font-size:.88rem}
.banner2{display:flex;align-items:center;gap:10px;background:var(--lilac);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:.9rem}
.banner2 .grow{flex:1;min-width:0}
.kv{display:grid;grid-template-columns:170px 1fr;gap:10px 16px;font-size:.92rem;margin:0}
.kv dt{color:var(--ink2)}.kv dd{margin:0;white-space:pre-wrap}
@media(max-width:620px){.kv{grid-template-columns:1fr;gap:2px}.kv dd{margin-bottom:10px}}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:44px;color:var(--ink2);text-align:center}
.loading .sun{width:56px;height:56px;animation:pulse 1.6s ease-in-out infinite}
.loading .sun svg{width:56px;height:56px;border-radius:16px}
@keyframes pulse{50%{transform:scale(1.08);opacity:.75}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* διάλογοι */
.ov{position:fixed;inset:0;background:rgba(20,18,25,.4);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.dlg{background:var(--paper);color:var(--ink);border-radius:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.dlg.wide{max-width:880px}
@media(max-width:620px){.ov{align-items:flex-end;padding:0}.dlg{border-radius:20px 20px 0 0;max-height:92vh;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}}
@keyframes fade{from{opacity:0}}
.toasts{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:460px}
.toast{background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:12px;font-size:.9rem;animation:fade .2s;box-shadow:var(--sh);pointer-events:auto}
.toast.bad{background:var(--bad);color:#fff}.toast.ok{background:var(--ok);color:var(--on-ink)}
.banner{background:var(--ink);color:var(--on-ink);padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:center;font-size:.9rem;flex-wrap:wrap}
table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t th{text-align:left;font-weight:600;color:var(--ink2);font-size:.76rem;padding:8px;border-bottom:1px solid var(--line)}
table.t td{padding:10px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:var(--raise)}
.tablewrap{overflow-x:auto}

/* ===== σύνδεση ===== */
.auth{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr;background:var(--cream)}
.auth-art{position:relative;overflow:hidden;background:linear-gradient(160deg,#FCEFC9 0%,#F6DCE6 55%,#E6DDF6 100%);display:flex;flex-direction:column;justify-content:space-between;padding:40px;color:#2E2A33}
.auth-art .mark{display:flex;align-items:center;gap:12px}
.auth-art .mark svg{width:44px;height:44px;border-radius:12px}
.auth-art .mark b{font-family:var(--head);font-size:1.3rem;letter-spacing:.16em}
.auth-art .scene{align-self:center;width:min(380px,80%)}
.auth-art .scene svg{width:100%;height:auto;display:block}
.auth-art blockquote{margin:0;font-family:var(--head);font-size:1.5rem;line-height:1.3;max-width:420px}
.auth-art blockquote small{display:block;font-family:var(--font);font-size:.9rem;margin-top:10px;opacity:.75}
.auth-side{display:flex;align-items:center;justify-content:center;padding:32px 20px}
.auth-card{width:100%;max-width:400px}
.auth-card h1{font-size:1.75rem;margin-bottom:6px}
.auth-card .lead{color:var(--ink2);margin-bottom:24px}
.auth-card .alt{margin-top:18px;text-align:center;font-size:.9rem;color:var(--ink2)}
.auth-card .alt a,.auth-card .alt button{color:var(--lilac-d);font-weight:600;background:none;border:0;cursor:pointer;text-decoration:none;padding:0}
.auth-welcome{text-align:center}
.auth-welcome .logo{width:96px;height:96px;margin:0 auto 14px;display:block}
.auth-welcome .logo svg{width:96px;height:96px;border-radius:26px}
.auth-welcome h1{font-size:2.4rem;letter-spacing:.2em;margin-bottom:4px}
.auth-welcome .stack{margin-top:28px}
.pw{position:relative}.pw .in{padding-right:44px}.pw button{position:absolute;right:4px;top:50%;transform:translateY(-50%)}
.codebox2{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.3rem;letter-spacing:.08em;text-align:center;background:var(--yellow);padding:16px;border-radius:14px;user-select:all;font-weight:700}
@media(max-width:860px){.auth{grid-template-columns:1fr}.auth-art{display:none}.auth-side{min-height:100vh;align-items:flex-start;padding-top:calc(48px + env(safe-area-inset-top,0px))}}

/* ===== πίνακας ελέγχου ===== */
.ask{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px 16px 12px;box-shadow:var(--sh)}
.ask .askrow{display:flex;gap:12px;align-items:flex-start;color:var(--lilac-d)}
.ask textarea{flex:1;border:0;outline:0;resize:none;background:transparent;font:inherit;font-size:1.05rem;color:var(--ink);min-height:52px;line-height:1.45;padding:2px 0}
.ask .askfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;padding-top:12px;border-top:1px solid var(--line2);flex-wrap:wrap}
.sugs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.sugs button{border:1px solid var(--line);background:transparent;color:var(--ink2);border-radius:999px;padding:5px 12px;font-size:.8rem;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugs button:hover{border-color:var(--lilac-d);color:var(--ink)}
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:760px){.qa{grid-template-columns:repeat(2,minmax(0,1fr))}}
.qa a{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.9rem;padding:14px;background:var(--paper);border:1px solid var(--line);border-radius:16px;transition:.15s;min-width:0}
.qa a:hover{border-color:var(--lilac-d);transform:translateY(-1px)}
.qa a span:last-child{min-width:0}
.hint{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:.84rem;color:var(--ink);text-decoration:none;background:var(--yellow);padding:6px 12px;border-radius:999px}

/* ===== μαθητές ===== */
.stucards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.stucard{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:12px;transition:.15s;min-width:0}
.stucard:hover{border-color:var(--lilac-d);box-shadow:var(--sh)}
.stucard .top{display:flex;gap:12px;align-items:center;min-width:0}
.stucard .top>div{min-width:0}
.stucard b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stucard .meta{font-size:.8rem;color:var(--ink2)}
.stucard .foot{display:flex;justify-content:space-between;font-size:.78rem;color:var(--ink2);border-top:1px solid var(--line2);padding-top:10px;gap:8px}
.profile-head{display:flex;gap:16px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.profile-head .av{width:64px;height:64px;border-radius:20px;font-size:2rem;background:var(--lilac)}
.profile-head h1{margin:0}
.profile-head>div{flex:1;min-width:200px}
.idgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:620px){.idgrid{grid-template-columns:minmax(0,1fr)}}
.idcell{background:var(--raise);border:1px solid var(--line2);border-radius:14px;padding:12px 14px}
.idcell .k{font-size:.74rem;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.idcell .v{font-size:.92rem;white-space:pre-wrap}
.pre{white-space:pre-wrap;background:var(--line2);padding:12px;border-radius:12px;font-size:.84rem;margin:0;font-family:ui-monospace,Menlo,Consolas,monospace}

/* ===== δημιουργία ===== */
.createg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media(max-width:960px){.createg{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:420px){.createg{grid-template-columns:minmax(0,1fr)}}
.ctile{display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:20px;background:var(--paper);border:1px solid var(--line);text-decoration:none;color:var(--ink);transition:.15s;min-height:150px}
.ctile:hover{border-color:var(--lilac-d);box-shadow:var(--sh);transform:translateY(-2px)}
.ctile .ricon{width:48px;height:48px;border-radius:14px}
.ctile b{font-size:1rem}.ctile span{font-size:.82rem;color:var(--ink2)}
.wiz{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;align-items:start}
@media(max-width:960px){.wiz{grid-template-columns:minmax(0,1fr)}}
.steps{display:flex;flex-direction:column;gap:4px;position:sticky;top:80px}
.steps button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:12px;text-align:left;cursor:pointer;color:var(--ink2);font-size:.9rem}
.steps button .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-size:.8rem;font-weight:700;flex:none;background:var(--paper)}
.steps button small{display:block;font-size:.74rem;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.steps button.on{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.steps button.on .n{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.steps button.done .n{background:var(--lilac);border-color:transparent;color:var(--lilac-d)}
@media(max-width:960px){.steps{position:static;flex-direction:row;overflow-x:auto;gap:6px;scrollbar-width:none}.steps::-webkit-scrollbar{display:none}.steps button{flex:none;padding:6px 10px}.steps button small{display:none}}
.wizcard{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:24px}
.wizcard h2{font-size:1.3rem;margin-bottom:4px}
.wizcard .lead{color:var(--ink2);margin:0 0 18px;font-size:.92rem}
.wizfoot{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line2)}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.choices.wide{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.choice{display:flex;flex-direction:column;gap:6px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--paper);cursor:pointer;text-align:left;color:var(--ink);font:inherit;transition:.12s;min-width:0}
.choice:hover{border-color:var(--lilac-d)}
.choice.on{border-color:var(--lilac-d);background:var(--lilac);box-shadow:0 0 0 1px var(--lilac-d)}
.choice b{font-size:.92rem}.choice span{font-size:.78rem;color:var(--ink2)}
.choice .e{font-size:1.5rem;line-height:1}
.choice.row1{flex-direction:row;align-items:center;gap:12px}
.aiquick{background:linear-gradient(120deg,var(--lilac),var(--pink));border-radius:20px;padding:16px;margin-bottom:22px}
.aiquick .askrow{display:flex;gap:10px;align-items:flex-start}
.aiquick textarea{flex:1;border:0;outline:0;background:var(--paper);border-radius:12px;padding:10px 12px;resize:none;min-height:50px;font:inherit;color:var(--ink)}
.aiquick .lbl{font-size:.8rem;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.summary{display:grid;grid-template-columns:140px 1fr;gap:8px 14px;font-size:.92rem;background:var(--raise);border:1px solid var(--line2);border-radius:14px;padding:14px 16px}
.summary dt{color:var(--ink2)}.summary dd{margin:0}
@media(max-width:620px){.summary{grid-template-columns:1fr;gap:2px}.summary dd{margin-bottom:8px}}
.genscreen{max-width:520px;margin:40px auto;text-align:center}
/* προεπισκόπηση */
.cover{border-radius:22px;padding:24px;display:flex;gap:18px;align-items:center;margin-bottom:18px;color:#2E2A33;flex-wrap:wrap}
.cover.dark{color:#fff}
.cover .big{font-size:3.2rem;line-height:1;width:84px;height:84px;display:grid;place-items:center;background:rgba(255,255,255,.55);border-radius:22px;flex:none}
.cover.dark .big{background:rgba(255,255,255,.12)}
.cover h1{margin:0 0 6px;font-size:1.6rem}
.cover>div:nth-child(2){flex:1;min-width:200px}
.cover .chip{background:rgba(255,255,255,.65);color:#2E2A33}
.cover .acts{display:flex;gap:8px;flex-wrap:wrap}
.cover .btn{border-color:transparent}
.actbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.actbar .btn{background:var(--paper)}
.qprev{counter-reset:q;display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.qprev li{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;counter-increment:q;position:relative;padding-left:52px}
.qprev li:before{content:counter(q);position:absolute;left:14px;top:14px;width:26px;height:26px;border-radius:50%;background:var(--lilac);color:var(--lilac-d);display:grid;place-items:center;font-size:.78rem;font-weight:700}
.qprev .q{font-weight:600}
.qprev .meta{font-size:.76rem;color:var(--ink3);margin-top:6px}
.side2{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media(max-width:960px){.side2{grid-template-columns:minmax(0,1fr)}}
/* βιβλιοθήκες */
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.libcard{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:.15s;min-width:0}
.libcard:hover{border-color:var(--lilac-d);box-shadow:var(--sh)}
.libcard .band{height:84px;display:flex;align-items:flex-end;justify-content:space-between;padding:12px 14px;text-decoration:none;color:#2E2A33}
.libcard .band.dark{color:#fff}
.libcard .band .e{font-size:2rem;line-height:1}
.libcard .band .t{font-size:.72rem;font-weight:600;background:rgba(255,255,255,.7);color:#2E2A33;padding:2px 8px;border-radius:999px}
.libcard .body{padding:14px 16px;flex:1;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);min-width:0}
.libcard .body b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.libcard .meta{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.8rem;color:var(--ink2)}
.libcard .meta span:nth-child(even){color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.libcard .acts{display:flex;border-top:1px solid var(--line2)}
.libcard .acts button,.libcard .acts a{flex:1;border:0;background:none;padding:10px 4px;font-size:.82rem;color:var(--ink2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-weight:500}
.libcard .acts>*+*{border-left:1px solid var(--line2)}
.libcard .acts button:hover,.libcard .acts a:hover{background:var(--raise);color:var(--ink)}
.drop{border:2px dashed var(--line);border-radius:20px;padding:28px 16px;text-align:center;background:var(--paper);transition:.15s;cursor:pointer}
.drop.over{border-color:var(--lilac-d);background:var(--lilac)}
.drop .ricon{margin:0 auto 10px;width:52px;height:52px;border-radius:16px}
.upcard .thumb{height:120px;background:var(--line2);display:grid;place-items:center;color:var(--ink3);overflow:hidden}
.upcard .thumb img{width:100%;height:100%;object-fit:cover}
.upcard .turn{display:flex;flex-direction:column;gap:6px;padding:0 16px 14px}
/* ρυθμίσεις */
.setlayout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}
@media(max-width:960px){.setlayout{grid-template-columns:minmax(0,1fr)}.setlayout.has-sec .setnav{display:none}.setlayout:not(.has-sec) .setbody{display:none}}
.setnav{position:sticky;top:80px}
.setnav .rw{min-height:48px;padding:10px 14px}
.setnav .rw.on{background:var(--lilac)}
.setnav .rw .ricon{width:32px;height:32px;border-radius:10px}
.setbody h2{font-size:1.25rem}
.setbody .card+.card{margin-top:16px}
.setmeta{color:var(--ink2);font-size:.9rem;margin:-4px 0 18px}
.optrow{display:flex;gap:10px;flex-wrap:wrap}
.optrow .choice{flex:1;min-width:120px}
/* ημερολόγιο */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .h{font-size:.72rem;color:var(--ink2);text-align:center;padding:4px 0;text-transform:uppercase;letter-spacing:.06em}
.cal .d{min-height:92px;background:var(--paper);border:1px solid var(--line2);border-radius:12px;padding:6px;font-size:.72rem;cursor:pointer;overflow:hidden;text-align:left;font:inherit;color:var(--ink)}
.cal .d:hover{border-color:var(--lilac-d)}
.cal .d.out{opacity:.4}.cal .d.today{border-color:var(--lilac-d);box-shadow:0 0 0 2px var(--lilac)}
.cal .d.sel{background:var(--lilac)}
.cal .d .n{font-weight:700;font-size:.8rem}
.cal .ev{display:block;margin-top:3px;padding:1px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.7rem}
.ev.res{background:var(--mint)}.ev.res.low{background:var(--pink)}.ev.plan{background:var(--yellow)}.ev.sess{background:var(--blue)}.ev.mat{background:var(--peach)}
.cal .dots{display:none}
@media(max-width:620px){.cal{gap:3px}.cal .d{min-height:52px;padding:4px}.cal .ev{display:none}.cal .dots{display:flex;gap:2px;margin-top:4px;flex-wrap:wrap}.cal .dots i{width:6px;height:6px;border-radius:50%}}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend button{border:0;background:none;color:inherit;cursor:pointer;padding:2px 4px;border-radius:6px;font:inherit}
.legend button.off{opacity:.4;text-decoration:line-through}
.chart svg{width:100%;height:auto;display:block}
/* επεξεργασία */
.item-ed{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--paper);margin-bottom:10px}
.item-ed .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.item-ed .flag{color:var(--bad);font-size:.82rem}
.item-ed .fixed{color:var(--warn);font-size:.82rem}
.avpick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.avpick button{font-size:1.8rem;padding:8px;border-radius:14px;border:2px solid transparent;background:var(--line2);cursor:pointer}
.avpick button.on{border-color:var(--ink)}
.notelog{display:flex;flex-direction:column;gap:10px}
.notelog .n{background:var(--raise);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font-size:.9rem;white-space:pre-wrap}
.notelog .n small{display:flex;justify-content:space-between;color:var(--ink3);margin-bottom:4px}
/* έγγραφα (πάντα ανοιχτά) */
.sheet,.report{--paper:#fff;--field:#fff;--raise:#FBF8F3;--ink:#2E2A33;--ink2:#6B6573;--ink3:#9C95A5;--line:#ECE5DA;--line2:#F3EEE6;--lilac:#E9E2F7;--lilac-d:#7462B4;--mint:#DFF1E6;--ok:#3A8A61;--bad:#C2524A;color:#2E2A33}
.sheet{background:#fff;width:100%;max-width:794px;margin:0 auto;padding:40px 46px;border:1px solid #ECE5DA;border-radius:6px}
.sheet .shd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #333;padding-bottom:10px;margin-bottom:16px}
.sheet h2{font-family:var(--head);font-size:1.45rem;margin:0}
.sheet .deco{font-size:1.8rem;letter-spacing:4px}
.sheet .meta{font-size:.85rem;margin-top:6px}
.sheet ol{padding-left:22px}
.sheet li{margin-bottom:16px;page-break-inside:avoid;break-inside:avoid}
.sheet .lines{border-bottom:1px dotted #999;height:26px}
.sheet .ans{color:#2a7a4f;font-weight:600}
.sheet .opts{display:flex;gap:18px;flex-wrap:wrap;margin-top:4px}
.sheet .foot{margin-top:24px;font-size:.72rem;color:#888;text-align:center}
.sheet .reading{background:#faf7f0;border-radius:8px;padding:12px 14px;margin-bottom:16px;white-space:pre-wrap}
.sched{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sched .s{border:2px solid #ddd;border-radius:14px;padding:12px;text-align:center}
.sched .s .e{font-size:2.4rem}
.sched .s b{display:block;margin-top:4px}
.report{background:#fff;max-width:820px;margin:0 auto;padding:36px 40px;border:1px solid #ECE5DA;border-radius:10px}
.report .rh{display:flex;align-items:center;gap:14px;border-bottom:1px solid #ECE5DA;padding-bottom:14px;margin-bottom:18px}
.report .rh svg{width:48px;height:48px}
.report .card{border-color:#ECE5DA}
.report .kpi{background:#fff}
@media(max-width:620px){.sheet{padding:22px 18px}.report{padding:22px 16px}}
@media print{
  body{background:#fff}
  .noprint,.side,.topbar,.bottomnav,.banner,.toasts,.drawer-ov{display:none!important}
  .app{display:block}.main{padding:0;max-width:none}
  .sheet,.report{border:0;padding:0;max-width:none}
  body.printing .app,body.printing #topBanner{display:none!important}
  body.printing .ov{position:static;background:none;padding:0;display:block}
  body.printing .dlg{box-shadow:none;max-height:none;overflow:visible;padding:0;max-width:none}

/* football */

.pitch .goal{position:absolute;top:50%;width:18px;height:76px;transform:translateY(-50%);border:3px solid #fff;background:repeating-linear-gradient(0deg,rgba(255,255,255,.5) 0 3px,transparent 3px 8px)}
.pitch .goal.l{left:-3px;border-left:0}.pitch .goal.r{right:-3px;border-right:0}

<body>
<script>'use strict';
/* ===== Παιδαγωγός AI — πυρήνας ===== */
const APP_VERSION='2.4.0';
const APP_NAME='LUMIO';
const BACKUP_SUB='LUMIO';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/-/g,'').slice(0,16);
const pad=n=>String(n).padStart(2,'0');
const isoDate=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO=()=>isoDate(new Date());
const MONTHS=['Ιανουάριος','Φεβρουάριος','Μάρτιος','Απρίλιος','Μάιος','Ιούνιος','Ιούλιος','Αύγουστος','Σεπτέμβριος','Οκτώβριος','Νοέμβριος','Δεκέμβριος'];
const MONTHS_G=['Ιανουαρίου','Φεβρουαρίου','Μαρτίου','Απριλίου','Μαΐου','Ιουνίου','Ιουλίου','Αυγούστου','Σεπτεμβρίου','Οκτωβρίου','Νοεμβρίου','Δεκεμβρίου'];
const DAYS=['Δευ','Τρί','Τετ','Πέμ','Παρ','Σάβ','Κυρ'];
const fmtDate=iso=>{if(!iso)return'';const d=new Date(iso.length<=10?iso+'T12:00':iso);return d.getDate()+' '+MONTHS_G[d.getMonth()]+' '+d.getFullYear();};
const fmtShort=iso=>{if(!iso)return'';const d=new Date(iso.length<=10?iso+'T12:00':iso);return pad(d.getDate())+'/'+pad(d.getMonth()+1);};
const fmtMin=sec=>{const m=Math.round((sec||0)/60);if(m<60)return m+' λεπτά';const h=Math.floor(m/60),r=m%60;return h+(h===1?' ώρα':' ώρες')+(r?' και '+r+' λεπτά':'');};
const fmtEur=n=>'€'+(Math.round((n||0)*100)/100).toLocaleString('el-GR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pctOf=(a,b)=>b?Math.round(a*100/b):0;
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const monthKey=iso=>iso.slice(0,7);
const weekStart=d=>{d=new Date(d);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);d.setHours(0,0,0,0);return d;};
const debounce=(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms);};};

/* ---- εικονίδιο ---- */
const LOGO=`<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="26" fill="#FBF0D9"/><g stroke="#E9C55A" stroke-width="3" stroke-linecap="round"><path d="M69 12v-5"/><path d="M84 19l4-4"/><path d="M91 34h5"/><path d="M54 19l-4-4"/><path d="M86 49l4 3"/></g><circle cx="69" cy="34" r="13" fill="#F6CF5E"/><path d="M14 100c0-17 9-27 22-27s22 10 22 27z" fill="#9C8BD0"/><circle cx="37" cy="58" r="11" fill="#2E2A33"/><path d="M41 50c4-1 8 1 9 4" stroke="#FBF0D9" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".55"/><path d="M47 52q11-8 16-12" stroke="#F6CF5E" stroke-width="1.6" stroke-dasharray="2 4" fill="none" opacity=".8"/></svg>`;

/* ---- ειδοποιήσεις / διάλογοι ---- */
function toast(msg,type=''){let t=$('.toasts');if(!t){t=document.createElement('div');t.className='toasts';document.body.appendChild(t);}const e=document.createElement('div');e.className='toast '+type;e.textContent=msg;t.appendChild(e);setTimeout(()=>e.remove(),type==='bad'?5200:3200);}
function modal(html,{wide=false,onClose}={}){const ov=document.createElement('div');ov.className='ov';ov.innerHTML=`<div class="dlg ${wide?'wide':''}" role="dialog">${html}</div>`;document.body.appendChild(ov);const close=()=>{ov.remove();onClose&&onClose();};ov.addEventListener('click',e=>{if(e.target===ov||e.target.closest('[data-close]'))close();});return{el:ov.firstElementChild,close};}
function confirmDlg(text,{ok='Ναι',danger=false}={}){return new Promise(res=>{const m=modal(`<p style="margin-top:0">${text}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-x="0">Άκυρο</button><button class="btn ${danger?'danger':'pri'}" data-x="1">${esc(ok)}</button></div>`,{onClose:()=>res(false)});m.el.addEventListener('click',e=>{const b=e.target.closest('[data-x]');if(b){res(b.dataset.x==='1');m.el.parentElement.remove();}});});}
function promptDlg(title,{type='text',placeholder='',value='',okText='Εντάξει'}={}){return new Promise(res=>{const m=modal(`<h3>${title}</h3><input class="in" type="${type}" placeholder="${esc(placeholder)}" value="${esc(value)}" autocomplete="off"><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-x="0">Άκυρο</button><button class="btn pri" data-x="1">${esc(okText)}</button></div>`,{onClose:()=>res(null)});const inp=$('input',m.el);setTimeout(()=>inp.focus(),50);const done=v=>{res(v);m.el.parentElement.remove();};inp.addEventListener('keydown',e=>{if(e.key==='Enter')done(inp.value);});m.el.addEventListener('click',e=>{const b=e.target.closest('[data-x]');if(b)done(b.dataset.x==='1'?inp.value:null);});});}

/* ---- κρυπτογράφηση ---- */
const TE=new TextEncoder(),TD=new TextDecoder();
const b64=u8=>{let s='';const c=0x8000;for(let i=0;i<u8.length;i+=c)s+=String.fromCharCode.apply(null,u8.subarray(i,i+c));return btoa(s);};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rand=n=>crypto.getRandomValues(new Uint8Array(n));
async function deriveKey(pass,salt){const base=await crypto.subtle.importKey('raw',TE.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:210000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function aesEnc(key,u8){const iv=rand(12);const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,u8));return{iv:b64(iv),ct:b64(ct)};}
async function aesDec(key,o){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},key,unb64(o.ct)));}
const importRaw=raw=>crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);
async function wrapRaw(raw,pass){const salt=rand(16);const k=await deriveKey(pass,salt);return{salt:b64(salt),...await aesEnc(k,raw)};}
async function unwrapRaw(w,pass){const k=await deriveKey(pass,unb64(w.salt));return aesDec(k,w);}
async function encJSON(key,obj){return aesEnc(key,TE.encode(JSON.stringify(obj)));}
async function decJSON(key,o){return JSON.parse(TD.decode(await aesDec(key,o)));}

/* ---- συμπίεση για συνδέσμους ---- */
async function packLink(obj){const data=TE.encode(JSON.stringify(obj));let out=data,z='j';if(window.CompressionStream){try{const cs=new CompressionStream('deflate-raw');const s=new Blob([data]).stream().pipeThrough(cs);out=new Uint8Array(await new Response(s).arrayBuffer());z='z';}catch(e){}}return z+b64(out).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
async function unpackLink(str){const z=str[0];let s=str.slice(1).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';let u8=unb64(s);if(z==='z'){const ds=new DecompressionStream('deflate-raw');u8=new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer());}return JSON.parse(TD.decode(u8));}

/* ---- αποθήκευση IndexedDB ---- */
const IDB={db:null,
  open(){if(this.db)return Promise.resolve(this.db);return new Promise((res,rej)=>{const r=indexedDB.open('paidagogos-ai',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res(this.db);};r.onerror=()=>rej(r.error);});},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('kv',mode);const st=t.objectStore('kv');const r=fn(st);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);});},
  ls:false,
  async init(){try{if(!window.indexedDB)throw 0;await this.open();await this.tx('readwrite',s=>s.put(1,'_probe'));const v=await this.tx('readonly',s=>s.get('_probe'));if(v!==1)throw 0;}catch(e){this.ls=true;}},
  _k:k=>'lumio:'+k,
  get(k){if(this.ls){try{const v=localStorage.getItem(this._k(k));return Promise.resolve(v==null?undefined:JSON.parse(v));}catch(e){return Promise.resolve(undefined);}}return this.tx('readonly',s=>s.get(k));},
  set(k,v){if(this.ls){try{localStorage.setItem(this._k(k),JSON.stringify(v));}catch(e){toast('Ο χώρος αποθήκευσης της συσκευής γέμισε.','bad');}return Promise.resolve();}return this.tx('readwrite',s=>s.put(v,k));},
  del(k){if(this.ls){try{localStorage.removeItem(this._k(k));}catch(e){}return Promise.resolve();}return this.tx('readwrite',s=>s.delete(k));},
  keys(){if(this.ls){const o=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('lumio:'))o.push(k.slice(6));}}catch(e){}return Promise.resolve(o);}return this.tx('readonly',s=>s.getAllKeys());}
};

/* ---- κατάσταση ---- */
const S={meta:null,user:null,raw:null,dataKey:null,data:null,earn:null,earnKey:null,studentMode:null,lastAct:Date.now(),fails:0,lockUntil:0};
function defaultData(){return{students:[],materials:[],uploads:[],results:[],assignments:[],programs:[],reports:[],inbox:[],profile:{title:'',email:'',phone:'',bio:''},settings:{aiKey:'',model:'auto',autoLockMin:0,sendNotes:false,sound:true,lastReportCheck:'',notify:{reports:true,assign:true,updates:true},v2:true}};}
function migrate(d){const def=defaultData();for(const k in def)if(d[k]===undefined)d[k]=def[k];if(!d.settings.v2){d.settings.autoLockMin=0;d.settings.v2=true;}d.settings={...def.settings,...d.settings};d.settings.notify={...def.settings.notify,...(d.settings.notify||{})};d.profile={...def.profile,...d.profile};return d;}
async function saveMeta(){await IDB.set('meta',S.meta);}
const _saveData=debounce(async()=>{if(!S.dataKey||!S.data)return;await IDB.set('vault',await encJSON(S.dataKey,S.data));Backup.auto();},400);
function save(){_saveData();}
async function saveNow(){if(!S.dataKey||!S.data)return;await IDB.set('vault',await encJSON(S.dataKey,S.data));}

/* ---- λογαριασμοί ---- */
function genRecovery(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const r=rand(16);let c='';for(let i=0;i<16;i++){c+=A[r[i]%A.length];if(i%4===3&&i<15)c+='-';}return c;}
const normCode=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/(.{4})(?=.)/g,'$1-');
async function createAdmin({name,username,pass,org,email,remember=true}){const raw=rand(32);const code=genRecovery();S.meta={schema:2,org:org||'',created:new Date().toISOString(),users:[{id:uid(),name,email:(email||'').trim().toLowerCase(),username:username.trim().toLowerCase(),role:'admin',wrap:await wrapRaw(raw,pass),recWrap:await wrapRaw(raw,code),earnWrap:null,created:new Date().toISOString()}]};await saveMeta();S.raw=raw;S.dataKey=await importRaw(raw);S.data=defaultData();S.user=S.meta.users[0];await saveNow();if(remember)await Session.save();return code;}
async function login(username,pass,remember=true){if(Date.now()<S.lockUntil)throw new Error('Πολλές αποτυχημένες προσπάθειες. Δοκίμασε ξανά σε λίγα δευτερόλεπτα.');const u=S.meta.users.find(x=>x.username===username.trim().toLowerCase());let raw;try{if(!u)throw 0;raw=await unwrapRaw(u.wrap,pass);}catch(e){S.fails++;if(S.fails>=5){S.lockUntil=Date.now()+30000;S.fails=0;}throw new Error('Λάθος όνομα χρήστη ή κωδικός.');}S.fails=0;await openVault(u,raw);if(remember)await Session.save();else await Session.clear();}
async function openVault(u,raw){S.raw=raw;S.dataKey=await importRaw(raw);const blob=await IDB.get('vault');S.data=migrate(blob?await decJSON(S.dataKey,blob):defaultData());S.user=u;S.lastAct=Date.now();}
async function resetWithRecovery(username,code,newPass){const q=username.trim().toLowerCase();const u=S.meta.users.find(x=>x.username===q||(x.email&&x.email===q));if(!u||!u.recWrap)throw new Error('Δεν βρέθηκε λογαριασμός με κωδικό ανάκτησης για αυτό το όνομα χρήστη.');let raw;try{raw=await unwrapRaw(u.recWrap,normCode(code));}catch(e){throw new Error('Ο κωδικός ανάκτησης δεν είναι σωστός.');}u.wrap=await wrapRaw(raw,newPass);await saveMeta();return u;}
async function newRecovery(userId){const u=S.meta.users.find(x=>x.id===userId);const code=genRecovery();u.recWrap=await wrapRaw(S.raw,code);await saveMeta();return code;}
const Session={
  async devKey(){if(IDB.ls){let r=await IDB.get('devkeyraw');if(!r){r=b64(rand(32));await IDB.set('devkeyraw',r);}return importRaw(unb64(r));}let k=await IDB.get('devkey');if(!k){k=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);await IDB.set('devkey',k);}return k;},
  async save(){try{const k=await this.devKey();await IDB.set('session',{userId:S.user.id,at:new Date().toISOString(),...await aesEnc(k,S.raw)});}catch(e){console.warn('session',e);}},
  async restore(){try{const s=await IDB.get('session');if(!s)return false;const u=S.meta.users.find(x=>x.id===s.userId);if(!u){await this.clear();return false;}const k=IDB.ls?await this.devKey():await IDB.get('devkey');if(!k)return false;const raw=await aesDec(k,s);await openVault(u,raw);return true;}catch(e){await this.clear();return false;}},
  async has(){try{return!!(await IDB.get('session'));}catch(e){return false;}},
  async clear(){try{await IDB.del('session');}catch(e){}}
};
function logout(msg){Session.clear();S.raw=null;S.dataKey=null;S.data=null;S.user=null;S.earn=null;S.earnKey=null;S.studentMode=null;location.hash='#/welcome';render();if(msg)toast(msg);}
async function addUser({name,username,pass,role,email}){username=username.trim().toLowerCase();if(S.meta.users.some(u=>u.username===username))throw new Error('Υπάρχει ήδη αυτό το όνομα χρήστη.');const code=genRecovery();const u={id:uid(),name,username,email:(email||'').trim().toLowerCase(),role,wrap:await wrapRaw(S.raw,pass),recWrap:await wrapRaw(S.raw,code),earnWrap:null,created:new Date().toISOString()};S.meta.users.push(u);await saveMeta();u._code=code;return u;}
async function setUserPass(userId,pass){const u=S.meta.users.find(x=>x.id===userId);u.wrap=await wrapRaw(S.raw,pass);await saveMeta();}
const isAdmin=()=>S.user&&S.user.role==='admin';
function myStudents(){if(!S.data)return[];return S.data.students.filter(s=>isAdmin()||s.ownerId===S.user.id).sort((a,b)=>(a.name||a.code).localeCompare(b.name||b.code,'el'));}
function getStudent(id){const s=S.data.students.find(x=>x.id===id);if(!s)return null;if(!isAdmin()&&s.ownerId!==S.user.id)return null;return s;}
function myMaterials(){return S.data.materials.filter(m=>isAdmin()||m.ownerId===S.user.id);}
const stuName=s=>s?(s.name||s.code):'—';
function genCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c;do{c='';const r=rand(6);for(const x of r)c+=A[x%A.length];}while(S.data&&S.data.students.some(s=>s.code===c));return c;}

/* ---- αυτόματο κλείδωμα ---- */
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>{S.lastAct=Date.now();},{passive:true}));
setInterval(()=>{if(!S.user||S.studentMode||document.querySelector('.gwrap'))return;const m=S.data?+S.data.settings.autoLockMin||0:0;if(m&&Date.now()-S.lastAct>m*60000)logout('Η εφαρμογή κλείδωσε λόγω αδράνειας.');if(S.earnKey&&Date.now()-S.lastAct>5*60000){Earn.lock();}},20000);

/* ---- απολαβές (χωριστό κλειδί) ---- */
const Earn={
  hasPin(){return!!S.user.earnWrap;},
  async setup(pin){const raw=rand(32);S.user.earnWrap=await wrapRaw(raw,pin);await saveMeta();S.earnKey=await importRaw(raw);S.earn={rates:{},sessions:[]};await this.save();},
  async unlock(pin){const raw=await unwrapRaw(S.user.earnWrap,pin);S.earnKey=await importRaw(raw);const blob=await IDB.get('earn:'+S.user.id);S.earn=blob?await decJSON(S.earnKey,blob):{rates:{},sessions:[]};},
  async save(){if(S.earnKey)await IDB.set('earn:'+S.user.id,await encJSON(S.earnKey,S.earn));Backup.auto();},
  lock(){S.earn=null;S.earnKey=null;},
  async changePin(oldPin,newPin){const raw=await unwrapRaw(S.user.earnWrap,oldPin);S.user.earnWrap=await wrapRaw(raw,newPin);await saveMeta();}
};

/* ---- κοινός φάκελος αντιγράφων ασφαλείας ---- */
const Backup={
  hdb(){return new Promise((res,rej)=>{const r=indexedDB.open('shared-backups',1);r.onupgradeneeded=()=>r.result.createObjectStore('handles');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});},
  async getRoot(){try{const db=await this.hdb();return await new Promise(res=>{const t=db.transaction('handles','readonly').objectStore('handles').get('root');t.onsuccess=()=>res(t.result||null);t.onerror=()=>res(null);});}catch(e){return null;}},
  async setRoot(h){const db=await this.hdb();await new Promise(res=>{const t=db.transaction('handles','readwrite');t.objectStore('handles').put(h,'root');t.oncomplete=res;});},
  async forgetRoot(){const db=await this.hdb();await new Promise(res=>{const t=db.transaction('handles','readwrite');t.objectStore('handles').delete('root');t.oncomplete=res;});},
  supported(){return'showDirectoryPicker'in window;},
  async pick(){const h=await window.showDirectoryPicker({id:'backups',mode:'readwrite',startIn:'downloads'});await this.setRoot(h);return h;},
  async perm(h,ask){const o={mode:'readwrite'};if(await h.queryPermission(o)==='granted')return true;if(ask)return(await h.requestPermission(o))==='granted';return false;},
  async snapshot(){const keys=await IDB.keys();const out={app:'LUMIO',version:APP_VERSION,created:new Date().toISOString(),encrypted:true,kv:{}};for(const k of keys){if(['session','devkey','devkeyraw','_probe'].includes(k))continue;out.kv[k]=await IDB.get(k);}return out;},
  fileName(){return BACKUP_SUB+'-'+todayISO()+'.json';},
  async write(ask=false){const snap=JSON.stringify(await this.snapshot());const root=await this.getRoot();if(root&&await this.perm(root,ask)){const dir=await root.getDirectoryHandle(BACKUP_SUB,{create:true});const fh=await dir.getFileHandle(this.fileName(),{create:true});const w=await fh.createWritable();await w.write(snap);await w.close();localStorage.setItem('pai-lastbackup',new Date().toISOString());return'folder';}if(ask){this.download(snap);return'download';}return null;},
  download(snap){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([snap],{type:'application/json'}));a.download=this.fileName();a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);localStorage.setItem('pai-lastbackup',new Date().toISOString());},
  auto:debounce(async function(){try{await Backup.write(false);}catch(e){}},5000),
  async list(){const root=await this.getRoot();if(!root||!await this.perm(root,true))return null;const dir=await root.getDirectoryHandle(BACKUP_SUB,{create:true});const files=[];for await(const [n,h] of dir.entries()){if(h.kind==='file'&&n.endsWith('.json'))files.push({name:n,h});}files.sort((a,b)=>b.name.localeCompare(a.name));return files.slice(0,10);},
  async restoreText(txt){const o=JSON.parse(txt);if(!['LUMIO','Paidagogos-AI'].includes(o.app)||!o.kv||!o.kv.meta)throw new Error('Το αρχείο δεν είναι αντίγραφο του LUMIO.');const keys=await IDB.keys();for(const k of keys)if(!['devkey','devkeyraw'].includes(k))await IDB.del(k);for(const k in o.kv)await IDB.set(k,o.kv[k]);}
};

/* ---- αναβάθμιση ---- */
const Update={
  newer(a,b){const x=a.split('.').map(Number),y=b.split('.').map(Number);for(let i=0;i<3;i++){if((x[i]||0)>(y[i]||0))return true;if((x[i]||0)<(y[i]||0))return false;}return false;},
  async check(manual){try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();if(this.newer(j.version,APP_VERSION)){this.apply(j);return j.version;}if(manual)toast('Έχεις την τελευταία έκδοση ('+APP_VERSION+').','ok');return null;}catch(e){if(manual)toast('Δεν ήταν δυνατός ο έλεγχος — χωρίς σύνδεση;','bad');return null;}},

function calcExpr(src){const s=String(src).replace(/×|x(?=\s*\d)/g,'*').replace(/÷|:/g,'/').replace(/−/g,'-').replace(/(\d),(\d)/g,'$1.$2');let i=0;const peek=()=>s[i],ws=()=>{while(s[i]===' ')i++;};

const numEq=(a,b)=>a!=null&&b!=null&&Math.abs(a-b)<1e-6*Math.max(1,Math.abs(b));
const norm=s=>String(s??'').trim().toLowerCase().replace(/\s+/g,' ');
const normLoose=s=>norm(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ς/g,'σ').replace(/[.,!;·]/g,'');

function verifyContent(c){const notes=[];let fixed=0,flagged=0;
  (c.items||[]).forEach((it,ix)=>{it._flag='';it._fix='';
    if(!it.q){it._flag='Λείπει η ερώτηση.';flagged++;return;}
    if(Array.isArray(it.options)){it.options=[...new Set(it.options.map(o=>String(o).trim()).filter(Boolean))];}
    if(it.calc){const v=calcExpr(it.calc);if(v==null){it._flag='Δεν υπολογίστηκε η έκφραση «'+it.calc+'».';flagged++;}else{const a=parseNum(it.answer);if(!numEq(a,v)){const opt=(it.options||[]).find(o=>numEq(parseNum(o),v));const vs=Number.isInteger(v)?String(v):String(Math.round(v*1000)/1000).replace('.',',');if(opt){it._fix=`Το κλειδί διορθώθηκε από «${it.answer}» σε «${opt}» (υπολογισμός ${it.calc} = ${vs}).`;it.answer=opt;fixed++;}else if(!it.options||!it.options.length){it._fix=`Το κλειδί διορθώθηκε από «${it.answer}» σε «${vs}» (υπολογισμός ${it.calc}).`;it.answer=vs;fixed++;}else{it._flag=`Ο υπολογισμός ${it.calc} δίνει ${vs}, που δεν υπάρχει στις επιλογές. Χρειάζεται έλεγχος.`;flagged++;}}}}
    if(it.options&&it.options.length){if(!it.options.some(o=>norm(o)===norm(it.answer))){const near=it.options.find(o=>normLoose(o)===normLoose(it.answer));if(near){it.answer=near;}else{it._flag=(it._flag?it._flag+' ':'')+'Η σωστή απάντηση δεν βρίσκεται στις επιλογές.';flagged++;}}if(it.options.length<2){it._flag=(it._flag?it._flag+' ':'')+'Λίγες επιλογές.';flagged++;}}
    if(!it.answer&&!it._flag){it._flag='Λείπει η σωστή απάντηση.';flagged++;}
  });
  (c.pairs||[]).forEach(p=>{p.a=String(p.a??'').trim();p.b=String(p.b??'').trim();});
  if(c.pairs)c.pairs=c.pairs.filter(p=>p.a&&p.b);
  if(fixed)notes.push(fixed+' κλειδιά απαντήσεων διορθώθηκαν αυτόματα με υπολογισμό.');
  if(flagged)notes.push(flagged+' σημεία θέλουν τον έλεγχό σου.');
  return{fixed,flagged,notes,checkedAt:new Date().toISOString()};}

  let gt=gameType;if(gt==='auto')gt=theme==='football'?'football':theme==='cars'?'racing':theme==='space'?'adventure':theme==='princess'?'adventure':theme==='blocks'?'simulation':['quiz','platform','puzzle','escape','cards'][rnd(0,4)];

  return{title,subject,gameType:gt,theme,intro:'',items,pairs,minutes:Math.max(5,Math.round(count*0.8)),warnings:[],concepts:[...new Set(items.map(i=>i.concept))],source:'local'};}

function resultsOf(sid){return S.data.results.filter(r=>r.studentId===sid).sort((a,b)=>a.date.localeCompare(b.date));}
function conceptStats(sid,sinceISO){const m={};for(const r of resultsOf(sid)){if(sinceISO&&r.date<sinceISO)continue;for(const a of r.answers||[]){const c=a.concept||'Γενικά';const o=m[c]||(m[c]={concept:c,total:0,wrong:0,sessions:new Set(),wrongSessions:new Set(),subject:r.subject,last:r.date,recent:[]});o.total++;o.sessions.add(r.id);if(!a.ok){o.wrong++;o.wrongSessions.add(r.id);}o.last=r.date;o.recent.push(a.ok?1:0);}}
  return Object.values(m).map(o=>({...o,acc:pctOf(o.total-o.wrong,o.total),recentAcc:pctOf(o.recent.slice(-8).reduce((x,y)=>x+y,0),Math.min(8,o.recent.length)),sessions:o.sessions.size,wrongSessions:o.wrongSessions.size}));}
function weakConcepts(sid,since){return conceptStats(sid,since).filter(c=>c.total>=3&&c.recentAcc<70).sort((a,b)=>a.recentAcc-b.recentAcc);}
function masteredConcepts(sid){return conceptStats(sid).filter(c=>c.total>=6&&c.recentAcc>=90);}
function recurringMistakes(st){return conceptStats(st.id).filter(c=>c.wrongSessions>=2&&c.wrong>=3&&c.recentAcc<70).map(c=>`${stuName(st)} εμφανίζει επαναλαμβανόμενη δυσκολία σε: «${c.concept}» (${c.wrong} λάθη σε ${c.wrongSessions} δραστηριότητες, πρόσφατη επιτυχία ${c.recentAcc}%).`);}
const LEVEL_FROM={'Αρχάριο':2,'Χαμηλό':2,'Μέτριο':3,'Καλό':4,'Πολύ καλό':4,'Προχωρημένο':5};
function levelOf(st,subject){st.levels=st.levels||{};if(st.levels[subject])return st.levels[subject];return LEVEL_FROM[st.knowledge]||3;}
function applyAdaptive(st,result){const subj=result.subject||'Γενικά';const cur=levelOf(st,subj);let nl=cur,why;if(result.pct>=90){nl=Math.min(5,cur+1);why='≥90% επιτυχία — αυξάνεται σταδιακά η δυσκολία.';}else if(result.pct>=60){why='60–89% — διατηρείται το ίδιο επίπεδο.';}else{nl=Math.max(1,cur-1);why='<60% — μειώνεται η δυσκολία και αυξάνεται η υποστήριξη.';}
  st.levels[subj]=nl;st.levelLog=st.levelLog||[];st.levelLog.push({date:result.date,subject:subj,from:cur,to:nl,pct:result.pct});st.support=st.support||{};st.support[subj]=result.pct<60;return{from:cur,to:nl,why};}
function needsSupport(st,subject){return!!(st&&st.support&&st.support[subject])||(st&&levelOf(st,subject)<=1);}
function learningIdentity(st,{forAI=false}={}){const subjects=Object.keys(st.levels||{});const lv=subjects.map(s=>`${s}: ${st.levels[s]}/5`).join(', ');const weak=weakConcepts(st.id).slice(0,6).map(c=>`${c.concept} (${c.recentAcc}% πρόσφατη επιτυχία)`);const mast=masteredConcepts(st.id).slice(0,6).map(c=>c.concept);const rs=resultsOf(st.id);
  const lines=[`Κωδικός μαθητή: ${st.code}`,st.age&&`Ηλικία: ${st.age}`,st.grade&&`Τάξη: ${st.grade}`,st.subjects&&`Μαθήματα: ${st.subjects}`,st.knowledge&&`Επίπεδο γνώσεων: ${st.knowledge}`,st.strengths&&`Δυνατά σημεία: ${st.strengths}`,st.difficulties&&`Δυσκολίες: ${st.difficulties}`,st.goals&&`Εκπαιδευτικοί στόχοι: ${st.goals}`,st.interests&&`Ενδιαφέροντα: ${st.interests}`,st.favorites&&`Αγαπημένα θέματα: ${st.favorites}`,st.style&&`Προτιμώμενος τρόπος μάθησης: ${st.style}`,st.prior&&`Προηγούμενες επιδόσεις: ${st.prior}`,lv&&`Τρέχοντα επίπεδα δυσκολίας ανά μάθημα (1-5): ${lv}`,weak.length&&`Αδυναμίες από τα δεδομένα: ${weak.join('; ')}`,mast.length&&`Κατακτημένες δεξιότητες: ${mast.join(', ')}`,rs.length&&`Δραστηριότητες μέχρι τώρα: ${rs.length}, μέση επίδοση ${Math.round(avg(rs.map(r=>r.pct)))}%`,(forAI?S.data.settings.sendNotes:true)&&st.notes&&`Σημειώσεις παιδαγωγού: ${st.notes}`];return lines.filter(Boolean).join('\n');}
function recordResult(res){const st=S.data.students.find(s=>s.id===res.studentId);S.data.results.push(res);let adapt=null;if(st)adapt=applyAdaptive(st,res);if(res.assignmentId){const a=S.data.assignments.find(x=>x.id===res.assignmentId);if(a){a.status='done';a.doneAt=res.date;}}for(const p of S.data.programs){for(const w of p.weeks||[])for(const s of w.sessions||[])if(s.materialId&&s.materialId===res.materialId&&p.studentId===res.studentId&&!s.done){s.done=true;s.resultId=res.id;}}save();return adapt;}

  parse(t){t=String(t).replace(/```json|```/g,'');const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<0)throw new Error('χωρίς JSON');return JSON.parse(t.slice(a,b+1));},

const AI_SYSTEM=`Είσαι το «LUMIO», δημιουργικός εκπαιδευτικός συνεργάτης για παιδαγωγούς, ειδικούς παιδαγωγούς και εκπαιδευτικούς στην Ελλάδα.
Κανόνες:
- Γράφεις σε σωστά, φυσικά ελληνικά με σωστό τονισμό.
- Το περιεχόμενο είναι κατάλληλο για την ηλικία, ακριβές και, όπου ταιριάζει, συμβατό με το ελληνικό αναλυτικό πρόγραμμα της αντίστοιχης τάξης.
- Κανένα ακατάλληλο, βίαιο, τρομακτικό ή επικίνδυνο περιεχόμενο· καμία επικίνδυνη οδηγία.
- Μην παρουσιάζεις ως βέβαιο κάτι που δεν είναι επαληθευμένο. Αν δεν είσαι σίγουρος για ένα στοιχείο, μην το χρησιμοποιήσεις και γράψε μια σημείωση στο πεδίο "warnings".
- Ποτέ ιατρική, ψυχολογική ή διαγνωστική αξιολόγηση. Μόνο εκπαιδευτικές παρατηρήσεις και προτάσεις.
- Χρησιμοποίησε μόνο πραγματικές, σωστές ελληνικές λέξεις. Πρόσεξε λέξεις που μοιάζουν αλλά σημαίνουν άλλο (π.χ. «σφυρίχτρα» ≠ «σφυρί», «μπάλα» ≠ «μπάλλα»).
- Κάθε ερώτηση πρέπει να έχει ΜΙΑ μόνο αναμφίβολα σωστή απάντηση· οι λάθος επιλογές να είναι σαφώς λάθος.
- Έλεγξε δύο φορές κάθε σωστή απάντηση. Στα μαθηματικά συμπλήρωσε το πεδίο "calc" με την αριθμητική έκφραση (μόνο αριθμοί, + - * / και παρενθέσεις) που δίνει τη σωστή απάντηση.
- Η "answer" να είναι γραμμένη ΑΚΡΙΒΩΣ όπως μία από τις "options".
- Μη χρησιμοποιείς ονόματα προστατευμένων χαρακτήρων ή εμπορικά σήματα· αν το παιδί αγαπά κάποιο προϊόν ή παιχνίδι, εμπνεύσου γενικά το ύφος του (π.χ. «κύβοι και κατασκευές») χωρίς ονόματα.
- Η αισθητική και η γλώσσα προσαρμόζονται στην ηλικία: για εφήβους ύφος ώριμο, όχι παιδικό.
- Απαντάς ΜΟΝΟ με ένα έγκυρο αντικείμενο JSON, χωρίς σχόλια ή άλλο κείμενο.`;

function localProgram(st,{weeks=4,perWeek=2,minutes=20,prompt=''}){const weak=weakConcepts(st.id).map(c=>c.concept);const topics=weak.length?weak:(st.difficulties||st.goals||prompt||'Βασικές δεξιότητες').split(/[,;\n]/).map(x=>x.trim()).filter(Boolean);const kinds=['game','worksheet','game','review','activity'];const out={title:`Πρόγραμμα ${weeks} εβδομάδων`,goals:topics.slice(0,4).map(t=>'Βελτίωση: '+t),weeks:[],notes:'Ενσωματωμένο πρότυπο προγράμματος (χωρίς τεχνητή νοημοσύνη).'};

const VERIFY_SYSTEM=`Είσαι αυστηρός ελεγκτής εκπαιδευτικού περιεχομένου για παιδιά στην Ελλάδα. Ελέγχεις κάθε ερώτηση σαν δάσκαλος πριν φτάσει στο παιδί.
Για κάθε στοιχείο έλεγξε:
1. Είναι η «answer» πραγματικά σωστή; (γεγονότα, γλώσσα, μαθηματικά)
2. Υπάρχει άλλη επιλογή που είναι επίσης σωστή ή πιο σωστή;
3. Είναι όλες οι λέξεις πραγματικές και σωστές ελληνικές λέξεις με το σωστό νόημα; (π.χ. ο διαιτητής χρησιμοποιεί «σφυρίχτρα», όχι «σφυρί»)
4. Είναι σωστή η εξήγηση;
5. Είναι η ερώτηση σαφής και κατάλληλη για την ηλικία;
Αν βρεις πρόβλημα, δώσε διορθωμένο στοιχείο ολόκληρο, με την «answer» γραμμένη ακριβώς όπως μία από τις «options». Αν δεν διορθώνεται με βεβαιότητα, βάλε fix: null.
Απαντάς ΜΟΝΟ με JSON.`;
async function aiVerifyContent(content,{age,subject,avoid}={}){const items=(content.items||[]).map(({_flag,_fix,_aiFix,_teacherFlag,...x},i)=>({i,...x}));const cards=(content.cards||[]).map((x,i)=>({i,front:x.front,back:x.back}));if(!items.length&&!cards.length)return{checked:0,fixed:0,removed:0,notes:[]};
  const o=await AI.json(VERIFY_SYSTEM,`Ηλικία: ${age||'—'}. Μάθημα: ${subject||'—'}.\nΕΡΩΤΗΣΕΙΣ:\n${JSON.stringify(items)}\n${cards.length?'ΚΑΡΤΕΣ (front/back):\n'+JSON.stringify(cards)+'\n':''}Μορφή: {"items":[{"i":0,"ok":true,"problem":"","fix":null}],"cards":[{"i":0,"ok":true,"problem":"","fix":null}]}\nΣτο fix για ερωτήσεις: {"q":"","options":[],"answer":"","explain":"","hint":""}. Για κάρτες: {"front":"","back":""}. Συμπερίλαβε ΜΟΝΟ όσα έχουν πρόβλημα.`,{temperature:0,avoid});
  let fixed=0,removed=0;const notes=[];const rm=new Set();
  for(const r of o.items||[]){const it=content.items[r.i];if(!it||r.ok)continue;const f=r.fix;
    if(f&&f.q&&f.answer&&(!f.options||!f.options.length||f.options.some(x=>norm(x)===norm(f.answer)))){it.q=f.q;if(f.options&&f.options.length)it.options=f.options;it.answer=f.answer;if(f.explain)it.explain=f.explain;if(f.hint)it.hint=f.hint;it._aiFix='Διορθώθηκε στον έλεγχο: '+(r.problem||'');fixed++;}
    else{rm.add(r.i);removed++;notes.push('Αφαιρέθηκε: «'+it.q.slice(0,60)+'» — '+(r.problem||'αμφίβολη απάντηση'));}}
  if(rm.size)content.items=content.items.filter((_,i)=>!rm.has(i));
  const rmc=new Set();for(const r of o.cards||[]){const k=content.cards[r.i];if(!k||r.ok)continue;if(r.fix&&r.fix.front&&r.fix.back){k.front=r.fix.front;k.back=r.fix.back;k._aiFix='Διορθώθηκε στον έλεγχο: '+(r.problem||'');fixed++;}else{rmc.add(r.i);removed++;}}
  if(rmc.size)content.cards=content.cards.filter((_,i)=>!rmc.has(i));
  return{checked:items.length+cards.length,fixed,removed,notes,model:o._model,at:new Date().toISOString()};}

const PRAISE={young:['Μπράβο! 🎉','Τέλεια! ⭐','Υπέροχα! 🌟','Σωστό! 👏','Φοβερό! 🚀'],mid:['Σωστό! 👏','Πολύ ωραία!','Εξαιρετικά!','Μπράβο!','Ακριβώς!'],teen:['Σωστό.','Ακριβώς.','Πολύ καλά.','Σωστά.','Ωραία.']};

const pick=a=>a[Math.floor(Math.random()*a.length)];
function isCorrect(it,given){if(norm(given)===norm(it.answer))return true;const a=parseNum(it.answer),g=parseNum(given);if(a!=null&&g!=null&&/^\s*-?[\d.,\/\s]+\s*$/.test(String(given))&&numEq(a,g))return true;return false;}
function confetti(emojis){const c=document.createElement('div');c.className='confetti';const set=emojis||['🎉','⭐','✨','🎊','🌟'];for(let i=0;i<36;i++){const e=document.createElement('i');e.textContent=pick(set);e.style.left=Math.random()*100+'%';e.style.animationDuration=(1.8+Math.random()*1.8)+'s';e.style.animationDelay=(Math.random()*.6)+'s';c.appendChild(e);}document.body.appendChild(c);setTimeout(()=>c.remove(),4200);}

function pairsOf(c){if(c.pairs&&c.pairs.length)return c.pairs;if(c.cards&&c.cards.length)return c.cards.map(x=>({a:x.front,b:x.back,concept:x.concept}));return(c.items||[]).map(it=>({a:it.q,b:it.answer,concept:it.concept}));}

function sessMin(s,e){if(!s||!e)return 0;const[a,b]=s.split(':').map(Number),[c,d]=e.split(':').map(Number);let m=(c*60+d)-(a*60+b);if(m<0)m+=1440;return m;}
const sessAmount=(rate,min)=>Math.round((+rate||0)*min/60*100)/100;
const BADGES=[['first','🌱','Πρώτο βήμα',h=>h.length>=1],['five','🔥','5 δραστηριότητες',h=>h.length>=5],['ten','🚀','10 δραστηριότητες',h=>h.length>=10],['perfect','💯','Τέλειο σκορ',h=>h.some(x=>x.pct===100)],['persist','💪','Δεν το βάζω κάτω',h=>h.some(x=>x.pct<60)],['improve','📈','Βελτίωση',h=>h.some((x,i)=>i>0&&x.pct-h[i-1].pct>=15)],['helper','💡','Ζήτησα βοήθεια και τα κατάφερα',h=>h.some(x=>x.hints>0&&x.pct>=60)],['streak','📅','3 μέρες στη σειρά',h=>{const d=[...new Set(h.map(x=>x.date.slice(0,10)))].sort();for(let i=2;i<d.length;i++){const a=new Date(d[i-2]),c=new Date(d[i]);if((c-a)/864e5===2)return true;}return false;}],['twenty','🌟','20 δραστηριότητες',h=>h.length>=20],['star90','🏅','3 φορές πάνω από 90%',h=>h.filter(x=>x.pct>=90).length>=3]];
function stuShellHTML({name,avatar,theme,band,hist,tasks,tab}){const pts=hist.reduce((a,x)=>a+(x.score||0),0)+hist.length*5;const lvl=Math.floor(pts/100)+1,into=pts%100;const look=themeBg(theme,band);const T=THEMES[theme]||THEMES.neutral;const txt=look.dark?'#fff':'#2E2A33';
  return`<div class="stu ${band}" style="background:${look.bg};color:${txt}"><div class="shead"><button class="bigav" id="sav">${avatar}</button><div class="lvl"><div style="font-weight:800;font-size:1.15rem">👋 Γεια σου! ${T.e}</div>${name?`<div class="small" style="font-weight:700">${esc(name)}</div>`:''}<div class="small">Επίπεδο ${lvl} · ${pts} πόντοι</div><div class="bar" style="margin-top:6px"><i style="width:${into}%"></i></div></div><div id="sx"></div></div>
  <div class="sbody"><div class="philo" style="margin-bottom:14px"><span>Μάθε</span>→<span>Εξασκήσου</span>→<span>Βελτιώσου</span>→<span>Γιόρτασε την πρόοδο</span></div>
  <div class="tabs" style="border:0">${[['tasks','🎯 Οι αποστολές μου'],['journey','🗺️ Η διαδρομή μου'],['badges','🏅 Τα μετάλλιά μου']].map(([k,l])=>`<button data-st="${k}" class="${tab===k?'on':''}" style="${tab===k?'':'background:rgba(255,255,255,.6);color:#2E2A33'}">${l}</button>`).join('')}</div>
  ${tab==='tasks'?`<div class="scard">${tasks.length?tasks.map(t=>`<div class="act" data-play="${t.id}" style="${t.done?'opacity:.7':''}"><span class="e">${(GAME_TYPES[t.gameType]||{}).e||'🎮'}</span><div style="flex:1"><b>${esc(t.title)}</b><div class="small">${t.done?'✓ Ολοκληρώθηκε'+(t.pct!=null?' · '+t.pct+'%':'')+' — παίξε ξανά!':'Νέα αποστολή!'}</div></div><span style="font-size:1.6rem">▶</span></div>`).join(''):'<div class="empty">Δεν υπάρχουν αποστολές αυτή τη στιγμή. 🌤️</div>'}</div>`:''}
  ${tab==='journey'?`<div class="scard"><h3 style="font-family:inherit">Η διαδρομή μου (${hist.length})</h3>${hist.length?`<div class="journey">${hist.map((x,i)=>`${i?'<span class="sep"></span>':''}<span class="j" title="${esc(x.title)} · ${fmtShort(x.date.slice(0,10))}">${(GAME_TYPES[x.gameType]||{}).e||'⭐'}<small>${x.pct>=90?'⭐⭐⭐':x.pct>=60?'⭐⭐':'⭐'}</small></span>`).join('')}<span class="sep"></span><span class="j" style="background:#2E2A33;color:#fff">${T.goal}</span></div>`:'<p>Η διαδρομή σου ξεκινά με την πρώτη αποστολή!</p>'}${hist.length>=2?`<p class="small" style="margin-top:14px">${hist[hist.length-1].pct>=hist[0].pct?'📈 Βελτιώνεσαι σε σχέση με την αρχή — συνέχισε!':'💪 Κάθε προσπάθεια μετράει!'}</p>`:''}</div>`:''}
  ${tab==='badges'?`<div class="scard"><div class="badges">${BADGES.map(([k,e,n,f])=>`<div class="badge ${f(hist)?'':'off'}"><div class="e">${e}</div>${n}</div>`).join('')}</div><p class="small" style="margin-top:12px">Τα μετάλλια δείχνουν τη δική σου πρόοδο — δεν είναι αγώνας με κανέναν.</p></div>`:''}</div></div>`;}

const StudentDevice={render(){const s=S.data.students.find(x=>x.id===S.studentMode.studentId);if(!s){S.studentMode=null;return render();}const band=ageBand(s.age);const hist=resultsOf(s.id);

function intentType(t){t=t.toLowerCase();if(/τι (πρέπει|να|θα) (να )?δουλέψ|πρότεινε|τι να κάνω/.test(t))return'suggest';if(/επανάληψη (των )?λαθ|λάθη του (τελευταί|μήνα)/.test(t))return'review';if(/πρόγραμμα \d|πρόγραμμα (για|εβδομ)|εκπαιδευτικό πρόγραμμα|πλάνο/.test(t))return'plan';if(/φύλλο|για εκτύπωση|εκτυπώσ/.test(t))return'worksheet';if(/κουίζ|quiz/.test(t))return'quiz';if(/κάρτες|καρτέλες/.test(t))return'flashcards';if(/ιστορία|παραμύθι/.test(t)&&!/κοινωνική/.test(t))return'story';if(/σελίδα (του )?βιβλίου|από αυτό|pdf|φωτογραφ/.test(t))return'material';if(/κοινωνική|οπτικό πρόγραμμα|δραστηριότητα|άσκηση (μνήμης|συγκέντρωσης|λογικής|κατανόησης)/.test(t)&&!/παιχνίδι/.test(t))return'activity';return'game';}
function routeIntent(text,sid){const k=intentType(text);if(k==='suggest'||k==='review'){if(!sid){const s=findStudentIn(text);if(s)sid=s.id;}if(!sid)return toast('Διάλεξε πρώτα μαθητή.','bad');return k==='suggest'?showSuggestions(sid,text):reviewMistakes(sid,text);}
  sessionStorage.setItem('pai-draft',JSON.stringify({prompt:text,studentId:sid||'',auto:true}));go('create/'+k);}
function findStudentIn(text){const t=normLoose(text);return myStudents().find(s=>(s.name&&t.includes(normLoose(s.name.split(' ')[0])))||t.includes(normLoose(s.code)));}

async function tweakMaterial(m,mode){const g=genOf(m);const hasKey=!!S.data.settings.aiKey;const st=m.studentId?getStudent(m.studentId):null;

      if(mode==='add'){const qs=new Set((c.items||[]).map(i=>i.q));nc={...c,items:(c.items||[]).concat(lg.items.filter(i=>!qs.has(i.q)))};if(c.cards&&c.cards.length)nc.cards=c.cards.concat(lg.pairs.map(p=>({front:p.a,back:p.b,concept:p.concept})));}
      else{nc={...c,items:lg.items,pairs:lg.pairs};if(c.cards&&c.cards.length)nc.cards=lg.pairs.map(p=>({front:p.a,back:p.b,concept:p.concept}));}}

    else if(mode==='add'){const isCards=!(c.items||[]).length&&(c.cards||[]).length;const ex=isCards?c.cards.map(x=>x.front):(c.items||[]).map(i=>i.q);const o=await AI.json(AI_SYSTEM,`${stuCtx(st,m.age,m.grade)}\n\nΥΛΙΚΟ: «${m.title}» (${m.subject||''}, δυσκολία ${m.level}/5, θέμα ${THEMES[m.theme].n}).\nΠρόσθεσε 5 ΝΕΕΣ ${isCards?'κάρτες':'ερωτήσεις'} με τον ίδιο στόχο, ύφος και δυσκολία, διαφορετικές από τις υπάρχουσες:\n${ex.map(x=>'- '+x).join('\n')}\nΜορφή JSON: ${isCards?'{"cards":[{"front":"","back":"","concept":""}]}':`{"items":[${ITEM_SCHEMA}]}`}`);nc={...c};if(isCards)nc.cards=c.cards.concat(o.cards||[]);else nc.items=(c.items||[]).concat((o.items||[]).filter(i=>i&&i.q));}
    else{const strip=x=>({intro:x.intro,instructions:x.instructions,text:x.text,steps:x.steps,cards:x.cards,pairs:x.pairs,items:(x.items||[]).map(({_flag,_fix,...i})=>i)});const o=await AI.json(AI_SYSTEM,`${stuCtx(st,m.age,m.grade)}\n\nΜετάτρεψε το παρακάτω εκπαιδευτικό υλικό ώστε να γίνει ${mode==='easier'?'ΠΙΟ ΕΥΚΟΛΟ':'ΠΙΟ ΔΥΣΚΟΛΟ'} (νέα δυσκολία ${lvl}/5). ${mode==='easier'?'Απλούστερη διατύπωση, μικρότεροι αριθμοί, πιο εμφανώς λάθος επιλογές, καλύτερες βοήθειες.':'Πιο απαιτητικές ερωτήσεις, μεγαλύτεροι αριθμοί, πιο κοντινές λάθος επιλογές, λιγότερη καθοδήγηση.'} Κράτα τον ίδιο εκπαιδευτικό στόχο, το ίδιο θέμα και τον ίδιο αριθμό στοιχείων. Επίστρεψε την ίδια δομή JSON (intro, instructions, text, steps, cards, pairs, items).\nΥΛΙΚΟ:\n${JSON.stringify(strip(c))}`);nc={intro:o.intro??c.intro,instructions:o.instructions??c.instructions,text:o.text??c.text,steps:o.steps||c.steps,cards:o.cards||c.cards,pairs:o.pairs||c.pairs,items:(o.items||c.items||[]).filter(i=>i&&i.q)};}

  L.sort(so==='old'?(a,b)=>a.created.localeCompare(b.created):so==='az'?(a,b)=>a.title.localeCompare(b.title,'el'):so==='diff'?(a,b)=>(a.level||3)-(b.level||3):(a,b)=>b.updated.localeCompare(a.updated));return L;}

  draw();$$('.toolbar input,.toolbar select').forEach(e=>e.oninput=draw);
  M().onclick=e=>{const p=e.target.closest('[data-play]');if(p){const m=S.data.materials.find(x=>x.id===p.dataset.play);if(!((m.content.items||[]).length||(m.content.pairs||[]).length||(m.content.cards||[]).length))return toast('Αυτή η δραστηριότητα δεν έχει ερωτήσεις για παιχνίδι — άνοιξέ την για προβολή.');playGame(m,{student:m.studentId&&getStudent(m.studentId),support:m.support,preview:true,band:m.ageBand});}const d=e.target.closest('[data-dup]');if(d)duplicateMat(S.data.materials.find(x=>x.id===d.dataset.dup),false);};}

function wsActions(m){const md=modal(`<div class="spread" style="margin-bottom:12px"><h3 style="margin:0">${esc(m.title)}</h3><button class="iconbtn" data-close>${ic('x',18)}</button></div><div class="list">${[['eye','view','Προβολή'],['edit','edit','Επεξεργασία'],['copy','dup','Αντίγραφο'],['download','pdf','Λήψη PDF'],['send','asg','Ανάθεση σε μαθητή'],['trash','del','Διαγραφή']].map(([i,k,t])=>`<button class="rw ${k==='del'?'danger':''}" data-a="${k}"><span class="ricon">${ic(i,18)}</span><span class="grow"><b>${t}</b></span></button>`).join('')}</div>`);
