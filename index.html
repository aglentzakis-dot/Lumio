/* ===== Υλικό (ανεβάσματα) ===== */
const fmtSize=b=>b>1048576?(b/1048576).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(b/1024))+' KB';
const upMeta=u=>[{image:'Εικόνα',pdf:'PDF',text:'Σημείωση'}[u.type],u.pages?u.pages+' σελ.':'',u.size?fmtSize(u.size):'',fmtDate(u.created)].filter(Boolean).join(' · ');
async function getUploadData(id){const b=await IDB.get('file:'+id);if(!b)throw new Error('Το αρχείο δεν βρέθηκε στη συσκευή.');return decJSON(S.dataKey,b);}
async function storeUpload(meta,data){S.data.uploads=S.data.uploads||[];await IDB.set('file:'+meta.id,await encJSON(S.dataKey,data));S.data.uploads.push(meta);save();}
function thumbOf(dataURL){return new Promise(res=>{const i=new Image();i.onload=()=>{const k=Math.min(1,320/Math.max(i.width,i.height));const c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7));};i.onerror=()=>res(null);i.src=dataURL;});}
async function processFile(f,studentId){const meta={id:uid(),name:f.name.replace(/\.[^.]+$/,'')||f.name,size:f.size,created:new Date().toISOString(),ownerId:S.user.id,studentId:studentId||null,rights:true};let data={};
  if(f.type.startsWith('image/')){meta.type='image';data.image=await imageToDataURL(f);meta.thumb=await thumbOf(data.image);}
  else if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){meta.type='pdf';const p=await pdfText(f);meta.pages=p.pages;data.text=p.text;if(p.text.length<80){data.image=await pdfPageImage(p.pdf,1);}try{data.image=data.image||await pdfPageImage(p.pdf,1);meta.thumb=await thumbOf(data.image);}catch(e){}}
  else{meta.type='text';data.text=await f.text();}
  meta.textLen=(data.text||'').length;await storeUpload(meta,data);return meta.id;}
function uploadDialog(done,files){const md=modal(`<div class="spread" style="margin-bottom:12px"><h3 style="margin:0">Ανέβασμα υλικού</h3><button class="iconbtn" data-close>${ic('x',18)}</button></div>
  <label class="drop" id="dz"><span class="ricon b">${ic('upload',24)}</span><b>Επίλεξε ή σύρε αρχεία εδώ</b><div class="small muted">Φωτογραφίες σελίδων, PDF, φύλλα εργασίας ή αρχεία κειμένου</div><input type="file" id="fi" multiple accept="image/*,.pdf,.txt,.md" class="hidden"></label><div id="fl" class="small" style="margin:12px 0"></div>
  <div class="field"><label class="f" for="ust">Μαθητής (προαιρετικό)</label><select class="in" id="ust">${opt('','—')}${myStudents().map(s=>opt(s.id,stuName(s))).join('')}</select></div>
  <label class="check field"><input type="checkbox" id="urt"> <span class="small">Έχω δικαίωμα να επεξεργαστώ αυτό το υλικό (δικό μου, ελεύθερης άδειας ή επιτρεπόμενη εκπαιδευτική χρήση). Θα χρησιμοποιηθεί μόνο για δραστηριότητες.</span></label>
  <div class="row" style="justify-content:flex-end"><button class="btn" data-close>Άκυρο</button><button class="btn pri" id="ugo" disabled>${ic('upload',16)} Ανέβασμα</button></div>`,{onClose:()=>done&&done(null)});
  let F=files?Array.from(files):[];const show=()=>{$('#fl',md.el).innerHTML=F.map(f=>`<div>${ic('file',14)} ${esc(f.name)} · ${fmtSize(f.size)}</div>`).join('');$('#ugo',md.el).disabled=!F.length||!$('#urt',md.el).checked;};show();
  $('#fi',md.el).onchange=e=>{F=Array.from(e.target.files);show();};$('#urt',md.el).onchange=show;
  const dz=$('#dz',md.el);dz.ondragover=e=>{e.preventDefault();dz.classList.add('over');};dz.ondragleave=()=>dz.classList.remove('over');dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');F=Array.from(e.dataTransfer.files);show();};
  $('#ugo',md.el).onclick=async()=>{const b=$('#ugo',md.el);b.disabled=true;b.innerHTML='<span class="spinner"></span> Επεξεργασία…';const ids=[];for(const f of F){try{ids.push(await processFile(f,$('#ust',md.el).value));}catch(err){toast(f.name+': '+err.message,'bad');}}const cb=done;done=null;md.close();if(ids.length)toast(`Ανέβηκαν ${ids.length} ${ids.length===1?'αρχείο':'αρχεία'}.`,'ok');cb&&cb(ids);};}
function noteDialog(done){const md=modal(`<div class="spread" style="margin-bottom:12px"><h3 style="margin:0">Νέα σημείωση</h3><button class="iconbtn" data-close>${ic('x',18)}</button></div><form id="nf"><div class="field"><label class="f" for="nt">Τίτλος</label><input class="in" id="nt" name="t" required></div><div class="field"><label class="f" for="nx">Κείμενο</label><textarea class="in" id="nx" name="x" required style="min-height:200px" placeholder="Επικόλλησε ή γράψε κείμενο, λεξιλόγιο, σημειώσεις μαθήματος…"></textarea></div><button class="btn pri">${ic('check',16)} Αποθήκευση</button></form>`);

  if(all.length){draw();$('#uq').oninput=draw;}
  const ak2=$('#addkey2');if(ak2)ak2.onclick=()=>aiKeyDialog(render);
  const up=files=>uploadDialog(ids=>{if(ids)render();},files);$('#nup').onclick=()=>up();$('#nnote').onclick=()=>noteDialog(render);
  const dz=$('#dz');dz.onclick=e=>{e.preventDefault();up();};dz.ondragover=e=>{e.preventDefault();dz.classList.add('over');};dz.ondragleave=()=>dz.classList.remove('over');dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');up(e.dataTransfer.files);};
  M().onclick=async e=>{const t=e.target.closest('[data-turn]');if(t)return go(`create/material?u=${t.dataset.u}&out=${t.dataset.turn}`);const v=e.target.closest('[data-view]');if(v){const u=all.find(x=>x.id===v.dataset.view);try{const d=await getUploadData(u.id);modal(`<div class="spread" style="margin-bottom:12px"><h3 style="margin:0">${esc(u.name)}</h3><button class="iconbtn" data-close>${ic('x',18)}</button></div>${d.image?`<img src="${d.image}" style="width:100%;border-radius:12px;margin-bottom:12px" alt="">`:''}${d.text?`<pre class="pre" style="max-height:50vh;overflow:auto;font-family:var(--font)">${esc(d.text.slice(0,20000))}</pre>`:''}`,{wide:true});}catch(err){toast(err.message,'bad');}}
    const rn=e.target.closest('[data-ren]');if(rn){const u=all.find(x=>x.id===rn.dataset.ren);const n=await promptDlg('Νέο όνομα',{value:u.name});if(n&&n.trim()){u.name=n.trim();save();render();}}
    const d=e.target.closest('[data-del]');if(d){const u=all.find(x=>x.id===d.dataset.del);if(await confirmDlg(`Διαγραφή «${esc(u.name)}»; Ό,τι έχει ήδη δημιουργηθεί από αυτό μένει.`,{danger:true,ok:'Διαγραφή'})){S.data.uploads=S.data.uploads.filter(x=>x.id!==u.id);await IDB.del('file:'+u.id);save();render();}}};}

async function assignChecked(m){if(!m.reviewed){if(!await confirmDlg('Δεν έχεις εγκρίνει ακόμη τις ερωτήσεις. Τις έλεγξες και είναι σωστές;',{ok:'Ναι, εγκρίνω και αναθέτω'}))return;m.reviewed=new Date().toISOString();save();}assignDialog(m);}
async function aiCheckNow(m){if(!S.data.settings.aiKey)return aiKeyDialog(()=>aiCheckNow(m));const bz=busy('Έλεγχος ορθότητας κάθε ερώτησης…');try{pushVersion(m,'Πριν τον έλεγχο ορθότητας');const r=await aiVerifyContent(m.content,{age:m.age,subject:m.subject,avoid:m.model});m.aiVerify=r;m.verify=verifyContent(m.content);if(r.fixed||r.removed)m.reviewed=null;m.updated=new Date().toISOString();save();bz.close();toast(r.fixed||r.removed?`Ο έλεγχος διόρθωσε ${r.fixed} και αφαίρεσε ${r.removed} στοιχεία. Η προηγούμενη έκδοση κρατήθηκε.`:'Δεν βρέθηκαν λάθη.','ok');render();}catch(e){bz.close();toast(e.message,'bad');}}

  $('#qdel',md.el).onclick=async()=>{pushVersion(m,'Πριν τη διαγραφή ερώτησης');m.content.items.splice(i,1);m.verify=verifyContent(m.content);save();md.close();render();};
  $('#qf',md.el).onsubmit=e=>{e.preventDefault();const opts=$$('[data-o]',md.el).map(x=>x.value.trim());const ok=$('input[name=ok]:checked',md.el);if(!ok||!opts[+ok.value])return toast('Διάλεξε τη σωστή απάντηση.','bad');pushVersion(m,'Διόρθωση ερώτησης');it.q=$('#q-q',md.el).value.trim();it.options=opts.filter(Boolean);it.answer=opts[+ok.value];it.explain=$('#q-e',md.el).value.trim();delete it._teacherFlag;delete it._aiFix;delete it.calc;m.verify=verifyContent(m.content);m.updated=new Date().toISOString();save();md.close();toast('Διορθώθηκε.','ok');render();};}

/* ===== Πρόοδος & αναφορές, ημερολόγιο, προγράμματα ===== */
const D864=864e5;
function weeksBack(n){const w=[];for(let i=n-1;i>=0;i--)w.push(new Date(weekStart(new Date())-i*7*D864));return w;}
function weeklySeries(rs,subs,weeks){return subs.map(sub=>({name:sub,values:weeks.map((ws,i)=>{const we=i<weeks.length-1?weeks[i+1]:new Date(Date.now()+D864);const v=rs.filter(x=>(x.subject||'Γενικά')===sub&&new Date(x.date)>=ws&&new Date(x.date)<we).map(x=>x.pct);return v.length?avg(v):null;})}));}
function compareSets(rs,cmp){let A,B,la,lb;if(cmp==='week'){const w0=weekStart(new Date()).toISOString(),w1=new Date(weekStart(new Date())-7*D864).toISOString();A=rs.filter(x=>x.date>=w1&&x.date<w0);B=rs.filter(x=>x.date>=w0);la='Προηγούμενη εβδομάδα';lb='Αυτή η εβδομάδα';}
  else if(cmp==='start'){const by={};rs.forEach(x=>{(by[x.subject||'Γενικά']=by[x.subject||'Γενικά']||[]).push(x);});A=[];B=[];for(const k in by){A.push(...by[k].slice(0,3));B.push(...by[k].slice(-3));}la='Αρχική επίδοση';lb='Τρέχουσα επίδοση';}
  else{const m0=todayISO().slice(0,7);const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);const m1=isoDate(d).slice(0,7);A=rs.filter(x=>x.date.startsWith(m1));B=rs.filter(x=>x.date.startsWith(m0));la=MONTHS[+m1.slice(5)-1];lb=MONTHS[+m0.slice(5)-1];}return{A,B,la,lb};}
function progressStudentHTML(s,cmp,base){const rs=resultsOf(s.id);if(!rs.length)return emptyHTML('chart','Δεν υπάρχουν ακόμη αποτελέσματα','Η πρόοδος θα εμφανιστεί μόλις ο μαθητής ολοκληρώσει δραστηριότητες.');
  const{A,B,la,lb}=compareSets(rs,cmp);const sa=subjAvg(A),sb=subjAvg(B);const cats=[...new Set([...Object.keys(sa),...Object.keys(sb)])];const weeks=weeksBack(12);const subs=[...new Set(rs.map(x=>x.subject||'Γενικά'))].slice(0,5);const t30=rs.filter(x=>x.date>=new Date(Date.now()-30*D864).toISOString());
  return`<div class="kpis section"><div class="kpi"><div class="k">Δραστηριότητες</div><div class="v">${rs.length}</div></div><div class="kpi"><div class="k">Χρόνος εκπαίδευσης</div><div class="v sm">${fmtMin(rs.reduce((a,x)=>a+x.durationSec,0))}</div></div><div class="kpi"><div class="k">Μέση επίδοση 30 ημ.</div><div class="v">${t30.length?Math.round(avg(t30.map(x=>x.pct)))+'%':'—'}</div></div><div class="kpi"><div class="k">Κατακτημένες δεξιότητες</div><div class="v">${masteredConcepts(s.id).length}</div></div></div>
  <div class="card section"><div class="card-h"><h3>Σύγκριση ανά μάθημα</h3><div class="seg">${[['week','Εβδομάδα'],['month','Μήνας'],['start','Αρχή – τώρα']].map(([k,l])=>`<a href="#/${base}&c=${k}" class="${cmp===k?'on':''}">${l}</a>`).join('')}</div></div>
   ${barsChart(cats,[{name:la+` (${A.length})`,values:cats.map(c=>sa[c]??null),color:'#C9BEEA'},{name:lb+` (${B.length})`,values:cats.map(c=>sb[c]??null),color:'#7462B4'}])}
   <div class="chips" style="margin-top:10px">${cats.map(c=>sa[c]!=null&&sb[c]!=null?`<span class="chip ${sb[c]>=sa[c]?'ok':'bad'}">${esc(c)} ${sb[c]>=sa[c]?'+':''}${Math.round(sb[c]-sa[c])}%</span>`:'').join('')}</div></div>
  <div class="grid g2"><div class="card"><div class="card-h"><h3>Εξέλιξη ανά εβδομάδα</h3><span class="tiny muted">12 εβδομάδες</span></div>${lineChart(weeks.map(w=>fmtShort(isoDate(w))),weeklySeries(rs,subs,weeks))}</div>
   <div class="card"><div class="card-h"><h3>Αλλαγές επιπέδου</h3></div>${(s.levelLog||[]).length?`<div class="list">${s.levelLog.slice(-7).reverse().map(l=>`<div class="rw static" style="min-height:44px;padding:8px 12px"><span class="grow"><b style="font-size:.86rem">${esc(l.subject)}</b><small>${fmtShort(l.date.slice(0,10))} · ${l.pct}%</small></span><span class="chip ${l.to>l.from?'ok':l.to<l.from?'bad':''}">${l.from} → ${l.to}</span></div>`).join('')}</div>`:'<p class="muted small">—</p>'}<p class="tiny muted" style="margin:10px 0 0">≥90% ανεβαίνει · 60–89% μένει · <60% κατεβαίνει με υποστήριξη.</p></div></div>`;}
function skillsHTML(s){const cs=conceptStats(s.id).filter(c=>c.total>=3);if(!cs.length)return emptyHTML('target','Δεν υπάρχουν αρκετά δεδομένα','Οι δεξιότητες εμφανίζονται μετά από τουλάχιστον 3 απαντήσεις στην ίδια έννοια.');
  const evo=cs.map(c=>{const h=Math.ceil(c.recent.length/2);const f=c.recent.slice(0,h),l=c.recent.slice(h);return{c:c.concept,a:pctOf(f.reduce((x,y)=>x+y,0),f.length),b:pctOf(l.reduce((x,y)=>x+y,0),l.length||1)};}).slice(0,8);const mast=masteredConcepts(s.id),weak=weakConcepts(s.id);
  return`<div class="card section"><div class="card-h"><h3>Εξέλιξη κάθε δεξιότητας</h3></div>${barsChart(evo.map(e=>e.c),[{name:'Πρώτες προσπάθειες',values:evo.map(e=>e.a),color:'#F2C2D1'},{name:'Πιο πρόσφατες',values:evo.map(e=>e.b),color:'#C0627F'}])}</div>
  <div class="grid g2"><div class="card"><div class="card-h"><h3>Ακρίβεια ανά δεξιότητα</h3></div>${conceptBars(s.id)}</div><div class="card"><div class="card-h"><h3>Σύνοψη</h3></div><div class="small muted" style="margin-bottom:6px">Κατακτημένες (≥90%)</div><div class="chips" style="margin-bottom:14px">${mast.map(c=>`<span class="chip ok">${esc(c.concept)}</span>`).join('')||'<span class="small muted">Καμία ακόμη</span>'}</div><div class="small muted" style="margin-bottom:6px">Χρειάζονται εξάσκηση (<70%)</div><div class="chips">${weak.map(c=>`<span class="chip bad">${esc(c.concept)} · ${c.recentAcc}%</span>`).join('')||'<span class="small muted">Καμία</span>'}</div><button class="btn yel block" data-sug="${s.id}" style="margin-top:16px">${ic('bulb',16)} Τι να δουλέψω την επόμενη εβδομάδα;</button></div></div>`;}
function subjectsHTML(s){const rs=resultsOf(s.id);if(!rs.length)return emptyHTML('book','Δεν υπάρχουν ακόμη αποτελέσματα','');const subs=[...new Set(rs.map(x=>x.subject||'Γενικά'))];const weeks=weeksBack(12);const now=Date.now();
  return`<div class="card section"><div class="card-h"><h3>Επίδοση ανά μάθημα</h3><span class="tiny muted">εβδομαδιαίος μέσος όρος</span></div>${lineChart(weeks.map(w=>fmtShort(isoDate(w))),weeklySeries(rs,subs.slice(0,5),weeks))}</div>
  <div class="card pad0"><div class="tablewrap"><table class="t"><tr><th style="padding-left:16px">Μάθημα</th><th class="n">Δραστηριότητες</th><th class="n">Μέσος όρος</th><th class="n">30 ημέρες</th><th class="n">Επίπεδο</th></tr>${subs.map(sub=>{const L=rs.filter(x=>(x.subject||'Γενικά')===sub);const L30=L.filter(x=>now-new Date(x.date)<30*D864);return`<tr><td style="padding-left:16px"><b>${esc(sub)}</b></td><td class="n">${L.length}</td><td class="n">${Math.round(avg(L.map(x=>x.pct)))}%</td><td class="n">${L30.length?Math.round(avg(L30.map(x=>x.pct)))+'%':'—'}</td><td class="n">${levelOf(s,sub)}/5</td></tr>`;}).join('')}</table></div></div>`;}
function mistakesHTML(s){const rs=resultsOf(s.id);const rec=recurringMistakes(s);const cs=conceptStats(s.id).filter(c=>c.wrong>0).sort((a,b)=>b.wrong-a.wrong).slice(0,8);const since=new Date(Date.now()-31*D864).toISOString();const wr=[];for(const r of rs.filter(r=>r.date>=since).reverse())for(const a of r.answers||[])if(!a.ok)wr.push({...a,date:r.date,title:r.title});
  if(!cs.length)return emptyHTML('check','Δεν έχουν καταγραφεί λάθη','Τα λάθη καταγράφονται αυτόματα σε κάθε παιχνίδι.');
  return`<div class="row section" style="justify-content:space-between"><p class="small muted" style="margin:0;max-width:60ch">Εκπαιδευτική ανάλυση βάσει των απαντήσεων — όχι διάγνωση.</p><button class="btn pri" data-review="${s.id}">${ic('repeat',16)} Επανάληψη λαθών του μήνα</button></div>
  ${rec.length?`<div class="stack section">${rec.map(x=>`<div class="warnbox">${esc(x)}</div>`).join('')}</div>`:''}
  <div class="grid g2 section"><div class="card"><div class="card-h"><h3>Λάθη ανά έννοια</h3></div>${barsChart(cs.map(c=>c.concept),[{name:'Λάθη',values:cs.map(c=>c.wrong),color:'#C0627F'}],{max:Math.max(4,...cs.map(c=>c.wrong))*1.2,suf:''})}</div><div class="card"><div class="card-h"><h3>Πρόσφατη επιτυχία ανά έννοια</h3></div>${conceptBars(s.id)}</div></div>
  <div class="card pad0"><div class="card-h" style="padding:16px 16px 0"><h3>Λάθη τελευταίου μήνα (${wr.length})</h3></div>${wr.length?`<div class="tablewrap"><table class="t"><tr><th style="padding-left:16px">Ημ/νία</th><th>Ερώτηση</th><th>Απάντηση</th><th>Σωστό</th><th>Έννοια</th></tr>${wr.slice(0,40).map(a=>`<tr><td style="padding-left:16px;white-space:nowrap">${fmtShort(a.date.slice(0,10))}</td><td>${esc(a.q)}</td><td style="color:var(--bad)">${esc(a.given||'—')}</td><td style="color:var(--ok)">${esc(a.answer)}</td><td>${esc(a.concept)}</td></tr>`).join('')}</table></div>`:'<p class="muted small" style="padding:0 16px 16px">Κανένα λάθος τον τελευταίο μήνα.</p>'}</div>`;}
function allRows(){return myStudents().map(x=>{const rs=resultsOf(x.id);const now=Date.now();const r30=rs.filter(q=>now-new Date(q.date)<30*D864);const p30=rs.filter(q=>now-new Date(q.date)>=30*D864&&now-new Date(q.date)<60*D864);const a=r30.length?Math.round(avg(r30.map(q=>q.pct))):null,b=p30.length?Math.round(avg(p30.map(q=>q.pct))):null;return{x,n:r30.length,t:r30.reduce((s2,q)=>s2+q.durationSec,0),a,d:a!=null&&b!=null?a-b:null,w:weakConcepts(x.id).slice(0,2)};});}
function overviewAllHTML(){const rows=allRows();if(!rows.length)return emptyHTML('users','Δεν υπάρχουν μαθητές','');const withA=rows.filter(r=>r.a!=null);
  return`<div class="card section"><div class="card-h"><h3>Μέση επίδοση 30 ημερών ανά μαθητή</h3></div>${barsChart(withA.map(r=>stuName(r.x)),[{name:'Επίδοση',values:withA.map(r=>r.a),color:'#7462B4'}])}</div>
  <div class="card pad0"><div class="tablewrap"><table class="t"><tr><th style="padding-left:16px">Μαθητής</th><th class="n">Δραστηριότητες</th><th class="n">Χρόνος</th><th class="n">Επίδοση</th><th class="n">Μεταβολή</th><th>Χρειάζεται εξάσκηση</th></tr>${rows.map(o=>`<tr class="click" data-s="${o.x.id}"><td style="padding-left:16px">${o.x.avatar||''} ${esc(stuName(o.x))}</td><td class="n">${o.n}</td><td class="n">${fmtMin(o.t)}</td><td class="n"><b>${o.a!=null?o.a+'%':'—'}</b></td><td class="n" style="color:${o.d>0?'var(--ok)':o.d<0?'var(--bad)':'inherit'}">${o.d!=null?(o.d>0?'+':'')+o.d+'%':'—'}</td><td>${o.w.map(c=>`<span class="chip bad">${esc(c.concept)}</span>`).join(' ')}</td></tr>`).join('')}</table></div></div>`;}
function allSkillsHTML(){const m={};for(const s of myStudents())for(const c of weakConcepts(s.id)){const o=m[c.concept]=m[c.concept]||{c:c.concept,n:0,acc:[]};o.n++;o.acc.push(c.recentAcc);}const L=Object.values(m).sort((a,b)=>b.n-a.n);
  return L.length?`<div class="card pad0"><div class="card-h" style="padding:16px 16px 0"><h3>Δεξιότητες που χρειάζονται εξάσκηση</h3></div><div class="tablewrap"><table class="t"><tr><th style="padding-left:16px">Δεξιότητα</th><th class="n">Μαθητές</th><th class="n">Μέση πρόσφατη επιτυχία</th></tr>${L.map(o=>`<tr><td style="padding-left:16px">${esc(o.c)}</td><td class="n">${o.n}</td><td class="n">${Math.round(avg(o.acc))}%</td></tr>`).join('')}</table></div></div><p class="small muted">Διάλεξε μαθητή για αναλυτική εικόνα δεξιοτήτων.</p>`:emptyHTML('target','Καμία δεξιότητα κάτω από 70%','Διάλεξε μαθητή για αναλυτική εικόνα.');}
function allSubjectsHTML(){const ids=new Set(myStudents().map(s=>s.id));const rs=S.data.results.filter(r=>ids.has(r.studentId));if(!rs.length)return emptyHTML('book','Δεν υπάρχουν αποτελέσματα','');const{A,B,la,lb}=compareSets(rs,'month');const sa=subjAvg(A),sb=subjAvg(B);const cats=[...new Set([...Object.keys(sa),...Object.keys(sb)])];const weeks=weeksBack(12);
  return`<div class="card section"><div class="card-h"><h3>Όλοι οι μαθητές — ανά μάθημα</h3></div>${barsChart(cats,[{name:la,values:cats.map(c=>sa[c]??null),color:'#C9BEEA'},{name:lb,values:cats.map(c=>sb[c]??null),color:'#7462B4'}])}</div><div class="card"><div class="card-h"><h3>Εβδομαδιαία εξέλιξη</h3></div>${lineChart(weeks.map(w=>fmtShort(isoDate(w))),weeklySeries(rs,[...new Set(rs.map(x=>x.subject||'Γενικά'))].slice(0,5),weeks))}</div>`;}
function allMistakesHTML(){const rows=myStudents().map(s=>({s,c:conceptStats(s.id).filter(c=>c.wrong>0).sort((a,b)=>b.wrong-a.wrong).slice(0,3),rec:recurringMistakes(s).length})).filter(r=>r.c.length);
  return rows.length?`<div class="card pad0"><div class="tablewrap"><table class="t"><tr><th style="padding-left:16px">Μαθητής</th><th>Συχνότερα λάθη</th><th class="n">Επαναλαμβανόμενες δυσκολίες</th></tr>${rows.map(r=>`<tr class="click" data-s="${r.s.id}"><td style="padding-left:16px">${r.s.avatar||''} ${esc(stuName(r.s))}</td><td>${r.c.map(c=>`<span class="chip bad">${esc(c.concept)} · ${c.wrong}</span>`).join(' ')}</td><td class="n">${r.rec}</td></tr>`).join('')}</table></div></div>`:emptyHTML('check','Δεν έχουν καταγραφεί λάθη','');}
const REP_TABS=[['student','Πρόοδος μαθητή'],['skills','Δεξιότητες'],['subjects','Μαθήματα'],['mistakes','Ανάλυση λαθών'],['monthly','Μηνιαίες αναφορές']];
function viewReports(r){const tab=REP_TABS.some(t=>t[0]===r.q.tab)?r.q.tab:'student';const sid=r.q.s||'';const s=sid&&getStudent(sid);const st=myStudents();const base=`reports?tab=${tab}${sid?'&s='+sid:''}`;

  <nav class="tabs">${REP_TABS.map(([k,l])=>`<a href="#/reports?tab=${k}${sid?'&s='+sid:''}" class="${k===tab?'on':''}">${l}</a>`).join('')}</nav><div id="rb"></div>`;
  const rb=$('#rb');

  if(tab==='skills')rb.innerHTML=s?skillsHTML(s):allSkillsHTML();
  if(tab==='subjects')rb.innerHTML=s?subjectsHTML(s):allSubjectsHTML();
  if(tab==='mistakes')rb.innerHTML=s?mistakesHTML(s):allMistakesHTML();
  if(tab==='monthly'){const ids=new Set(st.map(x=>x.id));const reps=S.data.reports.filter(x=>ids.has(x.studentId)&&(!sid||x.studentId===sid)).sort((a,b)=>b.month.localeCompare(a.month)||b.created.localeCompare(a.created));const months=lastMonths(12);
    rb.innerHTML=`<div class="card section"><div class="card-h"><h3>Νέα αναφορά</h3></div><form id="f" class="row"><select class="in" name="s" style="width:auto" required aria-label="Μαθητής">${opt('','— μαθητής —')}${st.map(x=>opt(x.id,stuName(x),sid)).join('')}</select><select class="in" name="m" style="width:auto" aria-label="Μήνας">${months.map(m=>opt(m,MONTHS[+m.slice(5)-1]+' '+m.slice(0,4),months[1])).join('')}</select><button class="btn pri">${ic('file',16)} Δημιουργία</button></form><p class="tiny muted" style="margin:10px 0 0">Οι αναφορές δημιουργούνται και αυτόματα στην αρχή κάθε μήνα. Από τη σελίδα της αναφοράς κατεβάζεις PDF για τον γονέα.</p></div>
    ${reps.length?`<div class="list">${reps.map(x=>{const ss=getStudent(x.studentId);return`<a class="rw" href="#/report/${x.id}"><span class="ricon b">${ic('file',18)}</span><span class="grow"><b>${esc(stuName(ss))} — ${MONTHS[+x.month.slice(5)-1]} ${x.month.slice(0,4)}</b><small>${x.data.count} δραστηριότητες · ${fmtMin(x.data.seconds)} · μέση επίδοση ${x.data.avg??'—'}%</small></span>${ic('right',18)}</a>`;}).join('')}</div>`:emptyHTML('file','Δεν υπάρχουν ακόμη αναφορές','')}`;
    $('#f').onsubmit=e=>{e.preventDefault();const o=fd(e.target);const rep=makeReport(getStudent(o.s),o.m);go('report/'+rep.id);};}
  $('#ps').onchange=e=>go(`reports?tab=${tab}${e.target.value?'&s='+e.target.value:''}`);

const EV_TYPES=[['res','Δραστηριότητες','var(--mint)'],['mat','Νέο υλικό','var(--peach)'],['plan','Προγραμματισμένα','var(--yellow)'],['sess','Συνεδρίες','var(--blue)']];
function calFilters(){try{return JSON.parse(localStorage.getItem('lumio-calf')||'null')||{res:1,mat:1,plan:1,sess:1};}catch(e){return{res:1,mat:1,plan:1,sess:1};}}
function calEvents(sid){const ids=new Set(sid?[sid]:myStudents().map(s=>s.id));const ev={};const add=(d,e)=>{(ev[d]=ev[d]||[]).push(e);};
  for(const x of S.data.results)if(ids.has(x.studentId))add(isoDate(new Date(x.date)),{t:'res',x,label:`${x.pct}% ${x.title}`});
  for(const m of myMaterials())if(sid?m.studentId===sid:true)add(isoDate(new Date(m.created)),{t:'mat',x:m,label:m.title});
  for(const p of S.data.programs)if(ids.has(p.studentId))for(const w of p.weeks)for(const s of w.sessions)if(!s.done)add(s.date,{t:'plan',x:s,p,label:s.title});
  if(S.earn)for(const s of S.earn.sessions)if(!sid||s.studentId===sid)add(s.date,{t:'sess',x:s,label:`${s.start} ${stuName(S.data.students.find(y=>y.id===s.studentId))}`});
  return ev;}
function dayDetailHTML(day,list){const F=calFilters();list=list.filter(e=>F[e.t]);return`<div class="card-h"><h3>${fmtDate(day)}</h3></div>${list.length?`<div class="list">${list.map(v=>{if(v.t==='res'){const s=S.data.students.find(x=>x.id===v.x.studentId);return`<button class="rw" data-res="${v.x.id}"><span class="ricon ${v.x.pct>=60?'g':'r'}">${ic('game',17)}</span><span class="grow"><b>${esc(v.x.title)}</b><small>${esc(stuName(s))} · ${fmtMin(v.x.durationSec)} · ${v.x.correct}/${v.x.total}</small></span><span class="pct">${v.x.pct}%</span></button>`;}

 async organization(el){if(!isAdmin())return;const us=S.meta.users;el.innerHTML=card(`Λογαριασμοί (${us.length})`,`<div class="list">${us.map(u=>`<div class="rw static"><span class="ricon">${ic(u.role==='admin'?'shield':'user',17)}</span><span class="grow"><b>${esc(u.name)}</b><small>${esc(u.username)}${u.email?' · '+esc(u.email):''} · ${u.role==='admin'?'Διαχειριστής':'Παιδαγωγός'} · ${S.data.students.filter(s=>s.ownerId===u.id).length} μαθητές</small></span>${u.id!==S.user.id?`<span class="end"><button class="iconbtn" data-pw="${u.id}" title="Νέος κωδικός" aria-label="Νέος κωδικός">${ic('key',16)}</button><button class="btn sm" data-role="${u.id}">${u.role==='admin'?'Ως παιδαγωγός':'Ως διαχειριστής'}</button><button class="iconbtn" data-del="${u.id}" aria-label="Διαγραφή">${ic('trash',16)}</button></span>`:'<span class="chip">εσύ</span>'}</div>`).join('')}</div>`)

  $('#nf',el).onsubmit=async e=>{e.preventDefault();try{const u=await addUser(fd(e.target));const st=await mailRecovery(u,u._code);const m=modal(`<h3>Ο λογαριασμός δημιουργήθηκε</h3><p class="small muted">Ο κωδικός ανάκτησης του/της ${esc(u.name)}:</p>${recoveryHTML(u._code)}${recoverySendBlock(u,u._code,st)}<div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn pri" data-close>Εντάξει</button></div>`,{onClose:()=>render()});bindRecoveryCopy(u._code,m.el);delete u._code;}catch(err){toast(err.message,'bad');}};
  el.onclick=async e=>{const pw=e.target.closest('[data-pw]');if(pw){const p=await promptDlg('Νέος κωδικός (τουλάχιστον 8)',{type:'password'});if(p&&p.length>=8){await setUserPass(pw.dataset.pw,p);toast('Ο κωδικός ορίστηκε.','ok');}}
   const rl=e.target.closest('[data-role]');if(rl){const u=us.find(x=>x.id===rl.dataset.role);u.role=u.role==='admin'?'teacher':'admin';await saveMeta();render();}
   const dl=e.target.closest('[data-del]');if(dl){const u=us.find(x=>x.id===dl.dataset.del);if(await confirmDlg(`Διαγραφή λογαριασμού «${esc(u.name)}»; Οι μαθητές του μεταφέρονται σε εσένα. Οι απολαβές του διαγράφονται.`,{danger:true,ok:'Διαγραφή'})){S.data.students.forEach(s=>{if(s.ownerId===u.id)s.ownerId=S.user.id;});S.data.materials.forEach(m=>{if(m.ownerId===u.id)m.ownerId=S.user.id;});S.meta.users=us.filter(x=>x.id!==u.id);await IDB.del('earn:'+u.id);await saveMeta();save();render();}}};}
};

function aiKeyDialog(done){const md=modal(`<div class="spread" style="margin-bottom:8px"><h3 style="margin:0">Σύνδεση τεχνητής νοημοσύνης</h3><button class="iconbtn" data-close aria-label="Κλείσιμο">${ic('x',18)}</button></div>
  <p class="small muted" style="margin-top:0">Το LUMIO χρησιμοποιεί δωρεάν μοντέλα μέσω της υπηρεσίας OpenRouter. Χρειάζεται ένα δωρεάν κλειδί, <b>χωρίς κάρτα</b>. Η εργασία σου μένει ανοιχτή εδώ.</p>
  <ol class="small" style="padding-left:18px;line-height:1.8;margin:0 0 14px"><li>Άνοιξε το <a href="https://openrouter.ai/keys" target="_blank" rel="noopener"><b>openrouter.ai/keys</b></a> (ανοίγει σε νέα καρτέλα).</li><li>Κάνε εγγραφή, π.χ. με λογαριασμό Google.</li><li>Πάτα <b>Create Key</b>, δώσε όνομα (π.χ. LUMIO), και αντίγραψε το κλειδί που ξεκινά με <b>sk-or-</b>.</li><li>Επικόλλησέ το εδώ.</li></ol>
  <div class="field"><label class="f" for="kk">Κλειδί</label><input class="in" id="kk" placeholder="sk-or-…" autocomplete="off" value="${esc(S.data.settings.aiKey||'')}"></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" data-close>Άκυρο</button><button class="btn pri" id="kgo">${ic('check',16)} Σύνδεση</button></div><div id="kmsg" style="margin-top:10px"></div>`);
  $('#kk',md.el).focus();$('#kgo',md.el).onclick=async e=>{const b=e.currentTarget;const k=$('#kk',md.el).value.trim();if(!/^sk-/.test(k))return $('#kmsg',md.el).innerHTML='<div class="warnbox">Το κλειδί πρέπει να ξεκινά με «sk-or-».</div>';b.disabled=true;b.innerHTML='<span class="spinner"></span> Έλεγχος…';const prev=S.data.settings.aiKey;S.data.settings.aiKey=k;
    try{await AI.chat([{role:'user',content:'Απάντησε μόνο με τη λέξη: έτοιμο'}],{temperature:0});save();md.close();toast('Η τεχνητή νοημοσύνη συνδέθηκε.','ok');done&&done();}
    catch(err){if(/κλειδί/.test(err.message)){S.data.settings.aiKey=prev;$('#kmsg',md.el).innerHTML='<div class="warnbox">Το κλειδί δεν έγινε δεκτό. Έλεγξε ότι το αντέγραψες ολόκληρο.</div>';}else{save();md.close();toast('Το κλειδί αποθηκεύτηκε. Τα δωρεάν μοντέλα είναι αυτή τη στιγμή φορτωμένα — δοκίμασε σε λίγο.','ok');done&&done();}b.disabled=false;b.innerHTML=ic('check',16)+' Σύνδεση';}};}

/* ===== Το προφίλ μου ===== */
function meAvatar(sz){const p=S.data&&S.data.profile&&S.data.profile.photo;return p?`<img class="meimg" src="${p}" alt="" style="width:${sz}px;height:${sz}px">`:`<span class="meav" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.42)}px">${esc((S.user.name||'?').trim()[0]||'?')}</span>`;}
const AGE_GROUPS=['Προσχολική','Δημοτικό','Γυμνάσιο','Λύκειο','Ενήλικες'];
function profileFields(){const P=S.data.profile;return[['Ονοματεπώνυμο',S.user.name],['Email',S.user.email],['Τηλέφωνο',P.phone],['Ειδικότητα',P.title],['Χώρος εργασίας',P.workplace||S.meta.org],['Πόλη',P.city],['Αντικείμενα',P.subjects],['Ηλικίες μαθητών',(P.ages||[]).length],['Χρόνια εμπειρίας',P.years],['Σύντομο βιογραφικό',P.bio],['Φωτογραφία',P.photo]];}
function viewProfile(){const P=S.data.profile;P.ages=P.ages||[];const f=profileFields();const done=f.filter(x=>x[1]).length;const pct=Math.round(done*100/f.length);const missing=f.filter(x=>!x[1]).map(x=>x[0]);
  M().innerHTML=`${pageHead('Το προφίλ μου','Τα στοιχεία σου εμφανίζονται στις αναφορές για τους γονείς και στις οικονομικές αναφορές')}
  <div class="side2"><form id="pf" class="stack" style="margin:0">
   <div class="card"><div class="profhead">${meAvatar(88)}<div><b style="font-size:1.15rem;display:block">${esc(S.user.name)}</b><span class="small muted">${esc(P.title||'Παιδαγωγός')}${P.city?' · '+esc(P.city):''}</span><div class="row" style="margin-top:10px"><label class="btn sm" for="ph">${ic('image',15)} ${P.photo?'Αλλαγή φωτογραφίας':'Προσθήκη φωτογραφίας'}</label><input type="file" id="ph" accept="image/*" class="hidden">${P.photo?`<button type="button" class="btn sm ghost" id="phx">${ic('trash',15)} Αφαίρεση</button>`:''}</div></div></div></div>
   <div class="card"><div class="card-h"><h3>Προσωπικά στοιχεία</h3></div><div class="grid g2" style="gap:12px">
    <div><label class="f" for="p-n">Ονοματεπώνυμο *</label><input class="in" id="p-n" name="name" required value="${esc(S.user.name)}" autocomplete="name"></div>
    <div><label class="f" for="p-e">Email *</label><input class="in" type="email" id="p-e" name="email" required value="${esc(S.user.email||'')}" autocomplete="email"><div class="tiny muted" style="margin-top:4px">Εδώ στέλνεται ο κωδικός ανάκτησης.</div></div>
    <div><label class="f" for="p-p">Τηλέφωνο</label><input class="in" type="tel" id="p-p" name="phone" value="${esc(P.phone||'')}" autocomplete="tel"></div>
    <div><label class="f" for="p-c">Πόλη / περιοχή</label><input class="in" id="p-c" name="city" value="${esc(P.city||'')}"></div></div></div>
   <div class="card"><div class="card-h"><h3>Επαγγελματικά στοιχεία</h3></div><div class="grid g2" style="gap:12px">
    <div><label class="f" for="p-t">Ειδικότητα</label><input class="in" id="p-t" name="title" value="${esc(P.title||'')}" placeholder="π.χ. Ειδική παιδαγωγός" list="titles"><datalist id="titles">${['Παιδαγωγός','Ειδική παιδαγωγός','Εκπαιδευτικός Πρωτοβάθμιας','Φιλόλογος','Μαθηματικός','Λογοθεραπεύτρια','Εργοθεραπεύτρια','Νηπιαγωγός'].map(x=>`<option>${x}</option>`).join('')}</datalist></div>
    <div><label class="f" for="p-w">Χώρος εργασίας</label><input class="in" id="p-w" name="workplace" value="${esc(P.workplace||S.meta.org||'')}" placeholder="π.χ. Κέντρο ειδικής αγωγής"></div>
    <div><label class="f" for="p-y">Χρόνια εμπειρίας</label><input class="in" type="number" min="0" max="60" id="p-y" name="years" value="${esc(P.years||'')}"></div>
    <div><label class="f" for="p-s">Αντικείμενα</label><input class="in" id="p-s" name="subjects" value="${esc(P.subjects||'')}" placeholder="π.χ. Γλώσσα, Μαθηματικά, Δυσλεξία"></div></div>
    <div class="field" style="margin-top:12px"><span class="f" style="display:block;font-size:.83rem;color:var(--ink2);margin-bottom:6px;font-weight:500">Ηλικίες μαθητών</span><div class="chips">${AGE_GROUPS.map(g=>`<label class="chip ${P.ages.includes(g)?'l':''}" style="cursor:pointer"><input type="checkbox" name="ages" value="${g}" ${P.ages.includes(g)?'checked':''} class="hidden">${g}</label>`).join('')}</div></div>
    <div><label class="f" for="p-b">Σύντομο βιογραφικό</label><textarea class="in" id="p-b" name="bio" style="min-height:90px" placeholder="Λίγα λόγια για σένα και τον τρόπο που δουλεύεις">${esc(P.bio||'')}</textarea></div></div>
   <div class="card"><div class="card-h"><h3>Στοιχεία για αποδείξεις</h3><span class="tiny muted">προαιρετικά</span></div><div class="grid g2" style="gap:12px">
    <div><label class="f" for="p-a">Διεύθυνση</label><input class="in" id="p-a" name="address" value="${esc(P.address||'')}" autocomplete="street-address"></div>
    <div><label class="f" for="p-v">ΑΦΜ</label><input class="in" id="p-v" name="vat" value="${esc(P.vat||'')}" inputmode="numeric"></div></div><p class="tiny muted" style="margin:10px 0 0">Εμφανίζονται μόνο στις οικονομικές αναφορές των Απολαβών.</p></div>
   <div class="row"><button class="btn pri lg">${ic('check',18)} Αποθήκευση</button><span class="small muted" id="dirty"></span></div></form>
  <aside class="stack"><div class="card"><div class="card-h"><h3>Συμπλήρωση προφίλ</h3><b>${pct}%</b></div><div class="bar"><i style="width:${pct}%;background:${pct===100?'var(--ok)':'var(--lilac-d)'}"></i></div>${missing.length?`<p class="small muted" style="margin:12px 0 0">Λείπουν: ${missing.map(esc).join(', ')}.</p>`:'<p class="small" style="margin:12px 0 0;color:var(--ok)">Το προφίλ σου είναι πλήρες.</p>'}</div>
   <div class="card"><div class="card-h"><h3>Λογαριασμός</h3></div><dl class="kv" style="grid-template-columns:110px 1fr;font-size:.88rem"><dt>Όνομα χρήστη</dt><dd>${esc(S.user.username)}</dd><dt>Ρόλος</dt><dd>${S.user.role==='admin'?'Διαχειριστής':'Παιδαγωγός'}</dd><dt>Μέλος από</dt><dd>${fmtDate(S.user.created)}</dd></dl>
    <div class="list" style="margin-top:14px"><a class="rw" href="#/settings/account"><span class="ricon">${ic('key',16)}</span><span class="grow"><b>Κωδικός & ανάκτηση</b></span>${ic('right',16)}</a><a class="rw" href="#/settings/security"><span class="ricon">${ic('shield',16)}</span><span class="grow"><b>Ασφάλεια</b></span>${ic('right',16)}</a><button class="rw danger" id="plo" type="button"><span class="ricon">${ic('logout',16)}</span><span class="grow"><b>Αποσύνδεση</b></span></button></div></div></aside></div>`;
  const form=$('#pf');form.oninput=()=>{$('#dirty').textContent='Υπάρχουν αλλαγές που δεν αποθηκεύτηκαν.';};
  $$('input[name=ages]',form).forEach(c=>c.onchange=()=>c.parentElement.classList.toggle('l',c.checked));
  $('#plo').onclick=askLogout;
  $('#ph').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=await imageToDataURL(f,320);P.photo=await thumbOf(d)||d;save();toast('Η φωτογραφία άλλαξε.','ok');render();}catch(err){toast(err.message,'bad');}};
  const px=$('#phx');if(px)px.onclick=()=>{delete P.photo;save();render();};
  form.onsubmit=async e=>{e.preventDefault();const o=fd(form);const em=(o.email||'').trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return toast('Έλεγξε το email.','bad');const emailChanged=em!==(S.user.email||'');
    S.user.name=o.name.trim()||S.user.name;S.user.email=em;await saveMeta();Object.assign(P,{phone:o.phone,city:o.city,title:o.title,workplace:o.workplace,years:o.years,subjects:o.subjects,bio:o.bio,address:o.address,vat:o.vat,email:em,ages:$$('input[name=ages]:checked',form).map(c=>c.value)});save();
    toast('Το προφίλ αποθηκεύτηκε.','ok');render();
    if(emailChanged&&await confirmDlg('Άλλαξες email. Να σταλεί νέος κωδικός ανάκτησης στη νέα διεύθυνση;',{ok:'Αποστολή'})){const code=await newRecovery(S.user.id);const st=await mailRecovery(S.user,code);const m=modal(`<h3>Νέος κωδικός ανάκτησης</h3>${recoveryHTML(code)}${recoverySendBlock(S.user,code,st)}<button class="btn pri block" data-close>Εντάξει</button>`);bindRecoveryCopy(code,m.el);}};}

boot();
</script></body></html>
